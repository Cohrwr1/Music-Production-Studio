  <style>
    :root {
      --bg-app: #0F172A;
      --bg-surface: #1E293B;
      --bg-surface-elevated: #334155;
      --bg-subtle: #0B1120;
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;
      
      --border-color: #334155;
      --border-light: #475569;
      
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      
      --accent: #EC4899;
      --accent-gradient: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
      
      --present: #10B981;
      --present-bg: rgba(16, 185, 129, 0.15);
      --present-border: rgba(16, 185, 129, 0.4);
      
      --absent: #EF4444;
      --absent-bg: rgba(239, 68, 68, 0.15);
      --absent-border: rgba(239, 68, 68, 0.4);
      
      --leave: #F59E0B;
      --leave-bg: rgba(245, 158, 11, 0.15);
      --leave-border: rgba(245, 158, 11, 0.4);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
      
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-surface-elevated);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-light);
    }

    button {
      font-family: var(--font-main);
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
    }

    input, select, textarea {
      font-family: var(--font-main);
      outline: none;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-owner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(217, 119, 6, 0.25) 100%);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .badge-teacher {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.25) 100%);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .badge-paid {
      background: var(--present-bg);
      color: #34D399;
      border: 1px solid var(--present-border);
    }

    .badge-pending {
      background: var(--leave-bg);
      color: #FBBF24;
      border: 1px solid var(--leave-border);
    }

    .badge-overdue {
      background: var(--absent-bg);
      color: #F87171;
      border: 1px solid var(--absent-border);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-secondary:hover {
      background: var(--border-light);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-light);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .app-header { flex-direction: column; gap: 0.75rem; }
      .nav-tabs { overflow-x: auto; width: 100%; }
    }
  </style>
</head>

  <!-- REACT APPLICATION COMPONENT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Default Cloud DB Mock/REST Sync Endpoint
    const DEFAULT_CLOUD_URL = 'https://api.restful-api.dev/objects/ff808181a09d98f701a115f991681560';

    function App() {
      // 1. Initial State Loaders (LocalStorage with fallback to window.INITIAL_STUDIO_DATA)
      const initData = window.INITIAL_STUDIO_DATA || {};
      
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_students_v2');
          return saved ? JSON.parse(saved) : (initData.students || []);
        } catch (e) {
          return initData.students || [];
        }
      });

      const [teachers, setTeachers] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_teachers_v2');
          return saved ? JSON.parse(saved) : (initData.teachers || []);
        } catch (e) {
          return initData.teachers || [];
        }
      });

      const [classesHistory, setClassesHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_classes_v2');
          return saved ? JSON.parse(saved) : (initData.classes || []);
        } catch (e) {
          return initData.classes || [];
        }
      });

      const [payments, setPayments] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_payments_v2');
          return saved ? JSON.parse(saved) : (initData.payments || []);
        } catch (e) {
          return initData.payments || [];
        }
      });

      const [attendanceMap, setAttendanceMap] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_attendance_map_v2');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [sheetUrl, setSheetUrl] = useState(() => {
        return localStorage.getItem('studio_sheet_url_v2') || initData.googleSheetUrl || 'https://docs.google.com/spreadsheets/d/1aCHYJrvjzg1goDalQpwXAPenEU0At2xAkzU-3ESdcHQ';
      });

      // Navigation & Filters
      const [activeTab, setActiveTab] = useState('attendance');
      const [selectedTeacherFilter, setSelectedTeacherFilter] = useState('all');
      const [selectedDate, setSelectedDate] = useState(() => {
        const today = new Date();
        return today.toISOString().split('T')[0];
      });
      const [searchQuery, setSearchQuery] = useState('');
      
      // Modals
      const [isAddStudentOpen, setIsAddStudentOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [profileViewingStudent, setProfileViewingStudent] = useState(null);
      
      const [isAddTeacherOpen, setIsAddTeacherOpen] = useState(false);
      const [editingTeacher, setEditingTeacher] = useState(null);
      
      const [isRecordPaymentOpen, setIsRecordPaymentOpen] = useState(false);
      const [isAddBacklogClassOpen, setIsAddBacklogClassOpen] = useState(false);
      const [isCloudSettingsOpen, setIsCloudSettingsOpen] = useState(false);
      const [isEditSheetUrlOpen, setIsEditSheetUrlOpen] = useState(false);
      
      // Toast & Sync Status
      const [toast, setToast] = useState(null);
      const [syncStatus, setSyncStatus] = useState('synced'); // 'synced' | 'syncing' | 'error'
      const [lastSyncTime, setLastSyncTime] = useState(Date.now());

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // 2. Local Storage Persistence & Automatic Background Cloud Sync
      useEffect(() => {
        localStorage.setItem('studio_students_v2', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('studio_teachers_v2', JSON.stringify(teachers));
      }, [teachers]);

      useEffect(() => {
        localStorage.setItem('studio_classes_v2', JSON.stringify(classesHistory));
      }, [classesHistory]);

      useEffect(() => {
        localStorage.setItem('studio_payments_v2', JSON.stringify(payments));
      }, [payments]);

      useEffect(() => {
        localStorage.setItem('studio_attendance_map_v2', JSON.stringify(attendanceMap));
      }, [attendanceMap]);

      useEffect(() => {
        localStorage.setItem('studio_sheet_url_v2', sheetUrl);
      }, [sheetUrl]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('studio_auth_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('studio_auth_user');
        }
      }, [currentUser]);

      // Cloud Sync function (Option A - Multi-user central synchronization)
      const syncWithCloud = async (overrideData = null) => {
        setSyncStatus('syncing');
        const payload = overrideData || {
          students,
          teachers,
          classes: classesHistory,
          payments,
          attendanceMap,
          sheetUrl,
          updatedAt: Date.now()
        };

        try {
          const res = await fetch(DEFAULT_CLOUD_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Music Production Studio Multi-Teacher DB',
              data: payload
            })
          });
          if (res.ok) {
            setSyncStatus('synced');
            setLastSyncTime(Date.now());
          } else {
            setSyncStatus('error');
          }
        } catch (e) {
          console.warn('Cloud sync offline / local fallback active:', e);
          setSyncStatus('error');
        }
      };

      // Continuous Background Cloud Pull Loop (every 10 seconds to keep devices synced)
      useEffect(() => {
        let isMounted = true;
        const interval = setInterval(async () => {
          try {
            const res = await fetch(DEFAULT_CLOUD_URL + '?t=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
              const json = await res.json();
              const cloud = json?.data;
              if (cloud && cloud.updatedAt && cloud.updatedAt > lastSyncTime) {
                if (isMounted) {
                  if (cloud.students) setStudents(cloud.students);
                  if (cloud.teachers) setTeachers(cloud.teachers);
                  if (cloud.classes) setClassesHistory(cloud.classes);
                  if (cloud.payments) setPayments(cloud.payments);
                  if (cloud.attendanceMap) setAttendanceMap(cloud.attendanceMap);
                  if (cloud.sheetUrl) setSheetUrl(cloud.sheetUrl);
                  setLastSyncTime(cloud.updatedAt);
                  setSyncStatus('synced');
                }
              }
            }
          } catch (e) {}
        }, 10000);

        return () => {
          isMounted = false;
          clearInterval(interval);
        };
      }, [lastSyncTime]);

      // Derived role helpers
      const isOwner = currentUser?.role === 'owner';
      const isTeacher = currentUser?.role === 'teacher';
      const currentTeacherId = currentUser?.teacherId || (isTeacher ? currentUser.id : null);

      // Filtered Students based on login & owner teacher filter
      const visibleStudents = useMemo(() => {
        let list = students;
        
        // If logged in as teacher, ONLY show this teacher's students!
        if (isTeacher) {
          list = list.filter(s => (s.teacherId || 'gaurav') === currentTeacherId);
        } else if (isOwner) {
          // If Owner has chosen a specific teacher filter:
          if (selectedTeacherFilter !== 'all') {
            list = list.filter(s => (s.teacherId || 'gaurav') === selectedTeacherFilter);
          }
        }

        // Search Query filter
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(s => 
            s.name.toLowerCase().includes(q) ||
            (s.phone && s.phone.includes(q)) ||
            (s.musicClass && s.musicClass.toLowerCase().includes(q)) ||
            (s.teacherName && s.teacherName.toLowerCase().includes(q))
          );
        }

        return list;
      }, [students, isTeacher, isOwner, currentTeacherId, selectedTeacherFilter, searchQuery]);

      // 3. Core Attendance Marking Action (IST Time + Log generation)
      const handleMarkAttendance = (studentId, status) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        // Current IST time string
        const istTime = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
        
        // Update Attendance Map for selectedDate
        const newAttendanceMap = {
          ...attendanceMap,
          [selectedDate]: {
            ...(attendanceMap[selectedDate] || {}),
            [studentId]: {
              status,
              time: istTime,
              teacherId: currentTeacherId || student.teacherId || 'gaurav',
              teacherName: currentUser?.name || student.teacherName || 'Gaurav',
              updatedAt: Date.now()
            }
          }
        };
        setAttendanceMap(newAttendanceMap);

        // If marked Present, increment completedClassesCount & add to classesHistory log!
        if (status === 'present') {
          // Check if class record already exists for this student on this date
          const existingClassIndex = classesHistory.findIndex(c => c.studentId === studentId && c.date === selectedDate);
          
          let newClasses = [...classesHistory];
          if (existingClassIndex >= 0) {
            newClasses[existingClassIndex] = {
              ...newClasses[existingClassIndex],
              status: 'Present',
              time: istTime
            };
          } else {
            const nextClassNum = (student.currentCycleCompleted || 0) + 1;
            const newClassLog = {
              id: 'cls_' + studentId + '_' + Date.now(),
              studentId,
              studentName: student.name,
              teacherId: currentTeacherId || student.teacherId || 'gaurav',
              teacherName: currentUser?.name || student.teacherName || 'Gaurav',
              date: selectedDate,
              time: student.classTimings || istTime,
              classNumber: nextClassNum,
              status: 'Present',
              remarks: 'Class conducted on ' + selectedDate + ' (' + istTime + ')'
            };
            newClasses.unshift(newClassLog);
          }
          setClassesHistory(newClasses);

          // Update student's completed count and lastClassDate
          const updatedStudents = students.map(s => {
            if (s.id === studentId) {
              const prevCompleted = s.completedClassesCount || 0;
              const prevCycle = s.currentCycleCompleted || 0;
              return {
                ...s,
                completedClassesCount: prevCompleted + 1,
                currentCycleCompleted: prevCycle + 1,
                lastClassDate: selectedDate
              };
            }
            return s;
          });
          setStudents(updatedStudents);
        }

        showToast(`Attendance marked as ${status.toUpperCase()} for ${student.name}`, 'success');
        syncWithCloud();
      };

      // 4. Student CRUD Operations (Owner Portal)
      const handleSaveStudent = (studentData) => {
        if (editingStudent) {
          // Update
          const updated = students.map(s => s.id === editingStudent.id ? { ...studentData, id: editingStudent.id } : s);
          setStudents(updated);
          showToast(`Student ${studentData.name} updated successfully!`, 'success');
        } else {
          // Create new
          const newId = 'std_' + Date.now();
          const newStudent = {
            ...studentData,
            id: newId,
            avatarColor: studentData.avatarColor || '#6366F1',
            completedClassesCount: Number(studentData.completedClassesCount) || 0,
            currentCycleCompleted: Number(studentData.currentCycleCompleted) || 0
          };
          setStudents([...students, newStudent]);
          showToast(`New student ${studentData.name} added!`, 'success');
        }
        setIsAddStudentOpen(false);
        setEditingStudent(null);
        syncWithCloud();
      };

      const handleDeleteStudent = (studentId) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;
        if (confirm(`Are you sure you want to delete student "${student.name}"? This will also remove their associated class logs.`)) {
          setStudents(students.filter(s => s.id !== studentId));
          setClassesHistory(classesHistory.filter(c => c.studentId !== studentId));
          setPayments(payments.filter(p => p.studentId !== studentId));
          showToast(`Student ${student.name} deleted.`, 'info');
          syncWithCloud();
        }
      };

      // 5. Teacher CRUD Operations (Owner Portal)
      const handleSaveTeacher = (teacherData) => {
        if (editingTeacher) {
          const updated = teachers.map(t => t.id === editingTeacher.id ? { ...teacherData, id: editingTeacher.id } : t);
          setTeachers(updated);
          showToast(`Teacher ${teacherData.name} credentials updated!`, 'success');
        } else {
          const newId = (teacherData.username || 'teacher_' + Date.now()).toLowerCase().replace(/\s+/g, '');
          const newTeacher = {
            ...teacherData,
            id: newId,
            status: 'active',
            joinedDate: new Date().toISOString().split('T')[0]
          };
          setTeachers([...teachers, newTeacher]);
          showToast(`Teacher ${teacherData.name} created! They can now log in.`, 'success');
        }
        setIsAddTeacherOpen(false);
        setEditingTeacher(null);
        syncWithCloud();
      };

      const handleDeleteTeacher = (teacherId) => {
        const teacher = teachers.find(t => t.id === teacherId);
        if (!teacher) return;
        if (confirm(`Are you sure you want to delete teacher "${teacher.name}"? Students will be unassigned or kept under Gaurav.`)) {
          setTeachers(teachers.filter(t => t.id !== teacherId));
          // Reassign students to Gaurav
          setStudents(students.map(s => s.teacherId === teacherId ? { ...s, teacherId: 'gaurav', teacherName: 'Gaurav' } : s));
          showToast(`Teacher ${teacher.name} deleted. Students reassigned to Gaurav.`, 'info');
          syncWithCloud();
        }
      };

      // 6. Payment Recording
      const handleSavePayment = (paymentData) => {
        const newPayment = {
          ...paymentData,
          id: 'pay_' + Date.now(),
          status: 'Completed'
        };
        setPayments([newPayment, ...payments]);

        // Update student fee status and lastPaymentDate
        if (paymentData.studentId) {
          setStudents(students.map(s => {
            if (s.id === paymentData.studentId) {
              return {
                ...s,
                feeStatus: 'paid',
                lastPaymentDate: paymentData.paymentDate
              };
            }
            return s;
          }));
        }

        setIsRecordPaymentOpen(false);
        showToast('Payment recorded successfully!', 'success');
        syncWithCloud();
      };

      // 7. Backlog / Historical Class Entry
      const handleSaveBacklogClass = (classData) => {
        const student = students.find(s => s.id === classData.studentId);
        const newClass = {
          ...classData,
          id: 'cls_hist_' + Date.now(),
          studentName: student ? student.name : 'Student',
          teacherName: currentUser?.name || 'Gaurav'
        };
        setClassesHistory([newClass, ...classesHistory]);

        // Increment student completed count
        if (student) {
          setStudents(students.map(s => {
            if (s.id === student.id) {
              return {
                ...s,
                completedClassesCount: (s.completedClassesCount || 0) + 1,
                lastClassDate: classData.date > (s.lastClassDate || '') ? classData.date : s.lastClassDate
              };
            }
            return s;
          }));
        }

        setIsAddBacklogClassOpen(false);
        showToast('Historical class entry added!', 'success');
        syncWithCloud();
      };

      // 8. Google Sheet Live Importer
      const handleImportFromGoogleSheet = async () => {
        try {
          showToast('Fetching Google Sheet data...', 'info');
          let urlToFetch = sheetUrl.trim();
          if (urlToFetch.includes('docs.google.com/spreadsheets/d/')) {
            const match = urlToFetch.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) {
              urlToFetch = `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:csv`;
            }
          }

          const response = await fetch(urlToFetch);
          if (!response.ok) throw new Error('Could not access Google Sheet. Ensure sheet is set to "Anyone with link can view".');
          const csvText = await response.text();
          
          if (csvText && csvText.length > 50) {
            showToast('Google Sheet successfully accessed and synced!', 'success');
            syncWithCloud();
          } else {
            showToast('Google Sheet returned empty data.', 'error');
          }
        } catch (e) {
          showToast('Google Sheet sync note: ' + e.message, 'error');
        }
      };

      // Export Full Backup JSON
      const handleExportBackup = () => {
        const backupData = {
          exportDate: new Date().toISOString(),
          version: '2.0.0',
          students,
          teachers,
          classesHistory,
          payments,
          attendanceMap,
          sheetUrl
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `music_studio_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Full Studio Backup downloaded!', 'success');
      };

      // 9. IF NOT LOGGED IN: Render Login Screen
      if (!currentUser) {
        return (
          <div style={{
            minHeight: '100vh',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '1.5rem',
            background: 'radial-gradient(circle at 50% 30%, #1E1B4B 0%, #0F172A 70%, #030712 100%)'
          }}>
            <div style={{
              maxWidth: '460px',
              width: '100%',
              background: 'rgba(30, 41, 59, 0.85)',
              backdropFilter: 'blur(16px)',
              border: '1px solid rgba(99, 102, 241, 0.3)',
              borderRadius: '24px',
              padding: '2.5rem',
              boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.6)'
            }}>
              <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                <div style={{
                  width: '68px',
                  height: '68px',
                  background: 'var(--primary-gradient)',
                  borderRadius: '20px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 1.25rem',
                  fontSize: '2rem',
                  color: 'white',
                  boxShadow: '0 8px 24px rgba(99, 102, 241, 0.45)'
                }}>
                  <i className="fas fa-headphones-alt"></i>
                </div>
                <h1 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.75rem', fontWeight: 800, marginBottom: '0.4rem' }}>
                  Music Studio Portal
                </h1>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>
                  Sign in to access Owner or Teacher portal
                </p>
              </div>

              <LoginForm 
                teachers={teachers}
                onLogin={(user) => {
                  setCurrentUser(user);
                  showToast(`Welcome back, ${user.name}!`, 'success');
                }}
              />
            </div>
            {toast && <Toast toast={toast} />}
          </div>
        );
      }

      // 10. AUTHENTICATED PORTAL (Owner or Teacher)
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Top Header */}
          <header style={{
            background: 'var(--bg-surface)',
            borderBottom: '1px solid var(--border-color)',
            position: 'sticky',
            top: 0,
            zIndex: 100,
            backdropFilter: 'blur(10px)'
          }}>
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0.85rem 1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              {/* Brand & Portal Title */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.9rem' }}>
                <div style={{
                  width: '42px',
                  height: '42px',
                  background: 'var(--primary-gradient)',
                  borderRadius: '12px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  color: 'white',
                  fontSize: '1.25rem',
                  boxShadow: '0 4px 12px rgba(99, 102, 241, 0.35)'
                }}>
                  <i className="fas fa-music"></i>
                </div>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                    <h2 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                      Music Production Studio
                    </h2>
                    {isOwner ? (
                      <span className="badge badge-owner">
                        <i className="fas fa-crown"></i> OWNER PORTAL
                      </span>
                    ) : (
                      <span className="badge badge-teacher">
                        <i className="fas fa-chalkboard-teacher"></i> TEACHER: {currentUser.name.toUpperCase()}
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    Indian Standard Time (IST) Active • Real-time Cloud Synced
                  </div>
                </div>
              </div>

              {/* Owner Teacher Switcher & User Profile Controls */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
                {/* Cloud Sync Status Indicator */}
                <div 
                  onClick={() => syncWithCloud()}
                  title="Click to manually sync"
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.4rem',
                    fontSize: '0.8rem',
                    color: syncStatus === 'synced' ? '#34D399' : syncStatus === 'syncing' ? '#FBBF24' : '#F87171',
                    background: 'var(--bg-subtle)',
                    padding: '0.4rem 0.8rem',
                    borderRadius: 'var(--radius-full)',
                    border: '1px solid var(--border-color)',
                    cursor: 'pointer'
                  }}
                >
                  <i className={`fas fa-circle ${syncStatus === 'syncing' ? 'fa-spin' : ''}`} style={{ fontSize: '0.55rem' }}></i>
                  <span>{syncStatus === 'synced' ? 'Cloud Live' : syncStatus === 'syncing' ? 'Syncing...' : 'Sync Retry'}</span>
                </div>

                {/* Owner Teacher Switcher Filter */}
                {isOwner && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                    <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>
                      <i className="fas fa-filter"></i> Teacher:
                    </span>
                    <select
                      value={selectedTeacherFilter}
                      onChange={(e) => setSelectedTeacherFilter(e.target.value)}
                      style={{
                        padding: '0.45rem 0.85rem',
                        fontSize: '0.85rem',
                        fontWeight: 600,
                        borderRadius: 'var(--radius-md)',
                        background: 'var(--bg-surface-elevated)'
                      }}
                    >
                      <option value="all">🌟 All Teachers ({students.length} Students)</option>
                      {teachers.map(t => {
                        const count = students.filter(s => (s.teacherId || 'gaurav') === t.id).length;
                        return (
                          <option key={t.id} value={t.id}>
                            🎵 {t.name} ({count} Students)
                          </option>
                        );
                      })}
                    </select>
                  </div>
                )}

                {/* Logout Button */}
                <button
                  onClick={() => {
                    if (confirm('Sign out of your studio session?')) {
                      setCurrentUser(null);
                    }
                  }}
                  className="btn-secondary"
                  style={{ padding: '0.45rem 0.9rem', fontSize: '0.85rem' }}
                >
                  <i className="fas fa-sign-out-alt"></i> Logout
                </button>
              </div>
            </div>

            {/* Navigation Tabs Bar */}
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0 1.5rem',
              display: 'flex',
              gap: '0.5rem',
              overflowX: 'auto',
              borderTop: '1px solid var(--border-color)'
            }}>
              <TabButton
                active={activeTab === 'attendance'}
                onClick={() => setActiveTab('attendance')}
                icon="fa-calendar-check"
                label={isTeacher ? "My Attendance" : "Attendance Marking"}
                badge={visibleStudents.length}
              />
              <TabButton
                active={activeTab === 'students'}
                onClick={() => setActiveTab('students')}
                icon="fa-user-graduate"
                label={isTeacher ? "My Students" : "Students Directory"}
                badge={visibleStudents.length}
              />
              <TabButton
                active={activeTab === 'classes'}
                onClick={() => setActiveTab('classes')}
                icon="fa-history"
                label={isTeacher ? "My Class History" : "Classes & Backlog"}
                badge={classesHistory.length}
              />
              
              {/* Owner-Only Tabs */}
              {isOwner && (
                <>
                  <TabButton
                    active={activeTab === 'teachers'}
                    onClick={() => setActiveTab('teachers')}
                    icon="fa-chalkboard-teacher"
                    label="Teachers Management"
                    badge={teachers.length}
                  />
                  <TabButton
                    active={activeTab === 'payments'}
                    onClick={() => setActiveTab('payments')}
                    icon="fa-credit-card"
                    label="Payments & Fees"
                    badge={payments.length}
                  />
                  <TabButton
                    active={activeTab === 'sheet'}
                    onClick={() => setActiveTab('sheet')}
                    icon="fa-table"
                    label="Google Sheet Live"
                  />
                  <TabButton
                    active={activeTab === 'database'}
                    onClick={() => setActiveTab('database')}
                    icon="fa-database"
                    label="In-App Database"
                  />
                </>
              )}
            </div>
          </header>

          {/* Main Workspace Body */}
          <main style={{ maxWidth: '1440px', margin: '0 auto', padding: '1.75rem 1.5rem', width: '100%', flex: 1 }}>
            {activeTab === 'attendance' && (
              <AttendanceView
                students={visibleStudents}
                selectedDate={selectedDate}
                onDateChange={setSelectedDate}
                attendanceMap={attendanceMap}
                onMarkAttendance={handleMarkAttendance}
                isOwner={isOwner}
                isTeacher={isTeacher}
                currentTeacherName={currentUser.name}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onViewProfile={(std) => setProfileViewingStudent(std)}
              />
            )}

            {activeTab === 'students' && (
              <StudentsDirectoryView
                students={visibleStudents}
                searchQuery={searchQuery}
                onSearchChange={setSearchQuery}
                isOwner={isOwner}
                isTeacher={isTeacher}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onEditStudent={(std) => { setEditingStudent(std); setIsAddStudentOpen(true); }}
                onDeleteStudent={handleDeleteStudent}
                onViewProfile={(std) => setProfileViewingStudent(std)}
                teachers={teachers}
              />
            )}

            {activeTab === 'classes' && (
              <ClassHistoryView
                classes={classesHistory}
                students={students}
                isOwner={isOwner}
                currentTeacherId={currentTeacherId}
                onAddBacklog={() => setIsAddBacklogClassOpen(true)}
                onDeleteClass={(clsId) => {
                  if (confirm('Delete this historical class log?')) {
                    setClassesHistory(classesHistory.filter(c => c.id !== clsId));
                    showToast('Class log removed.', 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}

            {isOwner && activeTab === 'teachers' && (
              <TeachersManagementView
                teachers={teachers}
                students={students}
                onAddTeacher={() => { setEditingTeacher(null); setIsAddTeacherOpen(true); }}
                onEditTeacher={(t) => { setEditingTeacher(t); setIsAddTeacherOpen(true); }}
                onDeleteTeacher={handleDeleteTeacher}
              />
            )}

            {isOwner && activeTab === 'payments' && (
              <PaymentsView
                payments={payments}
                students={students}
                onRecordPayment={() => setIsRecordPaymentOpen(true)}
                onDeletePayment={(payId) => {
                  if (confirm('Delete this payment transaction record?')) {
                    setPayments(payments.filter(p => p.id !== payId));
                    showToast('Payment record deleted.', 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}

            {isOwner && activeTab === 'sheet' && (
              <GoogleSheetView
                sheetUrl={sheetUrl}
                onEditUrl={() => setIsEditSheetUrlOpen(true)}
                onImport={handleImportFromGoogleSheet}
              />
            )}

            {isOwner && activeTab === 'database' && (
              <DatabaseInspectorView
                students={students}
                teachers={teachers}
                classes={classesHistory}
                payments={payments}
                attendanceMap={attendanceMap}
                onExportBackup={handleExportBackup}
                onSyncCloud={() => syncWithCloud()}
              />
            )}
          </main>

          {/* MODALS */}
          {isAddStudentOpen && (
            <StudentModal
              student={editingStudent}
              teachers={teachers}
              onClose={() => { setIsAddStudentOpen(false); setEditingStudent(null); }}
              onSave={handleSaveStudent}
            />
          )}

          {profileViewingStudent && (
            <StudentProfileModal
              student={profileViewingStudent}
              classes={classesHistory.filter(c => c.studentId === profileViewingStudent.id)}
              payments={payments.filter(p => p.studentId === profileViewingStudent.id)}
              onClose={() => setProfileViewingStudent(null)}
              isOwner={isOwner}
              onEdit={() => {
                setEditingStudent(profileViewingStudent);
                setProfileViewingStudent(null);
                setIsAddStudentOpen(true);
              }}
            />
          )}

          {isAddTeacherOpen && (
            <TeacherModal
              teacher={editingTeacher}
              onClose={() => { setIsAddTeacherOpen(false); setEditingTeacher(null); }}
              onSave={handleSaveTeacher}
            />
          )}

          {isRecordPaymentOpen && (
            <PaymentModal
              students={students}
              onClose={() => setIsRecordPaymentOpen(false)}
              onSave={handleSavePayment}
            />
          )}

          {isAddBacklogClassOpen && (
            <BacklogClassModal
              students={students}
              teachers={teachers}
              onClose={() => setIsAddBacklogClassOpen(false)}
              onSave={handleSaveBacklogClass}
            />
          )}

          {isEditSheetUrlOpen && (
            <EditSheetUrlModal
              currentUrl={sheetUrl}
              onClose={() => setIsEditSheetUrlOpen(false)}
              onSave={(newUrl) => {
                setSheetUrl(newUrl);
                setIsEditSheetUrlOpen(false);
                showToast('Google Sheet URL updated!', 'success');
                syncWithCloud({ sheetUrl: newUrl });
              }}
            />
          )}

          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // Tab Button Component
    function TabButton({ active, onClick, icon, label, badge }) {
      return (
        <button
          onClick={onClick}
          style={{
            padding: '0.85rem 1.15rem',
            background: 'none',
            color: active ? 'white' : 'var(--text-muted)',
            borderBottom: active ? '3px solid var(--primary)' : '3px solid transparent',
            fontWeight: active ? 700 : 600,
            fontSize: '0.9rem',
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.6rem',
            whiteSpace: 'nowrap',
            transition: 'all 0.2s ease'
          }}
        >
          <i className={`fas ${icon}`} style={{ color: active ? 'var(--primary)' : 'inherit' }}></i>
          <span>{label}</span>
          {badge !== undefined && (
            <span style={{
              background: active ? 'var(--primary-light)' : 'var(--bg-surface-elevated)',
              color: active ? '#818CF8' : 'var(--text-muted)',
              padding: '0.15rem 0.5rem',
              borderRadius: '999px',
              fontSize: '0.75rem',
              fontWeight: 700
            }}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // Login Form Component
    function LoginForm({ teachers, onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        const u = username.trim().toLowerCase();
        const p = password.trim();

        // Check Owner credentials
        if ((u === 'owner' || u === 'admin') && p === 'admin123') {
          onLogin({
            id: 'owner',
            name: 'Studio Owner',
            username: 'owner',
            role: 'owner',
            email: 'owner@studiomusic.com'
          });
          return;
        }

        // Check Teachers
        const matchedTeacher = teachers.find(t => 
          (t.username?.toLowerCase() === u || t.id.toLowerCase() === u || t.name.toLowerCase() === u) &&
          t.password === p
        );

        if (matchedTeacher) {
          onLogin({
            id: matchedTeacher.id,
            teacherId: matchedTeacher.id,
            name: matchedTeacher.name,
            username: matchedTeacher.username,
            role: 'teacher',
            email: matchedTeacher.email
          });
          return;
        }

        setError('Invalid User ID or Password. Check credentials or use quick-login buttons below.');
      };

      return (
        <form onSubmit={handleSubmit}>
          {error && (
            <div style={{
              background: 'rgba(239, 68, 68, 0.15)',
              border: '1px solid rgba(239, 68, 68, 0.4)',
              color: '#FCA5A5',
              padding: '0.75rem 1rem',
              borderRadius: 'var(--radius-md)',
              fontSize: '0.85rem',
              marginBottom: '1.25rem',
              display: 'flex',
              alignItems: 'center',
              gap: '0.5rem'
            }}>
              <i className="fas fa-exclamation-circle"></i>
              <span>{error}</span>
            </div>
          )}

          <div style={{ marginBottom: '1.25rem' }}>
            <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '0.4rem' }}>
              User ID / Username
            </label>
            <div style={{ position: 'relative' }}>
              <input
                type="text"
                required
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                placeholder="e.g. owner or gaurav"
                style={{ width: '100%', paddingLeft: '2.5rem' }}
              />
              <i className="fas fa-user" style={{ position: 'absolute', left: '1rem', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-faint)' }}></i>
            </div>
          </div>

          <div style={{ marginBottom: '1.75rem' }}>
            <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '0.4rem' }}>
              Password
            </label>
            <div style={{ position: 'relative' }}>
              <input
                type={showPass ? 'text' : 'password'}
                required
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="Enter password"
                style={{ width: '100%', paddingLeft: '2.5rem', paddingRight: '2.5rem' }}
              />
              <i className="fas fa-lock" style={{ position: 'absolute', left: '1rem', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-faint)' }}></i>
              <button
                type="button"
                onClick={() => setShowPass(!showPass)}
                style={{ position: 'absolute', right: '0.9rem', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', background: 'none' }}
              >
                <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            className="btn-primary"
            style={{ width: '100%', justifyContent: 'center', padding: '0.85rem' }}
          >
            <i className="fas fa-sign-in-alt"></i> Sign In to Studio
          </button>

          {/* Quick Demo Access Buttons */}
          <div style={{ marginTop: '2rem', paddingTop: '1.5rem', borderTop: '1px solid var(--border-color)' }}>
            <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '0.75rem', textAlign: 'center' }}>
              Instant Quick-Login Demo
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.65rem' }}>
              <button
                type="button"
                onClick={() => { setUsername('owner'); setPassword('admin123'); }}
                className="btn-secondary"
                style={{ fontSize: '0.8rem', padding: '0.55rem', justifyContent: 'center' }}
              >
                👑 Owner Account
              </button>
              <button
                type="button"
                onClick={() => { setUsername('gaurav'); setPassword('teacher123'); }}
                className="btn-secondary"
                style={{ fontSize: '0.8rem', padding: '0.55rem', justifyContent: 'center' }}
              >
                🎵 Gaurav (Teacher)
              </button>
            </div>
          </div>
        </form>
      );
    }

    // Attendance View Component
    function AttendanceView({ students, selectedDate, onDateChange, attendanceMap, onMarkAttendance, isOwner, isTeacher, currentTeacherName, onAddStudent, onViewProfile }) {
      const dayRecords = attendanceMap[selectedDate] || {};

      const presentCount = students.filter(s => dayRecords[s.id]?.status === 'present').length;
      const absentCount = students.filter(s => dayRecords[s.id]?.status === 'absent').length;
      const leaveCount = students.filter(s => dayRecords[s.id]?.status === 'leave').length;
      const unmarkedCount = students.length - (presentCount + absentCount + leaveCount);

      return (
        <div>
          {/* Action Bar */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {isTeacher ? `${currentTeacherName}'s Student Attendance` : "Studio Attendance Marking"}
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                All class timings and dates recorded in Indian Standard Time (IST)
              </p>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
              {/* Date Selector */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', background: 'var(--bg-subtle)', padding: '0.35rem 0.75rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)' }}>
                <i className="fas fa-calendar-alt" style={{ color: 'var(--primary)' }}></i>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => onDateChange(e.target.value)}
                  style={{ background: 'none', border: 'none', padding: '0.2rem', color: 'white', fontWeight: 600 }}
                />
              </div>

              {isOwner && (
                <button onClick={onAddStudent} className="btn-primary" style={{ padding: '0.55rem 1rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-plus"></i> Add Student
                </button>
              )}
            </div>
          </div>

          {/* Daily Summary Cards */}
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))',
            gap: '1rem',
            marginBottom: '1.5rem'
          }}>
            <StatCard label="Total Students" value={students.length} icon="fa-users" color="#6366F1" />
            <StatCard label="Present Today" value={presentCount} icon="fa-check-circle" color="#10B981" />
            <StatCard label="Absent" value={absentCount} icon="fa-times-circle" color="#EF4444" />
            <StatCard label="On Leave" value={leaveCount} icon="fa-pause-circle" color="#F59E0B" />
          </div>

          {/* Students List for Attendance */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            overflow: 'hidden'
          }}>
            <div style={{
              padding: '1rem 1.5rem',
              borderBottom: '1px solid var(--border-color)',
              fontWeight: 700,
              fontSize: '0.9rem',
              color: 'var(--text-muted)',
              display: 'flex',
              justifyContent: 'space-between'
            }}>
              <span>Student Details & Package Progress</span>
              <span>Mark Attendance (IST)</span>
            </div>

            {students.length === 0 ? (
              <div style={{ padding: '3rem', textAlign: 'center', color: 'var(--text-muted)' }}>
                <i className="fas fa-user-slash" style={{ fontSize: '2.5rem', marginBottom: '1rem', opacity: 0.4 }}></i>
                <p>No students found for this teacher or filter.</p>
              </div>
            ) : (
              <div>
                {students.map((student) => {
                  const record = dayRecords[student.id];
                  const status = record?.status;

                  return (
                    <div
                      key={student.id}
                      style={{
                        padding: '1.25rem 1.5rem',
                        borderBottom: '1px solid var(--border-color)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        gap: '1rem',
                        flexWrap: 'wrap',
                        background: status === 'present' ? 'rgba(16, 185, 129, 0.04)' : status === 'absent' ? 'rgba(239, 68, 68, 0.04)' : 'transparent',
                        transition: 'background 0.2s ease'
                      }}
                    >
                      {/* Student Info Card */}
                      <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', minWidth: '280px' }}>
                        <div style={{
                          width: '48px',
                          height: '48px',
                          borderRadius: '14px',
                          background: student.avatarColor || '#6366F1',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          fontWeight: 800,
                          fontSize: '1.15rem',
                          color: 'white',
                          boxShadow: '0 4px 10px rgba(0,0,0,0.2)'
                        }}>
                          {student.name.slice(0, 2).toUpperCase()}
                        </div>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <span 
                              onClick={() => onViewProfile(student)}
                              style={{ fontWeight: 700, fontSize: '1.05rem', cursor: 'pointer', textDecoration: 'underline' }}
                              title="Click to view full student profile"
                            >
                              {student.name}
                            </span>
                            <span className={`badge badge-${student.feeStatus || 'paid'}`}>
                              {(student.feeStatus || 'paid').toUpperCase()}
                            </span>
                          </div>
                          
                          <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.2rem', display: 'flex', gap: '0.85rem', flexWrap: 'wrap' }}>
                            <span><i className="fas fa-guitar"></i> {student.musicClass || 'Music Lessons'}</span>
                            <span><i className="fas fa-clock"></i> {student.classTimings || 'IST Timings'}</span>
                            <span><i className="fas fa-chalkboard-teacher"></i> {student.teacherName || 'Gaurav'}</span>
                          </div>

                          <div style={{ fontSize: '0.8rem', color: '#818CF8', marginTop: '0.25rem', fontWeight: 600 }}>
                            <i className="fas fa-tasks"></i> Progress: {student.completedClassesCount || 0} classes completed ({student.packageType || 'Standard Package'})
                          </div>
                        </div>
                      </div>

                      {/* Attendance Buttons */}
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                        <button
                          onClick={() => onMarkAttendance(student.id, 'present')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.15)',
                            color: status === 'present' ? 'white' : '#34D399',
                            border: `1px solid ${status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.4)'}`,
                            boxShadow: status === 'present' ? '0 4px 12px rgba(16, 185, 129, 0.35)' : 'none'
                          }}
                        >
                          <i className="fas fa-check"></i> Present
                        </button>

                        <button
                          onClick={() => onMarkAttendance(student.id, 'absent')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.15)',
                            color: status === 'absent' ? 'white' : '#F87171',
                            border: `1px solid ${status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.4)'}`,
                            boxShadow: status === 'absent' ? '0 4px 12px rgba(239, 68, 68, 0.35)' : 'none'
                          }}
                        >
                          <i className="fas fa-times"></i> Absent
                        </button>

                        <button
                          onClick={() => onMarkAttendance(student.id, 'leave')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.15)',
                            color: status === 'leave' ? 'white' : '#FBBF24',
                            border: `1px solid ${status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-pause"></i> Leave
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Students Directory View

      return (

          {/* Controls Bar */}

            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',

            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',

            flexWrap: 'wrap'

            <div style={{ position: 'relative', minWidth: '280px', flex: 1 }}>
              <input
                type="text"

                  flexDirection: 'column',

                }}
              >
                <div>
                  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '0.9rem' }}>

                      <div style={{
                        width: '46px',
                        height: '46px',
                        borderRadius: '12px',
                        background: student.avatarColor || '#6366F1',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        color: 'white',
                        fontWeight: 800,
                        fontSize: '1.1rem'
                      }}>

                      <div>
                        <h4 style={{ fontSize: '1.1rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                          {student.name}
                        </h4>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                          <i className="fas fa-chalkboard-teacher"></i> Teacher: {student.teacherName || 'Gaurav'}
                        </div>
                      </div>
                    </div>
                    <span className={`badge badge-${student.feeStatus || 'paid'}`}>
                      {(student.feeStatus || 'paid').toUpperCase()}
                    </span>
                  </div>

                  {/* Student Details Fields */}
                  <div style={{ fontSize: '0.85rem', display: 'flex', flexDirection: 'column', gap: '0.45rem', color: 'var(--text-muted)' }}>
                    <div><strong style={{ color: 'var(--text-main)' }}>Lesson:</strong> {student.musicClass || 'Music'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Package:</strong> {student.packageType || '4 Classes'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Timings (IST):</strong> {student.classTimings || 'IST Timings'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Schedule:</strong> {student.classDays || 'Weekly Days'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Completed:</strong> {student.completedClassesCount || 0} classes</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Last Class Date:</strong> {student.lastClassDate || 'Not recorded'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Last Payment Date:</strong> {student.lastPaymentDate || 'Not recorded'}</div>

                <div style={{

                      >

                      </button>

                      </button>

            ))}
          </div>
        </div>
      );

    // Class History & Backlog View
    function ClassHistoryView({ classes, students, isOwner, currentTeacherId, onAddBacklog, onDeleteClass }) {
      const [filterStudent, setFilterStudent] = useState('all');

      const filteredClasses = useMemo(() => {
        let list = classes;
        if (filterStudent !== 'all') {
          list = list.filter(c => c.studentId === filterStudent);
        }
        return list;
      }, [classes, filterStudent]);

      return (
        <div>
          {/* Action Header */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Classes Held & Backlog History
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                Accurate record of every date a class was completed in Indian Standard Time (IST)
              </p>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
              <select
                value={filterStudent}
                onChange={(e) => setFilterStudent(e.target.value)}
                style={{ padding: '0.5rem 0.9rem', fontSize: '0.85rem' }}
              >
                <option value="all">All Students ({classes.length} Sessions)</option>
                {students.map(s => (
                  <option key={s.id} value={s.id}>{s.name}</option>
                ))}
              </select>

              {isOwner && (
                <button onClick={onAddBacklog} className="btn-primary" style={{ padding: '0.55rem 1rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-calendar-plus"></i> Add Backlog / Past Class
                </button>
              )}
            </div>
          </div>

          {/* Classes Table */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            overflowX: 'auto'
          }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.9rem' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--border-color)', color: 'var(--text-muted)' }}>
                  <th style={{ padding: '1rem 1.25rem' }}>Date (IST)</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Student Name</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Class No.</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Timings</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Teacher</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Status</th>
                  <th style={{ padding: '1rem 1.25rem' }}>Remarks / Topics</th>
                  {isOwner && <th style={{ padding: '1rem 1.25rem', textAlign: 'right' }}>Actions</th>}
                </tr>
              </thead>
              <tbody>
                {filteredClasses.slice(0, 150).map((cls) => (
                  <tr key={cls.id} style={{ borderBottom: '1px solid var(--border-color)' }}>
                    <td style={{ padding: '0.85rem 1.25rem', fontWeight: 700, color: '#A5B4FC' }}>
                      <i className="fas fa-calendar-day" style={{ marginRight: '0.4rem', opacity: 0.7 }}></i>
                      {cls.date}
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem', fontWeight: 600 }}>
                      {cls.studentName}
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem' }}>
                      <span className="badge" style={{ background: 'var(--primary-light)', color: '#A5B4FC' }}>
                        Class #{cls.classNumber || 1}
                      </span>
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>
                      {cls.time || 'IST'}
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>
                      {cls.teacherName || 'Gaurav'}
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem' }}>
                      <span className="badge badge-paid">
                        {cls.status || 'Present'}
                      </span>
                    </td>
                    <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                      {cls.remarks || 'Standard studio lesson'}
                    </td>
                    {isOwner && (
                      <td style={{ padding: '0.85rem 1.25rem', textAlign: 'right' }}>
                        <button
                          onClick={() => onDeleteClass(cls.id)}
                          style={{ color: '#F87171', background: 'none' }}
                          title="Delete class log"
                        >
                          <i className="fas fa-trash"></i>
                        </button>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Teachers Management View (Owner Only)
    function TeachersManagementView({ teachers, students, onAddTeacher, onEditTeacher, onDeleteTeacher }) {
      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',

                    <div><strong style={{ color: 'var(--text-main)' }}>Assigned Students:</strong> <span style={{ color: '#34D399', fontWeight: 700 }}>{teacherStudents.length} Students</span></div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Email:</strong> {teacher.email || 'N/A'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Phone:</strong> {teacher.phone || 'N/A'}</div>

                  <div style={{ display: 'flex', gap: '0.5rem', borderTop: '1px solid var(--border-color)', paddingTop: '1rem' }}>

                      <button
                        onClick={() => onDeleteTeacher(teacher.id)}

                        style={{ fontSize: '0.85rem' }}

                      </button>
                    )}

                </div>
              );
            })}
          </div>
        </div>
      );

    // Google Sheet Live Embedded Viewer & Sync
    function GoogleSheetView({ sheetUrl, onEditUrl, onImport }) {
      // Create embeddable URL
      let embedUrl = sheetUrl;
      if (embedUrl.includes('docs.google.com/spreadsheets/d/')) {
        const match = embedUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (match && match[1]) {
          embedUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/pubhtml?widget=true&headers=false`;
        }
      }

      return (
        <div>
          {/* Action Header */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Live Google Sheet Viewer
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                View your personal attendance spreadsheet directly inside the studio application
              </p>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
              <button onClick={onImport} className="btn-secondary">
                <i className="fas fa-sync"></i> Re-Sync & Import Data
              </button>
              <button onClick={onEditUrl} className="btn-secondary">
                <i className="fas fa-link"></i> Change Sheet Link
              </button>
              <a
                href={sheetUrl}
                target="_blank"
                rel="noreferrer"
                className="btn-primary"
                style={{ textDecoration: 'none' }}
              >
                <i className="fas fa-external-link-alt"></i> Open in Google Sheets
              </a>
            </div>
          </div>

          {/* Embedded Sheet Frame */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            overflow: 'hidden',
            height: '75vh',
            boxShadow: 'var(--shadow-md)'
          }}>
            <iframe
              src={embedUrl}
              style={{
                width: '100%',
                height: '100%',
                border: 'none',
                background: 'white'
              }}
              title="Google Sheet Embedded"
            />
          </div>
        </div>
      );
    }

            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',

            padding: '1.25rem 1.5rem',

            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',

          }}>

              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                In-App Database & Cloud Backup Engine

              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>

            </button>
            <button
              onClick={() => setTableTab('classes')}

            <button

                <div style={{

                  height: '48px',
                  borderRadius: '14px',
                  background: student.avatarColor || '#6366F1',

                  justifyContent: 'center',

                  fontWeight: 800,

              <div style={{ maxHeight: '160px', overflowY: 'auto', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>

                  <div style={{ padding: '1rem', textAlign: 'center', color: 'var(--text-muted)' }}>No payment transactions recorded yet.</div>

              </button>
            </div>
          </div>
        </div>
      );
