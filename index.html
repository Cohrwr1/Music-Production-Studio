<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Music Production Studio - Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <style>
    :root {
      --bg-app: #0F172A;
      --bg-surface: #1E293B;
      --bg-surface-elevated: #334155;
      --bg-subtle: #0B1120;
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;
      
      --border-color: #334155;
      --border-light: #475569;
      
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      
      --accent: #EC4899;
      --accent-gradient: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
      
      --present: #10B981;
      --present-bg: rgba(16, 185, 129, 0.15);
      --present-border: rgba(16, 185, 129, 0.4);
      
      --absent: #EF4444;
      --absent-bg: rgba(239, 68, 68, 0.15);
      --absent-border: rgba(239, 68, 68, 0.4);
      
      --leave: #F59E0B;
      --leave-bg: rgba(245, 158, 11, 0.15);
      --leave-border: rgba(245, 158, 11, 0.4);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
      
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-app); }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-elevated); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    button {
      font-family: var(--font-main);
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
    }

    input, select, textarea {
      font-family: var(--font-main);
      outline: none;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-paid {
      background: var(--present-bg);
      color: #34D399;
      border: 1px solid var(--present-border);
    }

    .badge-pending {
      background: var(--leave-bg);
      color: #FBBF24;
      border: 1px solid var(--leave-border);
    }

    .badge-overdue {
      background: var(--absent-bg);
      color: #F87171;
      border: 1px solid var(--absent-border);
    }

    .badge-next {
      background: rgba(99, 102, 241, 0.18);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-secondary:hover {
      background: var(--border-light);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-back {
      background: var(--bg-surface-elevated);
      color: #A5B4FC;
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-back:hover {
      background: var(--border-light);
      color: white;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body { padding: 1.5rem; }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-light);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- REACT SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    // Central Multi-Device Database URL (Firebase Realtime Database REST API)
    const DEFAULT_FIREBASE_URL = 'https://music-studio-d9026-default-rtdb.firebaseio.com/studio_data.json';

    // Automatically ensure Firebase URL ends with /studio_data.json for REST API
    function normalizeCloudUrl(rawUrl) {
      if (!rawUrl || !rawUrl.trim()) return '';
      let url = rawUrl.trim();
      if (url.includes('firebaseio.com')) {
        url = url.replace(/\/+$/, '');
        if (!url.endsWith('.json')) {
          url = url + '/studio_data.json';
        }
      }
      return url;
    }

    // Helper: Calculate Next Class Date given Weekly Day (e.g. 'Thursday' or 'Saturday')
    // If today is Saturday 14 Nov, next class is Saturday 21 Nov!
    // Bulletproof Local (IST) Date Formatter - NEVER uses UTC toISOString() to avoid 1-day previous bug!
    function getLocalDateString(d = new Date()) {
      if (!d) return '';
      if (typeof d === 'string') {
        d = parseLocalDate(d);
      }
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Bulletproof Local Date Parser (sets time to 12:00 PM local noon to prevent midnight/timezone shifts)
    // Supports YYYY-MM-DD, YYYY.MM.DD, and MM.DD.YYYY formats
    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      if (dateStr instanceof Date) return dateStr;
      const clean = String(dateStr).split('T')[0].trim();
      const parts = clean.split(/[-./]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          // YYYY-MM-DD or YYYY.MM.DD
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          return new Date(y, m, d, 12, 0, 0);
        } else if (parts[2].length === 4) {
          // MM.DD.YYYY or DD.MM.YYYY
          let m = parseInt(parts[0], 10) - 1;
          let d = parseInt(parts[1], 10);
          const y = parseInt(parts[2], 10);
          if (parseInt(parts[0], 10) > 12) {
            d = parseInt(parts[0], 10);
            m = parseInt(parts[1], 10) - 1;
          }
          return new Date(y, m, d, 12, 0, 0);
        }
      }
      return new Date();
    }

    // Universal Helper: Formats any date string to mm.dd.yyyy format
    function formatDateMDY(dateStr) {
      if (!dateStr || dateStr === 'N/A' || dateStr === 'Not scheduled') return dateStr || 'N/A';
      try {
        const clean = String(dateStr).split('T')[0].trim();
        const parts = clean.split(/[-./]/);
        if (parts.length === 3) {
          if (parts[0].length === 4) {
            // YYYY-MM-DD or YYYY.MM.DD
            const y = parts[0];
            const m = String(parseInt(parts[1], 10)).padStart(2, '0');
            const d = String(parseInt(parts[2], 10)).padStart(2, '0');
            return `${m}.${d}.${y}`;
          } else if (parts[2].length === 4) {
            // MM.DD.YYYY or DD.MM.YYYY
            let m = parts[0].padStart(2, '0');
            let d = parts[1].padStart(2, '0');
            const y = parts[2];
            if (parseInt(parts[0], 10) > 12) {
              d = parts[0].padStart(2, '0');
              m = parts[1].padStart(2, '0');
            }
            return `${m}.${d}.${y}`;
          }
        }
        const parsed = parseLocalDate(clean);
        if (parsed && !isNaN(parsed.getTime())) {
          const m = String(parsed.getMonth() + 1).padStart(2, '0');
          const d = String(parsed.getDate()).padStart(2, '0');
          const y = parsed.getFullYear();
          return `${m}.${d}.${y}`;
        }
        return dateStr;
      } catch (e) {
        return dateStr;
      }
    }

    // Helper: Calculate target day in THIS current week
    function calculateThisWeekClassDate(weeklyDay) {
      if (!weeklyDay) return '';
      const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      const cleanDay = weeklyDay.toLowerCase().replace('every ', '').trim();
      const targetDay = days.indexOf(cleanDay);
      if (targetDay === -1) return '';

      const today = new Date();
      const currentDay = today.getDay();
      let diff = targetDay - currentDay;
      if (diff < 0) {
        diff += 7; // has already passed this week, so upcoming occurrence
      }
      const targetDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diff, 12, 0, 0);
      return getLocalDateString(targetDate);
    }

    // Helper: Calculate Next Class Date given Weekly Day (e.g. 'Thursday' or 'Saturday')
    // If today is Saturday 14 Nov and student has class every Thursday, next class is Thursday 19 Nov!
    function calculateNextClassDate(weeklyDay, baseDateStr = null) {
      if (!weeklyDay) return '';
      const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      const cleanDay = weeklyDay.toLowerCase().replace('every ', '').trim();
      const targetDay = days.indexOf(cleanDay);
      if (targetDay === -1) return '';

      const base = baseDateStr ? parseLocalDate(baseDateStr) : new Date();
      const currentDay = base.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) {
        diff += 7; // Next occurrence next week
      }
      const nextDate = new Date(base.getFullYear(), base.getMonth(), base.getDate() + diff, 12, 0, 0);
      return getLocalDateString(nextDate);
    }

    // Helper: Formats package display cleanly showing class count and rupees
    // Guarantees that "Custom Package" always specifies how many classes and how many rupees!
    function formatPackageDisplay(pkgType, limit, amount) {
      if (!pkgType && !limit && !amount) return '4 Classes Package (₹6,000)';
      
      const numLimit = Number(limit) || 4;
      const numAmount = amount !== undefined && amount !== null ? Number(amount) : null;
      const formattedAmount = numAmount !== null ? `₹${numAmount.toLocaleString('en-IN')}` : '';

      // If pkgType already has detailed info like "Custom Package (8 Classes - ₹10,000)" or "4 Classes Package (₹6,000)"
      if (pkgType && pkgType.includes('(') && pkgType.includes(')')) {
        return pkgType;
      }

      // If it's a generic "Custom Package" or "Custom Classes Package" without details
      if (!pkgType || pkgType.toLowerCase().includes('custom')) {
        if (formattedAmount) {
          return `Custom Package (${numLimit} Classes - ${formattedAmount})`;
        }
        return `Custom Package (${numLimit} Classes)`;
      }

      // Standard package
      if (formattedAmount) {
        return `${pkgType} (${formattedAmount})`;
      }
      return pkgType;
    }

    // Universal Helper: Calculate true completed classes for a student strictly from recorded cycle class dates
    // Prevents accidental double-clicks or repeated clicks from artificially inflating class count
    function getStudentCompletedClassesCount(student) {
      if (!student) return 0;
      if (student.packageHistory && Array.isArray(student.packageHistory) && student.packageHistory.length > 0) {
        return student.packageHistory.reduce((acc, p) => {
          if (p.classDates && Array.isArray(p.classDates)) {
            // Count every class session taken (supports 2 or more classes on the same day)
            return acc + p.classDates.length;
          }
          return acc + (Number(p.completedCount) || 0);
        }, 0);
      }
      return Number(student.completedClassesCount) || 0;
    }

    function formatReadableDate(dateStr) {
      if (!dateStr || dateStr === 'Not scheduled') return 'Not scheduled';
      try {
        const d = parseLocalDate(dateStr);
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayName = days[d.getDay()];
        const mdy = formatDateMDY(dateStr);
        return `${dayName}, ${mdy}`;
      } catch (e) {
        return formatDateMDY(dateStr);
      }
    }

    function App() {
      const initData = window.INITIAL_STUDIO_DATA || {};
      
      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_students');
          const raw = saved ? JSON.parse(saved) : (initData.students || []);
          return (raw || []).map(s => ({
            ...s,
            completedClassesCount: getStudentCompletedClassesCount(s)
          }));
        } catch (e) {
          return (initData.students || []).map(s => ({
            ...s,
            completedClassesCount: getStudentCompletedClassesCount(s)
          }));
        }
      });

      const [teachers, setTeachers] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_teachers');
          return saved ? JSON.parse(saved) : (initData.teachers || []);
        } catch (e) {
          return initData.teachers || [];
        }
      });

      const [classesHistory, setClassesHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_classes');
          return saved ? JSON.parse(saved) : (initData.classes || []);
        } catch (e) {
          return initData.classes || [];
        }
      });

      const [payments, setPayments] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_payments');
          return saved ? JSON.parse(saved) : (initData.payments || []);
        } catch (e) {
          return initData.payments || [];
        }
      });

      const [attendanceMap, setAttendanceMap] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_attendance_map');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [rescheduledClasses, setRescheduledClasses] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_rescheduled');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [extraClasses, setExtraClasses] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_v7_extra_classes');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [extraClassTargetStudent, setExtraClassTargetStudent] = useState(null);

      const [cloudDbUrl, setCloudDbUrl] = useState(() => {
        return localStorage.getItem('studio_v7_cloud_db_url') || DEFAULT_FIREBASE_URL;
      });

      const [sheetUrl, setSheetUrl] = useState(() => {
        return localStorage.getItem('studio_sheet_url_v5') || initData.googleSheetUrl || 'https://docs.google.com/spreadsheets/d/1aCHYJrvjzg1goDalQpwXAPenEU0At2xAkzU-3ESdcHQ';
      });

      const [currentTeacher, setCurrentTeacher] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_active_teacher_v5');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [activeTab, setActiveTab] = useState('attendance');
      const [passwordPrompt, setPasswordPrompt] = useState(null);
      const [isOwnerAdminOpen, setIsOwnerAdminOpen] = useState(false);

      const [selectedDate, setSelectedDate] = useState(() => {
        return getLocalDateString();
      });

      // Modals
      const [leaveModalData, setLeaveModalData] = useState(null);
      const [isRescheduleOpen, setIsRescheduleOpen] = useState(false);
      const [isExtraClassOpen, setIsExtraClassOpen] = useState(false);

      const [isAddStudentOpen, setIsAddStudentOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [profileViewingStudent, setProfileViewingStudent] = useState(null);

      const [isAddTeacherOpen, setIsAddTeacherOpen] = useState(false);
      const [editingTeacher, setEditingTeacher] = useState(null);

      const [isAddCycleModalOpen, setIsAddCycleModalOpen] = useState(false);
      const [isEditCycleModalOpen, setIsEditCycleModalOpen] = useState(false);
      const [editingCycleTarget, setEditingCycleTarget] = useState(null); // { student, cycle }
      const [cycleTargetStudent, setCycleTargetStudent] = useState(null);

      const [isAddCycleClassDateOpen, setIsAddCycleClassDateOpen] = useState(false);
      const [cycleClassTarget, setCycleClassTarget] = useState(null);

      const [isRecordPaymentOpen, setIsRecordPaymentOpen] = useState(false);
      const [paymentTargetStudent, setPaymentTargetStudent] = useState(null);
      const [editingPayment, setEditingPayment] = useState(null);

      const [isMarkPaidModalOpen, setIsMarkPaidModalOpen] = useState(false);
      const [markPaidTarget, setMarkPaidTarget] = useState(null);

      const [isEditSheetUrlOpen, setIsEditSheetUrlOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [syncStatus, setSyncStatus] = useState('synced');
      const [lastLocalSaveTime, setLastLocalSaveTime] = useState(() => {
        return Number(localStorage.getItem('studio_v7_last_save')) || 0;
      });
      const [lastSyncTime, setLastSyncTime] = useState(Date.now());

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Bulletproof Two-Tier Persistence (v7 & v5 fallback)
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_students', JSON.stringify(students));
          localStorage.setItem('studio_students_v5', JSON.stringify(students));
        } catch(e){}
      }, [students]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_teachers', JSON.stringify(teachers));
          localStorage.setItem('studio_teachers_v5', JSON.stringify(teachers));
        } catch(e){}
      }, [teachers]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_classes', JSON.stringify(classesHistory));
          localStorage.setItem('studio_classes_v5', JSON.stringify(classesHistory));
        } catch(e){}
      }, [classesHistory]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_payments', JSON.stringify(payments));
          localStorage.setItem('studio_payments_v5', JSON.stringify(payments));
        } catch(e){}
      }, [payments]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_attendance_map', JSON.stringify(attendanceMap));
          localStorage.setItem('studio_attendance_map_v5', JSON.stringify(attendanceMap));
        } catch(e){}
      }, [attendanceMap]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_rescheduled', JSON.stringify(rescheduledClasses));
          localStorage.setItem('studio_rescheduled_v5', JSON.stringify(rescheduledClasses));
        } catch(e){}
      }, [rescheduledClasses]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_v7_extra_classes', JSON.stringify(extraClasses));
          localStorage.setItem('studio_extra_classes_v5', JSON.stringify(extraClasses));
        } catch(e){}
      }, [extraClasses]);
      useEffect(() => {
        try {
          localStorage.setItem('studio_sheet_url_v5', sheetUrl);
          localStorage.setItem('studio_v7_sheet_url', sheetUrl);
        } catch(e){}
      }, [sheetUrl]);
      useEffect(() => {
        try {
          if (currentTeacher) {
            localStorage.setItem('studio_active_teacher_v5', JSON.stringify(currentTeacher));
            localStorage.setItem('studio_v7_active_teacher', JSON.stringify(currentTeacher));
          } else {
            localStorage.removeItem('studio_active_teacher_v5');
            localStorage.removeItem('studio_v7_active_teacher');
          }
        } catch(e){}
      }, [currentTeacher]);

      // Helper: Apply incoming cloud data to React state & localStorage
      const applyIncomingCloudData = (cloudData) => {
        if (!cloudData) return;
        const d = cloudData.data || cloudData;
        if (!d) return;

        if (Array.isArray(d.teachers) && d.teachers.length > 0) {
          setTeachers(d.teachers);
          localStorage.setItem('studio_v7_teachers', JSON.stringify(d.teachers));
        }
        if (Array.isArray(d.students) && d.students.length > 0) {
          const sanitized = d.students.map(s => ({
            ...s,
            completedClassesCount: getStudentCompletedClassesCount(s)
          }));
          setStudents(sanitized);
          localStorage.setItem('studio_v7_students', JSON.stringify(sanitized));
        }
        if (Array.isArray(d.payments)) {
          setPayments(d.payments);
          localStorage.setItem('studio_v7_payments', JSON.stringify(d.payments));
        }
        if (Array.isArray(d.classes)) {
          setClassesHistory(d.classes);
          localStorage.setItem('studio_v7_classes', JSON.stringify(d.classes));
        }
        if (d.attendanceMap && typeof d.attendanceMap === 'object') {
          setAttendanceMap(d.attendanceMap);
          localStorage.setItem('studio_v7_attendance_map', JSON.stringify(d.attendanceMap));
        }
        if (Array.isArray(d.rescheduledClasses)) {
          setRescheduledClasses(d.rescheduledClasses);
          localStorage.setItem('studio_v7_rescheduled', JSON.stringify(d.rescheduledClasses));
        }
        if (Array.isArray(d.extraClasses)) {
          setExtraClasses(d.extraClasses);
          localStorage.setItem('studio_v7_extra_classes', JSON.stringify(d.extraClasses));
        }
        if (d.updatedAt) {
          setLastSyncTime(d.updatedAt);
        }
      };

      // 100% REAL-TIME MULTI-DEVICE CLOUD SYNC LOOP (Startup & Every 15 Seconds)
      useEffect(() => {
        const targetUrl = normalizeCloudUrl(cloudDbUrl);
        if (!targetUrl) return;

        let isMounted = true;
        const checkCloudUpdates = async () => {
          try {
            const separator = targetUrl.includes('?') ? '&' : '?';
            const fetchUrl = `${targetUrl}${separator}t=${Date.now()}`;
            const res = await fetch(fetchUrl);
            if (res.ok) {
              const json = await res.json();
              if (json && isMounted) {
                const cloudTime = json.updatedAt || json.data?.updatedAt || 0;
                // Only overwrite if cloud data is strictly newer than our last local save!
                if (cloudTime > lastLocalSaveTime) {
                  applyIncomingCloudData(json);
                  setLastLocalSaveTime(cloudTime);
                  try { localStorage.setItem('studio_v7_last_save', String(cloudTime)); } catch(e){}
                  setSyncStatus('synced');
                }
              }
            }
          } catch (err) {
            console.warn('Realtime cloud sync fetch error:', err);
          }
        };

        // Immediate fetch on mount
        checkCloudUpdates();

        // Continuous sync every 15 seconds
        const timer = setInterval(checkCloudUpdates, 15000);
        return () => {
          isMounted = false;
          clearInterval(timer);
        };
      }, [cloudDbUrl, lastLocalSaveTime]);

      // Bulletproof Cloud & Local Sync Engine
      const syncWithCloud = async (overrideData = {}) => {
        setSyncStatus('syncing');
        const now = Date.now();
        setLastLocalSaveTime(now);
        try { localStorage.setItem('studio_v7_last_save', String(now)); } catch(e){}
        const currentTeachers = overrideData.teachers || teachers;
        const currentStudents = overrideData.students || students;
        const currentPayments = overrideData.payments || payments;
        const currentClasses = overrideData.classes || classesHistory;
        const currentAttendance = overrideData.attendanceMap || attendanceMap;
        const currentRescheduled = overrideData.rescheduledClasses || rescheduledClasses;
        const currentExtraClasses = overrideData.extraClasses || extraClasses;
        const currentSheetUrl = overrideData.sheetUrl || sheetUrl;

        // 1. Instant local persistence (offline resilient, both v7 & v5 keys)
        try {
          localStorage.setItem('studio_v7_teachers', JSON.stringify(currentTeachers));
          localStorage.setItem('studio_v7_students', JSON.stringify(currentStudents));
          localStorage.setItem('studio_v7_payments', JSON.stringify(currentPayments));
          localStorage.setItem('studio_v7_classes', JSON.stringify(currentClasses));
          localStorage.setItem('studio_v7_attendance_map', JSON.stringify(currentAttendance));
          localStorage.setItem('studio_v7_rescheduled', JSON.stringify(currentRescheduled));
          localStorage.setItem('studio_v7_extra_classes', JSON.stringify(currentExtraClasses));
          localStorage.setItem('studio_extra_classes_v5', JSON.stringify(currentExtraClasses));
          localStorage.setItem('studio_teachers_v5', JSON.stringify(currentTeachers));
          localStorage.setItem('studio_students_v5', JSON.stringify(currentStudents));
          localStorage.setItem('studio_payments_v5', JSON.stringify(currentPayments));
          localStorage.setItem('studio_classes_v5', JSON.stringify(currentClasses));
          localStorage.setItem('studio_attendance_map_v5', JSON.stringify(currentAttendance));
          localStorage.setItem('studio_rescheduled_v5', JSON.stringify(currentRescheduled));
        } catch (e) {
          console.warn('LocalStorage save error:', e);
        }

        const payload = {
          name: 'Harmony Music Studio Cloud Database',
          updatedAt: now,
          teachers: currentTeachers,
          students: currentStudents,
          payments: currentPayments,
          classes: currentClasses,
          attendanceMap: currentAttendance,
          rescheduledClasses: currentRescheduled,
          extraClasses: currentExtraClasses,
          sheetUrl: currentSheetUrl
        };

        // 2. Real-time push to Firebase / Central Cloud Database
        const targetUrl = normalizeCloudUrl(cloudDbUrl);
        if (targetUrl) {
          try {
            await fetch(targetUrl, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            setSyncStatus('synced');
            setLastSyncTime(now);
          } catch (err) {
            console.warn('Central cloud DB PUT error:', err);
            setSyncStatus('error');
          }
        } else {
          setSyncStatus('synced');
          setLastSyncTime(now);
        }
      };

      const currentTeacherStudents = useMemo(() => {
        if (!currentTeacher) return [];
        return students.filter(s => (s.teacherId || 'gaurav') === currentTeacher.id);
      }, [students, currentTeacher]);

      // Attendance Action with Double-Click Protection & Idempotent Counting
      const handleAttendanceClick = (studentId, status) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        if (status === 'leave') {
          setLeaveModalData({ studentId, studentName: student.name, date: selectedDate });
          return;
        }

        executeAttendanceMarking(studentId, status);
      };

      const executeAttendanceMarking = (studentId, status, leaveReason = '') => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const currentDayRecord = attendanceMap[selectedDate]?.[studentId];
        const previousStatus = currentDayRecord?.status;

        // IDEMPOTENCY GUARD: If already marked with this exact status today, do not duplicate or re-increment!
        if (previousStatus === status) {
          showToast(`${student.name} is already marked ${status.toUpperCase()} for ${selectedDate}!`, 'info');
          return;
        }

        const istTime = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
        const isCounted = (status === 'present' || status === 'absent');

        const newAttendanceMap = {
          ...attendanceMap,
          [selectedDate]: {
            ...(attendanceMap[selectedDate] || {}),
            [studentId]: {
              status,
              time: istTime,
              isCounted,
              reason: leaveReason,
              updatedAt: Date.now()
            }
          }
        };
        setAttendanceMap(newAttendanceMap);

        const statusLabel = status === 'present' 
          ? 'Present (Class Counted)' 
          : status === 'absent' 
            ? 'Absent - Uninformed (Class Counted)' 
            : `Leave - Informed (Class NOT Deducted${leaveReason ? ' - ' + leaveReason : ''})`;

        // Deduplicated classesHistory: at most 1 entry per student per date
        const filteredClasses = classesHistory.filter(c => !(c.studentId === studentId && c.date === selectedDate));
        const newClassesHistory = [
          {
            id: 'cls_' + studentId + '_' + selectedDate,
            studentId,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            teacherName: student.teacherName || 'Gaurav',
            date: selectedDate,
            time: (student.classTimings || '45 mins') + ' IST',
            classNumber: (student.completedClassesCount || 0) + (isCounted && !currentDayRecord?.isCounted ? 1 : 0),
            status: statusLabel,
            remarks: leaveReason || (status === 'present' ? 'Attended 45-min music session' : 'Absent without prior notice')
          },
          ...filteredClasses
        ];
        setClassesHistory(newClassesHistory);

        // Advance Next Class Date when marked Present/Absent
        const autoNextDate = isCounted 
          ? calculateNextClassDate(student.weeklyDay || student.classDays || 'Thursday', selectedDate)
          : student.nextClassDate;

        let updatedStudents = students.map(s => {
          if (s.id === studentId) {
            let pkgs = s.packageHistory ? JSON.parse(JSON.stringify(s.packageHistory)) : [];
            let currentLimit = s.packageLimit || 4;
            let feeStatus = s.feeStatus;

            if (pkgs.length === 0) {
              if (isCounted) {
                pkgs.push({
                  cycleId: 1,
                  packageType: s.packageType || `${currentLimit} Classes Package`,
                  packageAmount: s.packageAmount || 6000,
                  limit: currentLimit,
                  completedCount: 1,
                  startDate: selectedDate,
                  endDate: selectedDate,
                  feeStatus: 'paid',
                  classDates: [selectedDate]
                });
              }
            } else {
              if (isCounted) {
                // Check if selectedDate already exists in ANY cycle
                let dateAlreadyExists = false;
                pkgs.forEach(pkg => {
                  if (pkg.classDates && pkg.classDates.includes(selectedDate)) {
                    dateAlreadyExists = true;
                  }
                });

                // ONLY add date if it is not already recorded!
                if (!dateAlreadyExists) {
                  let latestPkg = pkgs.reduce((prev, curr) => (Number(curr.cycleId) > Number(prev.cycleId) ? curr : prev), pkgs[pkgs.length - 1]);
                  let latestIdx = pkgs.findIndex(p => p.cycleId === latestPkg.cycleId);
                  let dates = latestPkg.classDates ? [...latestPkg.classDates] : [];

                  if (dates.length >= latestPkg.limit) {
                    const nextCycleId = Math.max(...pkgs.map(p => Number(p.cycleId) || 0), 0) + 1;
                    pkgs.push({
                      cycleId: nextCycleId,
                      packageType: s.packageType || `${currentLimit} Classes Package`,
                      packageAmount: s.packageAmount || (currentLimit === 12 ? 15000 : 6000),
                      limit: currentLimit,
                      completedCount: 1,
                      startDate: selectedDate,
                      endDate: selectedDate,
                      feeStatus: 'pending',
                      remarks: `Cycle ${nextCycleId} auto-started. Payment Pending.`,
                      classDates: [selectedDate]
                    });
                    feeStatus = 'pending';
                    showToast(`Cycle #${nextCycleId} started for ${s.name} with Status: PENDING PAYMENT`, 'error');
                  } else {
                    dates.push(selectedDate);
                    dates.sort();
                    latestPkg.classDates = dates;
                    latestPkg.completedCount = dates.length;
                    latestPkg.endDate = dates[dates.length - 1];
                    pkgs[latestIdx] = latestPkg;
                  }
                }
              } else {
                // Status is 'leave': if selectedDate was in any cycle, remove it!
                pkgs.forEach(pkg => {
                  if (pkg.classDates && pkg.classDates.includes(selectedDate)) {
                    pkg.classDates = pkg.classDates.filter(d => d !== selectedDate);
                    pkg.completedCount = pkg.classDates.length;
                    if (pkg.classDates.length > 0) {
                      pkg.endDate = pkg.classDates[pkg.classDates.length - 1];
                    }
                  }
                });
              }
            }

            // Calculate TRUE total completed classes strictly from distinct classDates
            const trueTotalCompleted = pkgs.reduce((acc, p) => {
              if (p.classDates && Array.isArray(p.classDates)) {
                return acc + p.classDates.length;
              }
              return acc + (Number(p.completedCount) || 0);
            }, 0);

            const activeCycle = pkgs.reduce((prev, curr) => (Number(curr.cycleId) > Number(prev.cycleId) ? curr : prev), pkgs[pkgs.length - 1]);
            const currentCycleCount = activeCycle ? (activeCycle.classDates?.length || activeCycle.completedCount || 0) : 0;

            return {
              ...s,
              completedClassesCount: trueTotalCompleted,
              currentCycleCompleted: currentCycleCount,
              lastClassDate: isCounted ? selectedDate : s.lastClassDate,
              nextClassDate: autoNextDate || s.nextClassDate,
              feeStatus,
              packageHistory: pkgs
            };
          }
          return s;
        });

        setStudents(updatedStudents);

        // If this attendance marks a rescheduled session, complete that reschedule record
        let updatedRescheduled = rescheduledClasses;
        if ((rescheduledClasses || []).some(r => r.studentId === studentId && r.rescheduledDate === selectedDate && r.status !== 'completed')) {
          updatedRescheduled = rescheduledClasses.map(r => {
            if (r.studentId === studentId && r.rescheduledDate === selectedDate) {
              return { ...r, status: 'completed', completedAt: Date.now() };
            }
            return r;
          });
          setRescheduledClasses(updatedRescheduled);
        }

        if (status === 'present') showToast(`Marked PRESENT for ${student.name} (Class Counted)`, 'success');
        else if (status === 'absent') showToast(`Marked ABSENT for ${student.name} (Class Counted - Uninformed)`, 'error');
        else showToast(`Marked LEAVE for ${student.name} (Class NOT Deducted)`, 'info');

        syncWithCloud({
          students: updatedStudents,
          attendanceMap: newAttendanceMap,
          classes: newClassesHistory,
          rescheduledClasses: updatedRescheduled
        });
      };

      // Reschedule - Bulletproof Implementation: Removes class from previous date, adds to new date, preserves regular timings
      const handleSaveReschedule = (rescheduleData) => {
        const student = students.find(s => s.id === rescheduleData.studentId);
        if (!student) {
          showToast('Student not found.', 'error');
          return;
        }

        const origDate = rescheduleData.originalDate;
        const newDate = rescheduleData.rescheduledDate;
        const newTime = rescheduleData.rescheduledTime || '02:00 PM IST';
        const origTime = rescheduleData.originalTime || student.classTimings || '04:00 PM IST';
        const reschedReason = rescheduleData.reason || 'Student requested reschedule';

        const newRecord = {
          id: 'resched_' + Date.now(),
          studentId: student.id,
          studentName: student.name,
          teacherId: currentTeacher?.id || 'gaurav',
          originalDate: origDate,
          originalTime: origTime,
          rescheduledDate: newDate,
          rescheduledTime: newTime,
          reason: reschedReason,
          status: 'pending',
          createdAt: new Date().toISOString()
        };

        // Filter out any older pending reschedule for the same student on this originalDate
        const filteredRescheduled = (rescheduledClasses || []).filter(
          r => !(r.studentId === student.id && r.originalDate === origDate && r.status !== 'completed')
        );
        const updatedRescheduled = [newRecord, ...filteredRescheduled];
        setRescheduledClasses(updatedRescheduled);

        // Update student's nextClassDate to the new rescheduled date, preserving recurring classTimings
        const updatedStudents = students.map(s => {
          if (s.id === student.id) {
            return {
              ...s,
              nextClassDate: newDate,
              rescheduledClass: {
                originalDate: origDate,
                rescheduledDate: newDate,
                rescheduledTime: newTime,
                reason: reschedReason
              }
            };
          }
          return s;
        });
        setStudents(updatedStudents);

        // Clean up any pending attendance record on the original date since class was moved away!
        let updatedAttendanceMap = { ...attendanceMap };
        if (updatedAttendanceMap[origDate]?.[student.id]) {
          const dayRecordsCopy = { ...updatedAttendanceMap[origDate] };
          delete dayRecordsCopy[student.id];
          updatedAttendanceMap[origDate] = dayRecordsCopy;
          setAttendanceMap(updatedAttendanceMap);
        }

        setIsRescheduleOpen(false);
        showToast(`Class for ${student.name} rescheduled from ${formatDateMDY(origDate)} to ${formatDateMDY(newDate)} at ${newTime}!`, 'success');
        syncWithCloud({
          students: updatedStudents,
          rescheduledClasses: updatedRescheduled,
          attendanceMap: updatedAttendanceMap
        });
      };

      // Extra Class - Bulletproof Implementation: Adds to Cycle, Increments Completed Count, Logs Attendance & History
      const handleSaveExtraClass = (extraData) => {
        const student = students.find(s => s.id === extraData.studentId);
        if (!student) {
          showToast('Student not found.', 'error');
          return;
        }

        const sessionDate = extraData.date || getLocalDateString();
        const sessionTime = extraData.time || '06:00 PM IST';
        const sessionRemarks = extraData.remarks || 'Extra class session (counted)';

        // 1. Add extra class to active package cycle classDates and advance completedClassesCount
        let pkgs = student.packageHistory ? JSON.parse(JSON.stringify(student.packageHistory)) : [];
        let currentLimit = student.packageLimit || 4;
        let feeStatus = student.feeStatus || 'paid';

        if (pkgs.length === 0) {
          pkgs.push({
            cycleId: 1,
            packageType: student.packageType || `${currentLimit} Classes Package`,
            packageAmount: student.packageAmount || 6000,
            limit: currentLimit,
            completedCount: 1,
            startDate: sessionDate,
            endDate: sessionDate,
            feeStatus: 'paid',
            classDates: [sessionDate],
            remarks: 'Cycle 1 (Started with Extra Class)'
          });
        } else {
          // Find the active/latest cycle by maximum cycleId
          let latestPkg = pkgs.reduce((prev, curr) => (Number(curr.cycleId) > Number(prev.cycleId) ? curr : prev), pkgs[pkgs.length - 1]);
          let latestIdx = pkgs.findIndex(p => p.cycleId === latestPkg.cycleId);
          let dates = latestPkg.classDates ? [...latestPkg.classDates] : [];

          // If current cycle limit reached, auto-start next cycle
          if (dates.length >= latestPkg.limit) {
            const nextCycleId = Math.max(...pkgs.map(p => Number(p.cycleId) || 0), 0) + 1;
            pkgs.push({
              cycleId: nextCycleId,
              packageType: student.packageType || `${currentLimit} Classes Package`,
              packageAmount: student.packageAmount || (currentLimit === 12 ? 15000 : 6000),
              limit: currentLimit,
              completedCount: 1,
              startDate: sessionDate,
              endDate: sessionDate,
              feeStatus: 'pending',
              remarks: `Cycle ${nextCycleId} auto-started with Extra Class. Payment Pending.`,
              classDates: [sessionDate]
            });
            feeStatus = 'pending';
            showToast(`Cycle #${nextCycleId} started for ${student.name} with Status: PENDING PAYMENT`, 'error');
          } else {
            dates.push(sessionDate);
            dates.sort();
            latestPkg.classDates = dates;
            latestPkg.completedCount = dates.length;
            latestPkg.endDate = dates[dates.length - 1];
            pkgs[latestIdx] = latestPkg;
          }
        }

        // True completed classes calculated directly from cycle classDates
        const trueTotalCompleted = pkgs.reduce((acc, p) => {
          if (p.classDates && Array.isArray(p.classDates)) {
            return acc + p.classDates.length;
          }
          return acc + (Number(p.completedCount) || 0);
        }, 0);

        const activeCycle = pkgs.reduce((prev, curr) => (Number(curr.cycleId) > Number(prev.cycleId) ? curr : prev), pkgs[pkgs.length - 1]);
        const currentCycleCount = activeCycle ? (activeCycle.classDates?.length || activeCycle.completedCount || 0) : 0;

        const updatedStudents = students.map(s => {
          if (s.id === student.id) {
            return {
              ...s,
              completedClassesCount: trueTotalCompleted,
              currentCycleCompleted: currentCycleCount,
              lastClassDate: sessionDate > (s.lastClassDate || '') ? sessionDate : s.lastClassDate,
              feeStatus,
              packageHistory: pkgs
            };
          }
          return s;
        });
        setStudents(updatedStudents);

        // 2. Mark Attendance as Present on sessionDate
        const updatedAttendanceMap = {
          ...attendanceMap,
          [sessionDate]: {
            ...(attendanceMap[sessionDate] || {}),
            [student.id]: {
              status: 'present',
              time: sessionTime,
              isCounted: true,
              isExtraClass: true,
              reason: sessionRemarks,
              updatedAt: Date.now()
            }
          }
        };
        setAttendanceMap(updatedAttendanceMap);

        // 3. Log in Classes History
        const newClass = {
          id: 'cls_extra_' + student.id + '_' + Date.now(),
          studentId: student.id,
          studentName: student.name,
          teacherId: currentTeacher?.id || 'gaurav',
          teacherName: currentTeacher?.name || 'Gaurav',
          date: sessionDate,
          time: sessionTime + ' (Extra Session 45 mins IST)',
          classNumber: trueTotalCompleted,
          status: 'Present (Extra Class Counted)',
          remarks: sessionRemarks
        };
        const updatedClasses = [
          newClass,
          ...classesHistory.filter(c => !(c.studentId === student.id && c.date === sessionDate && c.id === newClass.id))
        ];
        setClassesHistory(updatedClasses);

        // 4. Update extraClasses collection
        const newExtraRecord = {
          id: 'extra_' + Date.now(),
          studentId: student.id,
          studentName: student.name,
          date: sessionDate,
          time: sessionTime,
          remarks: sessionRemarks,
          createdAt: Date.now()
        };
        const updatedExtraClasses = [newExtraRecord, ...(extraClasses || [])];
        setExtraClasses(updatedExtraClasses);

        setIsExtraClassOpen(false);
        setExtraClassTargetStudent(null);
        showToast(`Extra class recorded for ${student.name} on ${formatDateMDY(sessionDate)}! Completed: ${currentCycleCount}/${activeCycle?.limit || 4} classes.`, 'success');

        // 5. Cloud & Local Persistence Sync
        syncWithCloud({
          students: updatedStudents,
          classes: updatedClasses,
          attendanceMap: updatedAttendanceMap,
          extraClasses: updatedExtraClasses
        });
      };

      // Mark Cycle as Paid
      const handleConfirmMarkAsPaid = (paymentDate, amount, method, remarks) => {
        if (!markPaidTarget) return;
        const { student, cycle } = markPaidTarget;

        const updatedStudents = students.map(s => {
          if (s.id === student.id && s.packageHistory) {
            const pkgs = s.packageHistory.map(p => {
              if (p.cycleId === cycle.cycleId) {
                return { ...p, feeStatus: 'paid', paidDate: paymentDate };
              }
              return p;
            });
            return {
              ...s,
              feeStatus: 'paid',
              lastPaymentDate: paymentDate,
              packageHistory: pkgs
            };
          }
          return s;
        });
        setStudents(updatedStudents);

        const updatedPayments = [
          {
            id: 'pay_' + Date.now(),
            studentId: student.id,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            amount: Number(amount),
            paymentDate,
            packageType: cycle.packageType || student.packageType,
            paymentMethod: method,
            receiptNo: `REC-${Date.now().toString().slice(-6)}`,
            remarks: remarks || `Payment cleared for Cycle #${cycle.cycleId}`
          },
          ...payments
        ];
        setPayments(updatedPayments);

        setIsMarkPaidModalOpen(false);
        setMarkPaidTarget(null);
        showToast(`Cycle #${cycle.cycleId} marked as PAID on ${paymentDate}!`, 'success');
        syncWithCloud({ students: updatedStudents, payments: updatedPayments });
      };

      // Edit / Add Payment
      const handleSavePaymentEdit = (paymentData) => {
        let updatedPayments = [];
        let updatedStudents = students;
        if (editingPayment) {
          updatedPayments = payments.map(p => p.id === editingPayment.id ? { ...p, ...paymentData } : p);
          setPayments(updatedPayments);
          updatedStudents = students.map(s => s.id === paymentData.studentId ? { ...s, lastPaymentDate: paymentData.paymentDate } : s);
          setStudents(updatedStudents);
          showToast('Payment record updated!', 'success');
        } else {
          updatedPayments = [
            { ...paymentData, id: 'pay_' + Date.now(), status: 'Completed' },
            ...payments
          ];
          setPayments(updatedPayments);
          updatedStudents = students.map(s => s.id === paymentData.studentId ? { ...s, feeStatus: 'paid', lastPaymentDate: paymentData.paymentDate } : s);
          setStudents(updatedStudents);
          showToast('Payment recorded!', 'success');
        }
        setIsRecordPaymentOpen(false);
        setEditingPayment(null);
        syncWithCloud({ students: updatedStudents, payments: updatedPayments });
      };

      // Add Cycle
      const handleSaveNewCycle = (cycleData) => {
        const student = students.find(s => s.id === cycleData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const nextCycleNum = pkgs.length + 1;
        pkgs.push({
          cycleId: nextCycleNum,
          packageType: cycleData.packageType,
          packageAmount: Number(cycleData.packageAmount) || 6000,
          limit: Number(cycleData.limit) || 4,
          completedCount: 0,
          startDate: cycleData.startDate,
          endDate: cycleData.startDate,
          feeStatus: cycleData.feeStatus || 'pending',
          remarks: cycleData.remarks || `Cycle ${nextCycleNum}`,
          classDates: []
        });

        const updatedStudents = students.map(s => s.id === student.id ? {
          ...s,
          packageType: cycleData.packageType,
          packageAmount: Number(cycleData.packageAmount) || 6000,
          packageLimit: Number(cycleData.limit) || 4,
          feeStatus: cycleData.feeStatus || s.feeStatus,
          currentCycleCompleted: 0,
          packageHistory: pkgs
        } : s);
        setStudents(updatedStudents);

        setIsAddCycleModalOpen(false);
        setCycleTargetStudent(null);
        showToast(`Cycle #${nextCycleNum} added for ${student.name}!`, 'success');
        syncWithCloud({ students: updatedStudents });
      };

      // Edit Cycle Details (StartDate, EndDate, Limit, Amount, Status)
      const handleSaveEditCycle = (cycleData) => {
        const updatedStudents = students.map(s => {
          if (s.id === cycleData.studentId && s.packageHistory) {
            const pkgs = s.packageHistory.map(p => {
              if (p.cycleId === cycleData.cycleId) {
                return {
                  ...p,
                  startDate: cycleData.startDate,
                  endDate: cycleData.endDate,
                  limit: Number(cycleData.limit) || p.limit,
                  packageAmount: Number(cycleData.packageAmount) || p.packageAmount,
                  packageType: cycleData.packageType || p.packageType,
                  feeStatus: cycleData.feeStatus || p.feeStatus,
                  remarks: cycleData.remarks !== undefined ? cycleData.remarks : p.remarks
                };
              }
              return p;
            });
            const lastPkg = pkgs[pkgs.length - 1];
            const isLatest = lastPkg && lastPkg.cycleId === cycleData.cycleId;
            return {
              ...s,
              packageHistory: pkgs,
              packageType: isLatest ? (cycleData.packageType || s.packageType) : s.packageType,
              packageLimit: isLatest ? (Number(cycleData.limit) || s.packageLimit) : s.packageLimit,
              packageAmount: isLatest ? (Number(cycleData.packageAmount) || s.packageAmount) : s.packageAmount,
              feeStatus: isLatest ? (cycleData.feeStatus || s.feeStatus) : s.feeStatus
            };
          }
          return s;
        });
        setStudents(updatedStudents);
        setIsEditCycleModalOpen(false);
        setEditingCycleTarget(null);
        showToast(`Cycle #${cycleData.cycleId} updated successfully!`, 'success');
        syncWithCloud({ students: updatedStudents });
      };

      // Delete Cycle
      const handleDeleteCycle = (studentId, cycleId) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;
        if (confirm(`Delete Cycle #${cycleId} for ${student.name}? All class sessions inside Cycle #${cycleId} will be removed.`)) {
          const updatedStudents = students.map(s => {
            if (s.id === studentId && s.packageHistory) {
              let pkgs = s.packageHistory.filter(p => p.cycleId !== cycleId);
              pkgs = pkgs.map((p, idx) => ({ ...p, cycleId: idx + 1 }));
              const total = pkgs.reduce((a, b) => a + (b.classDates ? b.classDates.length : (b.completedCount || 0)), 0);
              const lastPkg = pkgs.length > 0 ? pkgs[pkgs.length - 1] : null;
              return {
                ...s,
                packageHistory: pkgs,
                completedClassesCount: total,
                packageType: lastPkg ? lastPkg.packageType : s.packageType,
                packageLimit: lastPkg ? lastPkg.limit : s.packageLimit,
                packageAmount: lastPkg ? lastPkg.packageAmount : s.packageAmount,
                feeStatus: lastPkg ? lastPkg.feeStatus : 'paid'
              };
            }
            return s;
          });
          setStudents(updatedStudents);
          showToast(`Cycle #${cycleId} deleted.`, 'info');
          syncWithCloud({ students: updatedStudents });
        }
      };

      // Add Date to Cycle (Allows multiple classes on the same day, e.g. 2 classes on 08.02.2025)
      const handleSaveClassDateToCycle = (dateData) => {
        const student = students.find(s => s.id === dateData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const cycleIdx = pkgs.findIndex(p => p.cycleId === Number(dateData.cycleId));
        if (cycleIdx === -1) return;

        let targetCycle = { ...pkgs[cycleIdx] };
        let dates = targetCycle.classDates ? [...targetCycle.classDates] : [];
        
        // Add one or multiple sessions for this date
        const countToAdd = Math.max(1, Number(dateData.sessionCount) || 1);
        for (let i = 0; i < countToAdd; i++) {
          dates.push(dateData.date);
        }
        dates.sort();

        targetCycle.classDates = dates;
        targetCycle.completedCount = dates.length;
        if (dates.length > 0) {
          dates.sort();
          // If the earliest session is earlier than the cycle startDate, automatically align startDate
          if (dates[0] < targetCycle.startDate || targetCycle.startDate >= '2026-11-13') {
            targetCycle.startDate = dates[0];
          }
          targetCycle.endDate = dates[dates.length - 1];
        }
        pkgs[cycleIdx] = targetCycle;

        const totalCompleted = pkgs.reduce((acc, p) => acc + (p.classDates ? p.classDates.length : (p.completedCount || 0)), 0);

        const updatedStudents = students.map(s => s.id === student.id ? {
          ...s,
          completedClassesCount: totalCompleted,
          lastClassDate: dateData.date > (s.lastClassDate || '') ? dateData.date : s.lastClassDate,
          packageHistory: pkgs
        } : s);
        setStudents(updatedStudents);

        setIsAddCycleClassDateOpen(false);
        setCycleClassTarget(null);
        showToast(`${countToAdd > 1 ? countToAdd + ' classes' : 'Class session'} on ${formatDateMDY(dateData.date)} added to Cycle #${dateData.cycleId}!`, 'success');
        syncWithCloud({ students: updatedStudents });
      };

      // Save Student
      const handleSaveStudent = (data) => {
        // Compute Next Class Date automatically if not provided
        const computedNext = data.nextClassDate || calculateNextClassDate(data.weeklyDay || 'Thursday');
        let updatedStudents;

        if (editingStudent) {
          updatedStudents = students.map(s => {
            if (s.id === editingStudent.id) {
              let updatedHistory = s.packageHistory ? [...s.packageHistory] : [];
              if (updatedHistory.length > 0) {
                const lastIdx = updatedHistory.length - 1;
                updatedHistory[lastIdx] = {
                  ...updatedHistory[lastIdx],
                  packageType: data.packageType,
                  packageAmount: data.packageAmount,
                  limit: data.packageLimit
                };
              }
              return {
                ...s,
                ...data,
                nextClassDate: computedNext,
                id: editingStudent.id,
                packageHistory: updatedHistory.length > 0 ? updatedHistory : s.packageHistory
              };
            }
            return s;
          });
          setStudents(updatedStudents);
          showToast(`Student ${data.name} updated!`, 'success');
        } else {
          const newId = 'std_' + Date.now();
          const newPkg = {
            cycleId: 1,
            packageType: data.packageType || '4 Classes Package (₹6,000)',
            packageAmount: data.packageAmount || 6000,
            limit: data.packageLimit || 4,
            completedCount: Number(data.completedClassesCount) || 0,
            startDate: data.joiningDate || selectedDate,
            endDate: data.lastClassDate || selectedDate,
            feeStatus: data.feeStatus || 'paid',
            classDates: data.lastClassDate ? [data.lastClassDate] : []
          };
          updatedStudents = [...students, {
            ...data,
            id: newId,
            nextClassDate: computedNext,
            packageHistory: [newPkg],
            avatarColor: data.avatarColor || '#6366F1'
          }];
          setStudents(updatedStudents);
          showToast(`Student ${data.name} registered!`, 'success');
        }
        setIsAddStudentOpen(false);
        setEditingStudent(null);
        syncWithCloud({ students: updatedStudents });
      };

      // Full Studio Database Export
      const handleExportBackup = () => {
        const fullBackup = {
          version: '6.0',
          exportedAt: new Date().toISOString(),
          teachers,
          students,
          payments,
          classes: classesHistory,
          attendanceMap,
          rescheduledClasses,
          sheetUrl
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `music_studio_database_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Complete Studio Database Backup downloaded!', 'success');
      };

      // Full Studio Database Import
      const handleImportBackup = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported.students && imported.teachers) {
              applyIncomingCloudData(imported);
              syncWithCloud(imported);
              showToast(`Backup restored! Loaded ${imported.students.length} students & ${imported.teachers.length} teachers.`, 'success');
            } else {
              showToast('Invalid backup file format.', 'error');
            }
          } catch (err) {
            showToast('Failed to parse backup JSON file.', 'error');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      // Copy Data for GitHub INITIAL_DATA
      const handleCopyDataForGithub = () => {
        const githubData = {
          teachers,
          students,
          classes: classesHistory,
          payments,
          googleSheetUrl: sheetUrl
        };
        navigator.clipboard.writeText(JSON.stringify(githubData, null, 2)).then(() => {
          showToast('Database JSON copied to clipboard! Ready to paste into initial_studio_data.json.', 'success');
        }).catch(() => {
          showToast('Clipboard access denied. Please download the backup JSON instead.', 'error');
        });
      };

      // VIEW 1: HOME PAGE (No Tabs, Only Teachers List + Studio Admin in Corner)
      if (!currentTeacher) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'radial-gradient(circle at 50% 15%, #1E1B4B 0%, #0F172A 60%, #030712 100%)' }}>
            <header style={{ padding: '1rem 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <div style={{ width: '42px', height: '42px', borderRadius: '12px', background: 'var(--primary-gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.25rem' }}>
                  <i className="fas fa-music"></i>
                </div>
                <div>
                  <h1 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: 'white' }}>
                    Music Production Studio
                  </h1>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    Studio Portal • 1 Class/Week • 45 Mins IST
                  </div>
                </div>
              </div>

              <button
                onClick={() => setPasswordPrompt({ type: 'owner' })}
                style={{
                  background: 'rgba(255, 255, 255, 0.06)',
                  border: '1px solid rgba(255, 255, 255, 0.15)',
                  color: '#FBBF24',
                  padding: '0.5rem 1rem',
                  borderRadius: 'var(--radius-full)',
                  fontSize: '0.8rem',
                  fontWeight: 700,
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '0.5rem'
                }}
              >
                <i className="fas fa-lock"></i> Studio Admin
              </button>
            </header>

            <main style={{ flex: 1, maxWidth: '1000px', margin: '0 auto', padding: '3.5rem 1.5rem', width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ textAlign: 'center', marginBottom: '2.5rem' }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem', background: 'var(--primary-light)', color: '#A5B4FC', padding: '0.35rem 0.9rem', borderRadius: 'var(--radius-full)', fontSize: '0.8rem', fontWeight: 700, marginBottom: '0.85rem' }}>
                  <i className="fas fa-user-check"></i> SELECT YOUR PROFILE
                </div>
                <h2 style={{ fontSize: '2rem', fontWeight: 900, fontFamily: 'var(--font-heading)', marginBottom: '0.5rem' }}>
                  Choose Teacher Workspace
                </h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', maxWidth: '520px' }}>
                  Click on your teacher profile below and enter your password to access your students, schedules, and attendance.
                </p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.5rem', width: '100%', maxWidth: '800px' }}>
                {teachers.map(t => {
                  const sCount = students.filter(s => (s.teacherId || 'gaurav') === t.id).length;
                  return (
                    <div
                      key={t.id}
                      onClick={() => setPasswordPrompt({ type: 'teacher', targetTeacher: t })}
                      style={{
                        background: 'rgba(30, 41, 59, 0.75)',
                        backdropFilter: 'blur(12px)',
                        border: '1px solid rgba(255, 255, 255, 0.12)',
                        borderRadius: 'var(--radius-xl)',
                        padding: '2rem',
                        cursor: 'pointer',
                        textAlign: 'center',
                        transition: 'all 0.25s ease',
                        boxShadow: '0 20px 40px rgba(0,0,0,0.4)',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        gap: '1rem'
                      }}
                      onMouseEnter={e => {
                        e.currentTarget.style.borderColor = 'var(--primary)';
                        e.currentTarget.style.transform = 'translateY(-4px)';
                      }}
                      onMouseLeave={e => {
                        e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.12)';
                        e.currentTarget.style.transform = 'translateY(0)';
                      }}
                    >
                      <div style={{
                        width: '72px',
                        height: '72px',
                        borderRadius: '22px',
                        background: 'linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        color: 'white',
                        fontSize: '2rem',
                        boxShadow: '0 8px 24px rgba(99, 102, 241, 0.45)'
                      }}>
                        <i className="fas fa-chalkboard-teacher"></i>
                      </div>

                      <div>
                        <h3 style={{ fontSize: '1.45rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: 'white', marginBottom: '0.2rem' }}>
                          {t.name}
                        </h3>
                        <div style={{ fontSize: '0.85rem', color: '#A5B4FC', fontWeight: 600 }}>
                          {t.specialization || 'Music Instructor'}
                        </div>
                      </div>

                      <div style={{
                        background: 'rgba(0, 0, 0, 0.25)',
                        border: '1px solid rgba(255,255,255,0.06)',
                        padding: '0.5rem 1rem',
                        borderRadius: 'var(--radius-full)',
                        fontSize: '0.85rem',
                        color: '#34D399',
                        fontWeight: 700
                      }}>
                        <i className="fas fa-users" style={{ marginRight: '0.4rem' }}></i> {sCount} Students Assigned
                      </div>

                      <div className="btn-primary" style={{ width: '100%', justifyContent: 'center', marginTop: '0.5rem', padding: '0.75rem' }}>
                        <i className="fas fa-lock"></i> Enter Password to Open
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            {passwordPrompt && (
              <PasswordModal
                prompt={passwordPrompt}
                onClose={() => setPasswordPrompt(null)}
                onSuccess={() => {
                  if (passwordPrompt.type === 'owner') {
                    setPasswordPrompt(null);
                    setIsOwnerAdminOpen(true);
                  } else if (passwordPrompt.type === 'teacher') {
                    setCurrentTeacher(passwordPrompt.targetTeacher);
                    setPasswordPrompt(null);
                    showToast(`Welcome, ${passwordPrompt.targetTeacher.name}! Workspace unlocked.`, 'success');
                  }
                }}
              />
            )}

            {isOwnerAdminOpen && (
              <OwnerAdminConsole
                teachers={teachers}
                students={students}
                sheetUrl={sheetUrl}
                classesHistory={classesHistory}
                payments={payments}
                cloudDbUrl={cloudDbUrl}
                onSaveCloudDbUrl={(newUrl) => {
                  setCloudDbUrl(newUrl);
                  localStorage.setItem('studio_v7_cloud_db_url', newUrl);
                  showToast(newUrl ? 'Cloud Database URL saved & connected!' : 'Cloud Database URL cleared.', 'success');
                  syncWithCloud();
                }}
                onClose={() => setIsOwnerAdminOpen(false)}
                onAddTeacher={() => setIsAddTeacherOpen(true)}
                onEditTeacher={(t) => { setEditingTeacher(t); setIsAddTeacherOpen(true); }}
                onDeleteTeacher={(tId) => {
                  const t = teachers.find(x => x.id === tId);
                  if (confirm(`Delete teacher "${t?.name}"? Students will be assigned to Gaurav.`)) {
                    const newTeachers = teachers.filter(x => x.id !== tId);
                    const newStudents = students.map(s => s.teacherId === tId ? { ...s, teacherId: 'gaurav', teacherName: 'Gaurav' } : s);
                    setTeachers(newTeachers);
                    setStudents(newStudents);
                    showToast(`Teacher ${t?.name} removed.`, 'info');
                    syncWithCloud({ teachers: newTeachers, students: newStudents });
                  }
                }}
                onEditSheetUrl={() => setIsEditSheetUrlOpen(true)}
                onExportBackup={handleExportBackup}
                onImportBackup={handleImportBackup}
                onCopyDataForGithub={handleCopyDataForGithub}
                onSyncCloud={() => syncWithCloud()}
              />
            )}

            {isAddTeacherOpen && (
              <TeacherModal
                teacher={editingTeacher}
                onClose={() => { setIsAddTeacherOpen(false); setEditingTeacher(null); }}
                onSave={(tData) => {
                  let updatedTeachers;
                  if (editingTeacher) {
                    updatedTeachers = teachers.map(t => t.id === editingTeacher.id ? { ...tData, id: editingTeacher.id } : t);
                    showToast(`Teacher ${tData.name} updated!`, 'success');
                  } else {
                    const newId = (tData.username || 'teacher_' + Date.now()).toLowerCase().replace(/\s+/g, '');
                    const newTeacher = { ...tData, id: newId, status: 'active' };
                    updatedTeachers = [...teachers, newTeacher];
                    showToast(`Teacher ${tData.name} created!`, 'success');
                  }
                  setTeachers(updatedTeachers);
                  setIsAddTeacherOpen(false);
                  setEditingTeacher(null);
                  syncWithCloud({ teachers: updatedTeachers });
                }}
              />
            )}

            {isEditSheetUrlOpen && (
              <EditSheetUrlModal
                currentUrl={sheetUrl}
                onClose={() => setIsEditSheetUrlOpen(false)}
                onSave={(newUrl) => {
                  setSheetUrl(newUrl);
                  setIsEditSheetUrlOpen(false);
                  showToast('Sheet link updated!', 'success');
                  syncWithCloud();
                }}
              />
            )}

            {toast && <Toast toast={toast} />}
          </div>
        );
      }

      // VIEW 2: TEACHER WORKSPACE (UNLOCKED)
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <header style={{
            background: 'var(--bg-surface)',
            borderBottom: '1px solid var(--border-color)',
            position: 'sticky',
            top: 0,
            zIndex: 100,
            backdropFilter: 'blur(10px)'
          }}>
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0.85rem 1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <button onClick={() => setCurrentTeacher(null)} className="btn-back">
                  <i className="fas fa-arrow-left"></i> All Teachers
                </button>

                <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: 'var(--primary-gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.15rem' }}>
                  <i className="fas fa-music"></i>
                </div>

                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <h2 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                      {currentTeacher.name}’s Workspace
                    </h2>
                    <span className="badge badge-paid">Active</span>
                  </div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    {currentTeacherStudents.length} Students • 1 Class/Week • 45 Mins IST
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', flexWrap: 'wrap' }}>
                <button onClick={() => setIsRescheduleOpen(true)} className="btn-secondary" style={{ fontSize: '0.85rem', padding: '0.45rem 0.85rem', color: '#A5B4FC' }}>
                  <i className="fas fa-calendar-alt"></i> Reschedule Class
                </button>
                <button onClick={() => setIsExtraClassOpen(true)} className="btn-secondary" style={{ fontSize: '0.85rem', padding: '0.45rem 0.85rem', color: '#34D399' }}>
                  <i className="fas fa-plus-circle"></i> + Extra Class
                </button>
                <button onClick={() => { if (confirm('Exit teacher workspace?')) setCurrentTeacher(null); }} className="btn-secondary" style={{ padding: '0.45rem 0.85rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-sign-out-alt"></i> Exit
                </button>
              </div>
            </div>

            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0 1.5rem',
              display: 'flex',
              gap: '0.5rem',
              overflowX: 'auto',
              borderTop: '1px solid var(--border-color)'
            }}>
