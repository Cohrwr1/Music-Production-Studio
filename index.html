              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <button onClick={() => setSelectedStudent(null)} className="btn-back">
                  <i className="fas fa-arrow-left"></i> Back to Students
                </button>
                <div>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Cycles & Backlog for {student.name}
                  </h3>
                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                    Total: <strong style={{ color: '#34D399' }}>{getStudentCompletedClassesCount(student)} Classes</strong> • Timings: <strong>Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4pm'}</strong> • Next: <strong>{formatReadableDate(nextDate)}</strong>
                  </div>
                </div>
              </div>

              <button onClick={() => onAddCycle(student)} className="btn-primary">
                <i className="fas fa-plus"></i> + Add New Cycle
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              {cycles.length === 0 ? (
                <div style={{ padding: '3rem', textAlign: 'center', background: 'var(--bg-surface)', borderRadius: 'var(--radius-lg)', color: 'var(--text-muted)' }}>
                  <p>No cycles recorded yet.</p>
                  <button onClick={() => onAddCycle(student)} className="btn-primary" style={{ marginTop: '1rem' }}>Create First Cycle</button>
                </div>
              ) : (
                cycles.map((cycle, idx) => (
                  <CycleItem
                    key={cycle.cycleId || idx}
                    cycle={cycle}
                    student={student}
                    onAddClassDate={() => onAddClassDate(student, cycle.cycleId || idx + 1)}
                    onDeleteClassDate={(dIdx, dStr) => onDeleteClassDate(student.id, cycle.cycleId || idx + 1, dIdx, dStr)}
                    onMarkPaid={() => onMarkPaidClick(student, cycle)}
                    onEditCycle={() => onEditCycle && onEditCycle(student, cycle)}
                    onDeleteCycle={() => onDeleteCycle && onDeleteCycle(student.id, cycle.cycleId || idx + 1)}
                  />
                ))
              )}
            </div>
          </div>
        );
      }

      return (
        <div>
          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem 1.5rem', marginBottom: '1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap' }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Package Cycles & Backlog</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Select a student to inspect cycles, class dates, and pending payments</p>
            </div>
            <div style={{ minWidth: '260px' }}>
              <input type="text" placeholder="Search student..." value={q} onChange={e => setQ(e.target.value)} style={{ width: '100%' }} />
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '1.25rem' }}>
            {filtered.map(student => {
              const cyclesCount = (student.packageHistory || []).length;
              const hasPending = (student.packageHistory || []).some(p => p.feeStatus === 'pending');
              const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || 'Thursday');

              return (
                <div
                  key={student.id}
                  onClick={() => setSelectedStudent(student)}
                  style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.5rem', cursor: 'pointer', transition: 'all 0.2s ease', boxShadow: 'var(--shadow-sm)' }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border-color)'; e.currentTarget.style.transform = 'translateY(0)'; }}
                >
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.85rem' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                      <div style={{ width: '46px', height: '46px', borderRadius: '12px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 800 }}>
                        {student.name.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <h4 style={{ fontSize: '1.15rem', fontWeight: 800 }}>{student.name}</h4>
                        <div style={{ fontSize: '0.8rem', color: '#FBBF24', fontWeight: 700 }}>
                          Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4pm'}
                        </div>
                      </div>
                    </div>
                    {hasPending ? <span className="badge badge-pending">PENDING</span> : <span className="badge badge-paid">PAID</span>}
                  </div>

                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: '1rem' }}>
                    <div><strong>Next Class Date:</strong> <span style={{ color: '#38BDF8', fontWeight: 800 }}>📅 {formatDateMDY(nextDate)}</span></div>
                    <div><strong>Cycles Logged:</strong> <span style={{ color: '#818CF8', fontWeight: 700 }}>{cyclesCount} Cycles</span></div>
                    <div><strong>Completed Classes:</strong> <span style={{ color: '#34D399', fontWeight: 700 }}>{(() => {
                          const cCycle = student.packageHistory && student.packageHistory.length > 0 ? student.packageHistory[student.packageHistory.length - 1] : null;
                          const cCount = cCycle ? (cCycle.classDates?.length || cCycle.completedCount || 0) : (student.completedClassesCount || 0);
                          const cLimit = cCycle ? (cCycle.limit || student.packageLimit || 4) : (student.packageLimit || 4);
                          return `${cCount}/${cLimit} classes`;
                        })()}</span></div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '0.85rem', display: 'flex', justifyContent: 'space-between', color: '#818CF8', fontWeight: 700, fontSize: '0.85rem' }}>
                    <span>Inspect All Cycles & Dates</span>
                    <i className="fas fa-arrow-right"></i>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Cycle Item
    function CycleItem({ cycle, student, onAddClassDate, onDeleteClassDate, onMarkPaid, onEditCycle, onDeleteCycle }) {
      const [expanded, setExpanded] = useState(true);
      const classDates = cycle.classDates || [];
      const limit = cycle.limit || 4;
      const count = classDates.length || cycle.completedCount || 0;
      const isPending = cycle.feeStatus === 'pending';

      return (
        <div style={{ background: 'var(--bg-surface)', border: `1px solid ${isPending ? 'rgba(245, 158, 11, 0.5)' : 'var(--border-color)'}`, borderRadius: 'var(--radius-lg)', overflow: 'hidden' }}>
          <div
            onClick={() => setExpanded(!expanded)}
            style={{ padding: '1.25rem 1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', cursor: 'pointer', background: expanded ? 'var(--bg-surface-elevated)' : 'transparent', flexWrap: 'wrap' }}
          >
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
              <div style={{ width: '40px', height: '40px', borderRadius: '10px', background: isPending ? 'rgba(245, 158, 11, 0.2)' : 'var(--primary-gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: isPending ? '#FBBF24' : 'white', fontWeight: 800 }}>
                #{cycle.cycleId}
              </div>
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                  <h4 style={{ fontWeight: 800, fontSize: '1.1rem' }}>Cycle #{cycle.cycleId}: {formatPackageDisplay(cycle.packageType, cycle.limit, cycle.packageAmount)}</h4>
                  {isPending ? <span className="badge badge-pending">PENDING PAYMENT</span> : <span className="badge badge-paid">PAID</span>}
                </div>
                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  Fee: ₹{Number(cycle.packageAmount || 6000).toLocaleString('en-IN')} • Dates: {formatDateMDY(cycle.startDate)} to {formatDateMDY(cycle.endDate)}
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', flexWrap: 'wrap' }}>
              {onEditCycle && (
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); onEditCycle(); }}
                  className="btn-secondary"
                  style={{ padding: '0.35rem 0.65rem', fontSize: '0.78rem', display: 'inline-flex', alignItems: 'center', gap: '0.3rem' }}
                  title="Edit Cycle Dates, Start Date, Fee & Limit"
                >
                  <i className="fas fa-edit"></i> Edit Cycle
                </button>
              )}
              {onDeleteCycle && (
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); onDeleteCycle(); }}
                  style={{ color: '#F87171', background: 'none', border: 'none', padding: '0.35rem 0.45rem', fontSize: '0.85rem', cursor: 'pointer' }}
                  title="Delete this cycle"
                >
                  <i className="fas fa-trash"></i>
                </button>
              )}
              {isPending && (
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); onMarkPaid(); }}
                  style={{ background: '#10B981', color: 'white', padding: '0.35rem 0.75rem', borderRadius: 'var(--radius-sm)', fontWeight: 700, fontSize: '0.78rem' }}
                >
                  <i className="fas fa-check-circle"></i> Mark as Paid
                </button>
              )}
              <div style={{ fontSize: '0.85rem', fontWeight: 700, color: count >= limit ? '#34D399' : '#818CF8' }}>{count} / {limit} Classes</div>
              <i className={`fas fa-chevron-${expanded ? 'up' : 'down'}`} style={{ color: 'var(--text-muted)' }}></i>
            </div>
          </div>

          {expanded && (
            <div style={{ padding: '1.25rem 1.5rem', borderTop: '1px solid var(--border-color)', background: 'var(--bg-subtle)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.85rem' }}>
                <span style={{ fontSize: '0.85rem', fontWeight: 700, color: '#A5B4FC' }}>
                  <i className="fas fa-calendar-alt"></i> Class Dates in Cycle #{cycle.cycleId} ({classDates.length} Held):
                </span>
                <button onClick={onAddClassDate} className="btn-primary" style={{ padding: '0.35rem 0.75rem', fontSize: '0.8rem' }}>
                  <i className="fas fa-plus"></i> Add Class Date
                </button>
              </div>

              {classDates.length === 0 ? (
                <div style={{ padding: '1rem', textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.85rem' }}>No dates logged yet in this cycle.</div>
              ) : (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '0.65rem' }}>
                  {classDates.map((dStr, dIdx) => (
                    <div key={dIdx} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', padding: '0.65rem 0.85rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <div>
                        <div style={{ fontWeight: 800, fontSize: '0.9rem', color: '#F8FAFC' }}>{formatDateMDY(dStr)}</div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Class #{dIdx + 1} • 45m IST</div>
                      </div>
                      <button onClick={() => onDeleteClassDate(dIdx, dStr)} style={{ color: '#F87171', background: 'none' }} title="Delete"><i className="fas fa-trash"></i></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Student Payments View
    function StudentPaymentsView({ students, payments, onRecordPayment, onEditPayment, onDeletePayment }) {
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [q, setQ] = useState('');
      const filtered = students.filter(s => s.name.toLowerCase().includes(q.toLowerCase()));

      if (selectedStudent) {
        const student = students.find(s => s.id === selectedStudent.id) || selectedStudent;
        const studentPayments = payments.filter(p => p.studentId === student.id);
        const totalPaid = studentPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);

        return (
          <div>
            <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem 1.5rem', marginBottom: '1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <button onClick={() => setSelectedStudent(null)} className="btn-back"><i className="fas fa-arrow-left"></i> Back</button>
                <div>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Payment History for {student.name}</h3>
                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                    Schedule: <strong>Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4pm'}</strong> • Last Payment Date: <strong>{student.lastPaymentDate || 'N/A'}</strong>
                  </div>
                </div>
              </div>
              <button onClick={() => onRecordPayment(student)} className="btn-primary"><i className="fas fa-plus"></i> Record Payment</button>
            </div>

            <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', overflowX: 'auto' }}>
              <div style={{ padding: '1rem 1.5rem', borderBottom: '1px solid var(--border-color)', fontWeight: 700, color: 'var(--text-muted)' }}>
                Recorded Payments (Total: ₹{totalPaid.toLocaleString('en-IN')})
              </div>
              {studentPayments.length === 0 ? (
                <div style={{ padding: '2.5rem', textAlign: 'center', color: 'var(--text-muted)' }}>No payments recorded yet.</div>
              ) : (
                <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.9rem' }}>
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--border-color)', color: 'var(--text-muted)' }}>
                      <th style={{ padding: '0.85rem 1.25rem' }}>Payment Date</th>
                      <th style={{ padding: '0.85rem 1.25rem' }}>Amount</th>
                      <th style={{ padding: '0.85rem 1.25rem' }}>Package</th>
                      <th style={{ padding: '0.85rem 1.25rem' }}>Method</th>
                      <th style={{ padding: '0.85rem 1.25rem' }}>Remarks</th>
                      <th style={{ padding: '0.85rem 1.25rem', textAlign: 'right' }}>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {studentPayments.map(p => (
                      <tr key={p.id} style={{ borderBottom: '1px solid var(--border-color)' }}>
                        <td style={{ padding: '0.85rem 1.25rem', fontWeight: 800, color: '#A5B4FC' }}>{formatDateMDY(p.paymentDate)}</td>
                        <td style={{ padding: '0.85rem 1.25rem', fontWeight: 800, color: '#34D399' }}>₹{Number(p.amount || 0).toLocaleString('en-IN')}</td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>{formatPackageDisplay(p.packageType, p.limit, p.amount)}</td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>{p.paymentMethod || 'UPI'}</td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)', fontSize: '0.85rem' }}>{p.remarks}</td>
                        <td style={{ padding: '0.85rem 1.25rem', textAlign: 'right' }}>
                          <button onClick={() => onEditPayment(p)} className="btn-secondary" style={{ padding: '0.3rem 0.65rem', fontSize: '0.8rem', marginRight: '0.4rem' }}>Edit Date</button>
                          <button onClick={() => onDeletePayment(p.id)} style={{ color: '#F87171', background: 'none' }}><i className="fas fa-trash"></i></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        );
      }

      return (
        <div>
          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem 1.5rem', marginBottom: '1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap' }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Payments & Fees Directory</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Inspect status, last payment date, and edit past payment dates</p>
            </div>
            <div style={{ minWidth: '260px' }}>
              <input type="text" placeholder="Search student..." value={q} onChange={e => setQ(e.target.value)} style={{ width: '100%' }} />
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '1.25rem' }}>
            {filtered.map(student => {
              const studentPayments = payments.filter(p => p.studentId === student.id);
              const totalAmount = studentPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);

              return (
                <div
                  key={student.id}
                  onClick={() => setSelectedStudent(student)}
                  style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.5rem', cursor: 'pointer', transition: 'all 0.2s ease', boxShadow: 'var(--shadow-sm)' }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border-color)'; e.currentTarget.style.transform = 'translateY(0)'; }}
                >
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.85rem' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                      <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 800 }}>
                        {student.name.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <h4 style={{ fontSize: '1.1rem', fontWeight: 800 }}>{student.name}</h4>
                        <div style={{ fontSize: '0.8rem', color: '#FBBF24', fontWeight: 700 }}>Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4pm'}</div>
                      </div>
                    </div>
                    <span className={`badge badge-${student.feeStatus || 'paid'}`}>{(student.feeStatus || 'paid').toUpperCase()}</span>
                  </div>

                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: '1rem' }}>
                    <div><strong>Last Payment Date:</strong> <span style={{ color: '#A5B4FC', fontWeight: 700 }}>{formatDateMDY(student.lastPaymentDate)}</span></div>
                    <div><strong>Total Paid to Date:</strong> <span style={{ color: '#34D399', fontWeight: 800 }}>₹{totalAmount.toLocaleString('en-IN')}</span> ({studentPayments.length} payments)</div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '0.85rem', display: 'flex', justifyContent: 'space-between', color: '#818CF8', fontWeight: 700, fontSize: '0.85rem' }}>
                    <span>Inspect Payment Dates</span>
                    <i className="fas fa-arrow-right"></i>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Modal: Reschedule (Auto-fills original date/timing, moves class completely from previous date to new date)
    function RescheduleModal({ students, onClose, onSave }) {
      const [studentId, setStudentId] = useState(students[0]?.id || '');

      const getInitialOrigDate = (id) => {
        const s = students.find(x => x.id === id) || students[0];
        return s?.nextClassDate || calculateNextClassDate(s?.weeklyDay || 'Thursday') || getLocalDateString();
      };
      const getInitialOrigTime = (id) => {
        const s = students.find(x => x.id === id) || students[0];
        return s?.classTimings || '04:00 PM IST';
      };

      const [originalDate, setOriginalDate] = useState(() => getInitialOrigDate(students[0]?.id));
      const [originalTime, setOriginalTime] = useState(() => getInitialOrigTime(students[0]?.id));
      const [rescheduledDate, setRescheduledDate] = useState(() => getLocalDateString(new Date(Date.now() + 86400000)));
      const [rescheduledTime, setRescheduledTime] = useState('02:00 PM IST');
      const [reason, setReason] = useState('Student requested reschedule');

      const selectedStudent = students.find(s => s.id === studentId);

      const handleStudentChange = (newId) => {
        setStudentId(newId);
        const s = students.find(x => x.id === newId);
        if (s) {
          const sDate = s.nextClassDate || calculateNextClassDate(s.weeklyDay || 'Thursday') || getLocalDateString();
          setOriginalDate(sDate);
          setOriginalTime(s.classTimings || '04:00 PM IST');
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <i className="fas fa-calendar-alt" style={{ color: '#818CF8' }}></i> Reschedule Class
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => { e.preventDefault(); onSave({ studentId, originalDate, originalTime, rescheduledDate, rescheduledTime, reason }); }}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Select Student *</label>
                  <select value={studentId} onChange={e => handleStudentChange(e.target.value)} style={{ fontSize: '1rem', fontWeight: 700 }}>
                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.weeklyDay ? `Every ${s.weeklyDay}` : 'Lesson'})</option>)}
                  </select>
                </div>

                {selectedStudent && (
                  <div style={{
                    gridColumn: '1 / -1',
                    background: 'rgba(99, 102, 241, 0.1)',
                    border: '1.5px solid rgba(99, 102, 241, 0.3)',
                    borderRadius: 'var(--radius-md)',
                    padding: '0.85rem 1rem',
                    fontSize: '0.85rem',
                    lineHeight: 1.6
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ color: '#A5B4FC', fontWeight: 800 }}>Student: {selectedStudent.name}</span>
                      <span className={`badge badge-${selectedStudent.feeStatus || 'paid'}`}>{(selectedStudent.feeStatus || 'paid').toUpperCase()}</span>
                    </div>
                    <div style={{ color: '#CBD5E1', marginTop: '0.25rem' }}>
                      Regular Schedule: <strong>Every {selectedStudent.weeklyDay || 'Thursday'} at {selectedStudent.classTimings || '4:00 PM'}</strong>
                    </div>
                    <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', marginTop: '0.5rem', paddingTop: '0.5rem', color: '#F87171', fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                      <i className="fas fa-calendar-times"></i>
                      <span>
                        Will move session away from <strong>{formatDateMDY(originalDate)}</strong> to <strong>{formatDateMDY(rescheduledDate)}</strong> at <strong>{rescheduledTime}</strong>.
                      </span>
                    </div>
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Original Date (To Reschedule From) *</label>
                  <input type="date" required value={originalDate} onChange={e => setOriginalDate(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Original Time</label>
                  <input type="text" value={originalTime} onChange={e => setOriginalTime(e.target.value)} />

    // Modal: Add Cycle with Custom Package support (how many classes & how many rupees)
    function AddCycleModal({ student, onClose, onSave }) {
      const determineInitialCyclePlan = () => {
        const pType = student?.packageType || '';
        const pLimit = Number(student?.packageLimit) || (pType.includes('12') ? 12 : 4);
        const pAmt = Number(student?.packageAmount) || (pLimit === 12 ? 15000 : 6000);

        if (pLimit === 4 && pAmt === 6000 && !pType.toLowerCase().includes('custom')) {
          return { plan: '4', limit: 4, amount: 6000 };
        }
        if (pLimit === 12 && pAmt === 15000 && !pType.toLowerCase().includes('custom')) {
          return { plan: '12', limit: 12, amount: 15000 };
        }
        return { plan: 'custom', limit: pLimit, amount: pAmt };
      };

      const init = determineInitialCyclePlan();
      const [planChoice, setPlanChoice] = useState(init.plan);
      const [limit, setLimit] = useState(init.limit);
      const [packageAmount, setPackageAmount] = useState(init.amount);
      const [startDate, setStartDate] = useState(getLocalDateString());
      const [feeStatus, setFeeStatus] = useState('paid');
      const [remarks, setRemarks] = useState('');

      const handlePlanSelect = (val) => {
        setPlanChoice(val);
        if (val === '4') {
          setLimit(4);
          setPackageAmount(6000);
        } else if (val === '12') {
          setLimit(12);
          setPackageAmount(15000);
        } else {
          if (!limit || limit === 4 || limit === 12) setLimit(8);
          if (!packageAmount || packageAmount === 6000 || packageAmount === 15000) setPackageAmount(10000);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Add Package Cycle for {student.name}</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              let computedType = '';
              const finalLimit = Number(limit) || 4;
              const finalAmount = Number(packageAmount) || 6000;
              if (planChoice === '4') {
                computedType = '4 Classes Package (₹6,000)';
              } else if (planChoice === '12') {
                computedType = '12 Classes Package (₹15,000)';
              } else {
                computedType = `Custom Package (${finalLimit} Classes - ₹${finalAmount.toLocaleString('en-IN')})`;
              }
              onSave({
                studentId: student.id,
                packageType: computedType,
                limit: finalLimit,
                packageAmount: finalAmount,
                startDate,
                feeStatus,
                remarks
              });
            }}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-cubes"></i> Package Plan *
                  </label>
                  <select value={planChoice} onChange={e => handlePlanSelect(e.target.value)}>
                    <option value="4">Standard 4 Classes Package (₹6,000)</option>
                    <option value="12">Standard 12 Classes Package (₹15,000)</option>
                    <option value="custom">✨ Custom Package (Enter Classes & Rupees)</option>
                  </select>
                </div>

                {planChoice === 'custom' && (
                  <div style={{
                    gridColumn: '1 / -1',
                    background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.08))',
                    border: '1.5px solid rgba(129, 140, 248, 0.4)',
                    borderRadius: 'var(--radius-md)',
                    padding: '1.25rem',
                    marginBottom: '0.5rem'
                  }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '1rem', color: '#A5B4FC', fontWeight: 800, fontSize: '0.95rem' }}>
                      <i className="fas fa-sliders-h" style={{ color: '#818CF8' }}></i>
                      <span>Custom Cycle Details</span>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem' }}>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label className="form-label" style={{ color: '#38BDF8', fontWeight: 700 }}>
                          <i className="fas fa-layer-group"></i> How Many Classes? *
                        </label>
                        <input
                          type="number"
                          required
                          min="1"
                          max="200"
                          placeholder="e.g. 8"
                          value={limit}
                          onChange={e => setLimit(Number(e.target.value))}
                          style={{ borderColor: 'rgba(56, 189, 248, 0.5)' }}
                        />
                      </div>

                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label className="form-label" style={{ color: '#34D399', fontWeight: 700 }}>
                          <i className="fas fa-rupee-sign"></i> How Many Rupees (₹)? *
                        </label>
                        <input
                          type="number"
                          required
                          min="0"
                          step="50"
                          placeholder="e.g. 10000"
                          value={packageAmount}
                          onChange={e => setPackageAmount(Number(e.target.value))}
                          style={{ borderColor: 'rgba(52, 211, 153, 0.5)' }}
                        />
                      </div>
                    </div>

                    <div style={{
                      marginTop: '1rem',
                      padding: '0.6rem 0.85rem',
                      background: 'rgba(15, 23, 42, 0.6)',
                      borderRadius: '6px',
                      fontSize: '0.85rem',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center'
                    }}>
                      <span style={{ color: 'var(--text-muted)' }}>Package Summary:</span>
                      <strong style={{ color: '#38BDF8' }}>
                        Custom Package ({limit || 0} Classes for ₹{Number(packageAmount || 0).toLocaleString('en-IN')})
                      </strong>
                    </div>
                  </div>
                )}

                {planChoice !== 'custom' && (
                  <>
                    <div className="form-group">
                      <label className="form-label">Class Limit</label>
                      <input type="number" readOnly value={limit} style={{ opacity: 0.8 }} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Amount (₹)</label>
                      <input type="number" readOnly value={packageAmount} style={{ opacity: 0.8 }} />
                    </div>
                  </>
                )}

                <div className="form-group">
                  <label className="form-label">Cycle Start Date *</label>
                  <input type="date" required value={startDate} onChange={e => setStartDate(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Payment Status *</label>
                  <select value={feeStatus} onChange={e => setFeeStatus(e.target.value)}>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                  </select>
                </div>
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Remarks</label>
                  <input type="text" placeholder="e.g. Extended cycle or custom curriculum" value={remarks} onChange={e => setRemarks(e.target.value)} />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Create Cycle</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Edit Cycle (Allows modifying start date, end date, fee, package limit, fee status)
    function EditCycleModal({ target, onClose, onSave }) {
      const { student, cycle } = target;
      const [startDate, setStartDate] = useState(cycle.startDate || getLocalDateString());
      const [endDate, setEndDate] = useState(cycle.endDate || getLocalDateString());
      const [limit, setLimit] = useState(Number(cycle.limit) || 4);
      const [packageAmount, setPackageAmount] = useState(Number(cycle.packageAmount) || 6000);
      const [packageType, setPackageType] = useState(cycle.packageType || '4 Classes Package (₹6,000)');
      const [feeStatus, setFeeStatus] = useState(cycle.feeStatus || 'paid');
      const [remarks, setRemarks] = useState(cycle.remarks || '');

      const classDates = cycle.classDates || [];
      const hasDates = classDates.length > 0;

      const handleAutoAlignDates = () => {
        if (hasDates) {
          const sorted = [...classDates].sort();
          setStartDate(sorted[0]);
          setEndDate(sorted[sorted.length - 1]);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Edit Cycle #{cycle.cycleId} for {student.name}</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              onSave({
                studentId: student.id,
                cycleId: cycle.cycleId,
                startDate,
                endDate,
                limit: Number(limit) || 4,
                packageAmount: Number(packageAmount) || 6000,
                packageType: formatPackageDisplay(packageType, limit, packageAmount),
                feeStatus,
                remarks
              });
            }}>
              <div className="modal-body form-grid">
                {/* START DATE & END DATE */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-calendar-alt"></i> Cycle Start Date *
                  </label>
                  <input
                    type="date"
                    required
                    value={startDate}
                    onChange={e => setStartDate(e.target.value)}
                  />
                  <span style={{ fontSize: '0.75rem', color: '#38BDF8', marginTop: '0.2rem', display: 'block' }}>
                    Current: <strong>{formatDateMDY(startDate)}</strong>
                  </span>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-calendar-check"></i> Cycle End Date *
                  </label>
                  <input
                    type="date"
                    required
                    value={endDate}
                    onChange={e => setEndDate(e.target.value)}
                  />
                  <span style={{ fontSize: '0.75rem', color: '#38BDF8', marginTop: '0.2rem', display: 'block' }}>
                    Current: <strong>{formatDateMDY(endDate)}</strong>
                  </span>
                </div>

                {hasDates && (
                  <div style={{ gridColumn: '1 / -1', background: 'rgba(99, 102, 241, 0.1)', border: '1px dashed rgba(99, 102, 241, 0.3)', borderRadius: '6px', padding: '0.6rem 0.85rem' }}>
                    <button
                      type="button"
                      onClick={handleAutoAlignDates}
                      style={{ background: 'none', border: 'none', color: '#38BDF8', fontSize: '0.8rem', fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.4rem', padding: 0 }}
                    >
                      <i className="fas fa-magic"></i> Auto-Align to Logged Sessions: {formatDateMDY(classDates[0])} &rarr; {formatDateMDY(classDates[classDates.length - 1])}
                    </button>
                  </div>
                )}

                {/* LIMIT & AMOUNT */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>Class Limit (Total Sessions) *</label>
                  <input
                    type="number"
                    required
                    min="1"
                    max="200"
                    value={limit}
                    onChange={e => setLimit(Number(e.target.value))}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#34D399', fontWeight: 700 }}>Package Fee (₹) *</label>
                  <input
                    type="number"
                    required
                    min="0"
                    value={packageAmount}
                    onChange={e => setPackageAmount(Number(e.target.value))}
                  />
                </div>

                {/* PAYMENT STATUS */}
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Fee Payment Status *</label>
                  <select value={feeStatus} onChange={e => setFeeStatus(e.target.value)}>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending Payment</option>
                  </select>
                </div>

                {/* REMARKS */}
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Cycle Remarks</label>
                  <input
                    type="text"
                    value={remarks}
                    onChange={e => setRemarks(e.target.value)}
                    placeholder="e.g. Backlog cycle or initial enrollment"
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Add Date to Cycle (Supports multiple classes on a single day)
    function AddClassDateModal({ student, cycleId, onClose, onSave }) {
      const [date, setDate] = useState(getLocalDateString());
      const [sessionCount, setSessionCount] = useState(1);
      const [remarks, setRemarks] = useState('Completed 45-min music class');

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '460px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Add Class Session (Cycle #{cycleId})</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              onSave({ studentId: student.id, cycleId, date, sessionCount: Number(sessionCount), remarks });
            }}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-calendar-alt"></i> Date Class Held (mm.dd.yyyy) *
                  </label>
                  <input
                    type="date"
                    required
                    value={date}
                    onChange={e => setDate(e.target.value)}
                    style={{ width: '100%' }}
                  />
                  <div style={{ fontSize: '0.8rem', color: '#38BDF8', marginTop: '0.25rem' }}>
                    Selected: <strong>{formatDateMDY(date)}</strong>
                  </div>
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>
                    <i className="fas fa-layer-group"></i> How Many Classes Taken on This Day? *
                  </label>
                  <select
                    value={sessionCount}
                    onChange={e => setSessionCount(Number(e.target.value))}
                    style={{ width: '100%', borderColor: 'rgba(251, 191, 36, 0.4)' }}
                  >
                    <option value="1">1 Class (Standard Session - 45 mins)</option>
                    <option value="2">2 Classes (Double Session - 2 classes on this day)</option>
                    <option value="3">3 Classes (Triple Session)</option>
                  </select>
                  <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.25rem', display: 'block' }}>
                    Select 2 if student took two classes on this day. Both will be counted in the cycle.
                  </span>
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Remarks</label>
                  <input
                    type="text"
                    value={remarks}
                    onChange={e => setRemarks(e.target.value)}
                    placeholder="e.g. Completed regular class or double session"
                    style={{ width: '100%' }}
                  />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save {sessionCount > 1 ? `${sessionCount} Classes` : 'Class Date'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Teacher Add/Edit
    function TeacherModal({ teacher, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: teacher?.name || '',
        username: teacher?.username || '',
        password: teacher?.password || '',
        specialization: teacher?.specialization || 'Music Instructor'
      });

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '440px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>{teacher ? 'Edit Teacher' : 'Add New Teacher'}</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => { e.preventDefault(); onSave(formData); }}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Teacher Name *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                </div>
                <div className="form-group">
                  <label className="form-label">User ID *</label>
                  <input type="text" required value={formData.username} onChange={e => setFormData({ ...formData, username: e.target.value })} />
                </div>
                <div className="form-group">
                  <label className="form-label">Password *</label>
                  <input type="text" required value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Save Teacher</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Edit Sheet URL
    function EditSheetUrlModal({ currentUrl, onClose, onSave }) {
      const [url, setUrl] = useState(currentUrl);
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '440px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Google Sheet Link</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => { e.preventDefault(); onSave(url.trim()); }}>
              <div className="modal-body">
                <label className="form-label">Spreadsheet URL</label>
                <input type="url" required value={url} onChange={e => setUrl(e.target.value)} style={{ width: '100%', marginTop: '0.4rem' }} />
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Save Link</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Leave Reason
    function LeaveReasonModal({ data, onClose, onConfirm }) {
      const [by, setBy] = useState('student');
      const [reason, setReason] = useState('');
      const quick = by === 'student' ? ['Student unwell', 'Exam conflict', 'Family emergency', 'Informed in advance'] : ['Teacher rescheduled', 'Studio maintenance', 'Holiday'];

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '500px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Record Class Leave</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => { e.preventDefault(); onConfirm(`[${by === 'student' ? 'Student Leave' : 'Teacher Rescheduled'}] ${reason || 'Informed previously'}`); }}>
              <div className="modal-body">
                <div style={{ background: 'rgba(245, 158, 11, 0.1)', border: '1px solid rgba(245, 158, 11, 0.3)', padding: '0.75rem', borderRadius: 'var(--radius-sm)', color: '#FDE68A', fontSize: '0.85rem', marginBottom: '1rem' }}>
                  <i className="fas fa-info-circle"></i> <strong>Class Not Counted:</strong> Leave does not deduct from student package.
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem', marginBottom: '1rem' }}>
                  <button type="button" onClick={() => setBy('student')} className={by === 'student' ? 'btn-primary' : 'btn-secondary'} style={{ justifyContent: 'center' }}>By Student</button>
                  <button type="button" onClick={() => setBy('teacher')} className={by === 'teacher' ? 'btn-primary' : 'btn-secondary'} style={{ justifyContent: 'center' }}>By Teacher</button>
                </div>
                <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', marginBottom: '1rem' }}>
                  {quick.map((q, i) => (
                    <button key={i} type="button" onClick={() => setReason(q)} style={{ background: reason === q ? 'var(--primary)' : 'var(--bg-subtle)', color: reason === q ? 'white' : 'var(--text-muted)', border: '1px solid var(--border-color)', padding: '0.3rem 0.6rem', borderRadius: 'var(--radius-full)', fontSize: '0.75rem' }}>{q}</button>
                  ))}
                </div>
                <div className="form-group">
                  <label className="form-label">Specific Reason *</label>
                  <textarea rows={2} required value={reason} onChange={e => setReason(e.target.value)} placeholder="Reason for leave..." style={{ width: '100%', resize: 'none' }} />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary" style={{ background: 'linear-gradient(135deg, #F59E0B 0%, #D97706 100%)' }}>Save Leave</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Helper Stat Card
    function StatCard({ label, value, icon, color }) {
      return (
        <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.15rem 1.25rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
          <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: `${color}20`, border: `1px solid ${color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center', color, fontSize: '1.2rem' }}>
            <i className={`fas ${icon}`}></i>
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>{label}</div>
            <div style={{ fontSize: '1.4rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>{value}</div>
          </div>
        </div>
      );
    }

    // Helper Tab Button
    function TabButton({ active, onClick, icon, label, badge }) {
      return (
        <button
          onClick={onClick}
          style={{
            padding: '0.85rem 1.15rem',
            background: 'none',
            color: active ? 'white' : 'var(--text-muted)',
            borderBottom: active ? '3px solid var(--primary)' : '3px solid transparent',
            fontWeight: active ? 700 : 600,
            fontSize: '0.9rem',
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.6rem',
            whiteSpace: 'nowrap'
          }}
        >
          <i className={`fas ${icon}`} style={{ color: active ? 'var(--primary)' : 'inherit' }}></i>
          <span>{label}</span>
          {badge !== undefined && (
            <span style={{ background: active ? 'var(--primary-light)' : 'var(--bg-surface-elevated)', color: active ? '#818CF8' : 'var(--text-muted)', padding: '0.15rem 0.5rem', borderRadius: '999px', fontSize: '0.75rem', fontWeight: 700 }}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // Toast
    function Toast({ toast }) {
      return (
        <div className="toast-container">
          <div className="toast-box" style={{ borderColor: toast.type === 'success' ? '#10B981' : toast.type === 'error' ? '#EF4444' : 'var(--border-light)' }}>
            <i className={`fas ${toast.type === 'success' ? 'fa-check-circle' : toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`}
               style={{ color: toast.type === 'success' ? '#34D399' : toast.type === 'error' ? '#F87171' : '#818CF8' }}
            ></i>
            <span>{toast.message}</span>
          </div>
        </div>
      );
    }

    
    // ==========================================
    // PERMANENT SCHEDULE CHANGE MODAL (STUDENTS DIRECTORY ONLY)
    // ==========================================
    function ChangeRegularScheduleModal({ student, onClose, onConfirm }) {
      const [newWeeklyDay, setNewWeeklyDay] = useState(student.weeklyDay || 'Thursday');
      const [newTimings, setNewTimings] = useState(student.classTimings || '04:00 PM IST');
      const [effectiveScope, setEffectiveScope] = useState('next_week'); // 'this_week' | 'next_week'
      const [reason, setReason] = useState('Student regular timing update');

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirm({
          studentId: student.id,
          newWeeklyDay,
          newTimings,
          effectiveScope,
          reason
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <div style={{ width: '40px', height: '40px', borderRadius: '10px', background: 'var(--primary-light)', color: '#818CF8', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.15rem' }}>
                  <i className="fas fa-calendar-alt"></i>
                </div>
                <div>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Change Regular Schedule
                  </h3>
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                    {student.name} • Permanent Weekly Update
                  </div>
                </div>
              </div>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div style={{ gridColumn: '1 / -1', background: 'var(--bg-subtle)', padding: '0.75rem 1rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)', fontSize: '0.85rem' }}>
                  Current Schedule: <strong>Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4:00 PM IST'}</strong>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>
                    <i className="fas fa-calendar-day"></i> New Recurring Weekly Day
                  </label>
                  <select
                    className="form-control"
                    value={newWeeklyDay}
                    onChange={e => setNewWeeklyDay(e.target.value)}
                    required
                  >
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>
                    <i className="fas fa-clock"></i> New Class Timings (IST)
                  </label>
                  <input
                    type="text"
                    className="form-control"
                    placeholder="e.g. 02:00 PM IST"
                    value={newTimings}
                    onChange={e => setNewTimings(e.target.value)}
                    required
                  />
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label" style={{ fontWeight: 800, color: '#38BDF8' }}>
                    <i className="fas fa-layer-group"></i> When Should This Change Take Effect?
                  </label>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem', marginTop: '0.35rem' }}>
                    <label style={{
                      display: 'flex',
                      flexDirection: 'column',
                      gap: '0.3rem',
                      padding: '0.85rem',
                      borderRadius: 'var(--radius-md)',
                      border: effectiveScope === 'this_week' ? '2px solid var(--primary)' : '1px solid var(--border-color)',
                      background: effectiveScope === 'this_week' ? 'var(--primary-light)' : 'var(--bg-subtle)',
                      cursor: 'pointer'
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: 700, fontSize: '0.9rem' }}>
                        <input
                          type="radio"
                          name="effectiveScope"
                          value="this_week"
                          checked={effectiveScope === 'this_week'}
                          onChange={() => setEffectiveScope('this_week')}
                        />
                        <span>Apply from THIS WEEK</span>
                      </div>
                      <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', paddingLeft: '1.35rem' }}>
                        Immediately shifts this week's class to the new day and time.
                      </span>
                    </label>

                    <label style={{
                      display: 'flex',
                      flexDirection: 'column',
                      gap: '0.3rem',
                      padding: '0.85rem',
                      borderRadius: 'var(--radius-md)',
                      border: effectiveScope === 'next_week' ? '2px solid #10B981' : '1px solid var(--border-color)',
                      background: effectiveScope === 'next_week' ? 'rgba(16, 185, 129, 0.15)' : 'var(--bg-subtle)',
                      cursor: 'pointer'
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: 700, fontSize: '0.9rem' }}>
                        <input
                          type="radio"
                          name="effectiveScope"
                          value="next_week"
                          checked={effectiveScope === 'next_week'}
                          onChange={() => setEffectiveScope('next_week')}
                        />
                        <span style={{ color: effectiveScope === 'next_week' ? '#34D399' : 'inherit' }}>Apply from NEXT WEEK</span>
                      </div>
                      <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', paddingLeft: '1.35rem' }}>
                        Keeps this week on regular day. New schedule starts right after this week's class.
                      </span>
                    </label>
                  </div>
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Reason for Schedule Change (Optional)</label>
                  <input
                    type="text"
                    className="form-control"
                    placeholder="e.g. Student requested Thursday -> Saturday permanently"
                    value={reason}
                    onChange={e => setReason(e.target.value)}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Save Permanent Schedule
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
