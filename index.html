          await fetch(DEFAULT_CLOUD_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Music Studio Multi-Teacher DB',
              data: { students, teachers, classes: classesHistory, payments, attendanceMap, rescheduledClasses, sheetUrl, updatedAt: Date.now() }
            })
          });
          setSyncStatus('synced');
          setLastSyncTime(Date.now());
        } catch (e) {
          setSyncStatus('error');
        }
      };

      const currentTeacherStudents = useMemo(() => {
        if (!currentTeacher) return [];
        return students.filter(s => (s.teacherId || 'gaurav') === currentTeacher.id);
      }, [students, currentTeacher]);

      // Attendance Action
      const handleAttendanceClick = (studentId, status) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        if (status === 'leave') {
          setLeaveModalData({ studentId, studentName: student.name, date: selectedDate });
          return;
        }

        executeAttendanceMarking(studentId, status);
      };

      const executeAttendanceMarking = (studentId, status, leaveReason = '') => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const istTime = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
        const isCounted = (status === 'present' || status === 'absent');

        setAttendanceMap(prev => ({
          ...prev,
          [selectedDate]: {
            ...(prev[selectedDate] || {}),
            [studentId]: {
              status,
              time: istTime,
              isCounted,
              reason: leaveReason,
              updatedAt: Date.now()
            }
          }
        }));

        const statusLabel = status === 'present' 
          ? 'Present (Class Counted)' 
          : status === 'absent' 
            ? 'Absent - Uninformed (Class Counted)' 
            : `Leave - Informed (Class NOT Deducted - ${leaveReason})`;

        setClassesHistory(prev => [
          {
            id: 'cls_' + studentId + '_' + Date.now(),
            studentId,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            teacherName: student.teacherName || 'Gaurav',
            date: selectedDate,
            time: (student.classTimings || '45 mins') + ' IST',
            classNumber: (student.completedClassesCount || 0) + (isCounted ? 1 : 0),
            status: statusLabel,
            remarks: leaveReason || (status === 'present' ? 'Attended 45-min music session' : 'Absent without prior notice')
          },
          ...prev
        ]);

        if (!isCounted) {
          showToast(`Marked LEAVE for ${student.name} (Class NOT deducted)`, 'info');
          syncWithCloud();
          return;
        }

        // ==========================================
        // SMART SCHEDULE ADVANCEMENT:
        // 1. One-time reschedule/extra classes NEVER change regular schedule.
        //    Next regular class returns to student's standard recurring weeklyDay!
        // 2. If student had a pending schedule change effective from next week,
        //    apply the change now that this week's class is completed!
        // ==========================================
        let finalWeeklyDay = student.weeklyDay || 'Thursday';
        let finalTimings = student.classTimings || '4:00 PM IST';
        let pendingChange = student.pendingScheduleChange;

        if (pendingChange && pendingChange.effectiveNextWeek) {
          finalWeeklyDay = pendingChange.newWeeklyDay;
          finalTimings = pendingChange.newTimings;
          pendingChange = null; // Activated!
          showToast(`New regular schedule for ${student.name} is now active: Every ${finalWeeklyDay} at ${finalTimings}!`, 'success');
        }

        // Next class automatically scheduled on the regular weekly day (+7 days)
        const autoNextDate = calculateNextClassDate(finalWeeklyDay, selectedDate);

        let updatedStudents = students.map(s => {
          if (s.id === studentId) {
            let pkgs = s.packageHistory ? [...s.packageHistory] : [];
            const newTotal = (s.completedClassesCount || 0) + 1;
            let currentCycleCount = (s.currentCycleCompleted || 0) + 1;
            let currentLimit = s.packageLimit || 4;
            let feeStatus = s.feeStatus;

            if (pkgs.length === 0) {
              pkgs.push({
                cycleId: 1,
                packageType: s.packageType || '4 Classes Package (₹6,000)',
                packageAmount: s.packageAmount || 6000,
                limit: currentLimit,
                completedCount: 1,
                startDate: selectedDate,
                endDate: selectedDate,
                feeStatus: 'paid',
                classDates: [selectedDate]
              });
            } else {
              let latestPkg = { ...pkgs[pkgs.length - 1] };
              if ((latestPkg.classDates?.length || latestPkg.completedCount || 0) >= latestPkg.limit) {
                const nextCycleId = pkgs.length + 1;
                pkgs.push({
                  cycleId: nextCycleId,
                  packageType: s.packageType || `${currentLimit} Classes Package`,
                  packageAmount: s.packageAmount || (currentLimit === 12 ? 15000 : 6000),
                  limit: currentLimit,
                  completedCount: 1,
                  startDate: selectedDate,
                  endDate: selectedDate,
                  feeStatus: 'pending',
                  remarks: `Cycle ${nextCycleId} auto-started. Payment Pending.`,
                  classDates: [selectedDate]
                });
                currentCycleCount = 1;
                feeStatus = 'pending';
                showToast(`Cycle #${nextCycleId} started for ${s.name} with Status: PENDING PAYMENT`, 'error');
              } else {
                let dates = latestPkg.classDates ? [...latestPkg.classDates] : [];
                if (!dates.includes(selectedDate)) dates.push(selectedDate);
                latestPkg.classDates = dates;
                latestPkg.completedCount = dates.length;
                latestPkg.endDate = selectedDate;
                pkgs[pkgs.length - 1] = latestPkg;
              }
            }

            return {
              ...s,
              weeklyDay: finalWeeklyDay,
              classDays: `Every ${finalWeeklyDay}`,
              classTimings: finalTimings,
              pendingScheduleChange: pendingChange,
              completedClassesCount: newTotal,
              currentCycleCompleted: currentCycleCount,
              lastClassDate: selectedDate,
              nextClassDate: autoNextDate || s.nextClassDate,
              feeStatus,
              packageHistory: pkgs
            };
          }
          return s;
        });

        setStudents(updatedStudents);
        if (status === 'present') showToast(`Marked PRESENT for ${student.name} (+1 Class Counted)`, 'success');
        else showToast(`Marked ABSENT for ${student.name} (+1 Class Consumed - Uninformed)`, 'error');
        syncWithCloud();
      };

      // ONE-TIME RESCHEDULE (Affects this week only!)
      const handleSaveReschedule = (rescheduleData) => {
        const student = students.find(s => s.id === rescheduleData.studentId);
        const newRecord = {
          id: 'resched_' + Date.now(),
          studentId: rescheduleData.studentId,
          studentName: student ? student.name : 'Student',
          teacherId: currentTeacher?.id || 'gaurav',
          originalDate: rescheduleData.originalDate,
          originalTime: rescheduleData.originalTime,
          rescheduledDate: rescheduleData.rescheduledDate,
          rescheduledTime: rescheduleData.rescheduledTime,
          reason: rescheduleData.reason,
          createdAt: new Date().toISOString()
        };

        setRescheduledClasses([newRecord, ...rescheduledClasses]);

        // Sets the next class date for this one-time session without changing regular schedule
        setStudents(students.map(s => {
          if (s.id === rescheduleData.studentId) {
            return {
              ...s,
              nextClassDate: rescheduleData.rescheduledDate
            };
          }
          return s;
        }));

        setIsRescheduleOpen(false);
        showToast(`One-time reschedule for ${student?.name}: moved to ${rescheduleData.rescheduledDate} (${rescheduleData.rescheduledTime})! Regular schedule remains Every ${student?.weeklyDay}.`, 'info');
        syncWithCloud();
      };

      // ONE-TIME EXTRA CLASS
      const handleSaveExtraClass = (extraData) => {
        const student = students.find(s => s.id === extraData.studentId);
        const newClass = {
          id: 'cls_extra_' + Date.now(),
          studentId: extraData.studentId,
          studentName: student ? student.name : 'Student',
          teacherId: currentTeacher?.id || 'gaurav',
          teacherName: currentTeacher?.name || 'Gaurav',
          date: extraData.date,
          time: extraData.time + ' (Extra Session 45 mins IST)',
          classNumber: (student?.completedClassesCount || 0) + 1,
          status: 'Scheduled Extra Class',
          remarks: extraData.remarks || 'Extra class scheduled with teacher'
        };

        setClassesHistory([newClass, ...classesHistory]);
        setIsExtraClassOpen(false);
        showToast(`Extra class scheduled for ${student?.name} on ${extraData.date}! Regular schedule remains unchanged.`, 'success');
        syncWithCloud();
      };

      // PERMANENT SCHEDULE CHANGE (INSIDE STUDENTS DIRECTORY ONLY - ASK THIS WEEK OR NEXT WEEK)
      const handleConfirmPermanentScheduleChange = (data) => {
        const { studentId, newWeeklyDay, newTimings, effectiveScope, reason } = data;
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        if (effectiveScope === 'this_week') {
          // Applies immediately from this week
          const thisWeekDate = calculateThisWeekClassDate(newWeeklyDay);
          setStudents(students.map(s => {
            if (s.id === studentId) {
              return {
                ...s,
                weeklyDay: newWeeklyDay,
                classDays: `Every ${newWeeklyDay}`,
                classTimings: newTimings,
                nextClassDate: thisWeekDate,
                pendingScheduleChange: null
              };
            }
            return s;
          }));
          showToast(`Regular schedule for ${student.name} changed to Every ${newWeeklyDay} at ${newTimings} (Effective THIS WEEK - Next: ${thisWeekDate})!`, 'success');
        } else {
          // Applies from NEXT WEEK: keeps this week on old schedule, queues change for next week
          setStudents(students.map(s => {
            if (s.id === studentId) {
              return {
                ...s,
                pendingScheduleChange: {
                  newWeeklyDay,
                  newTimings,
                  effectiveNextWeek: true,
                  reason
                }
              };
            }
            return s;
          }));
          showToast(`Regular schedule change for ${student.name} recorded! Will take effect starting NEXT WEEK (Every ${newWeeklyDay} at ${newTimings}).`, 'info');
        }

        setScheduleChangeTarget(null);
        syncWithCloud();
      };

      // Mark Cycle as Paid
      const handleConfirmMarkAsPaid = (paymentDate, amount, method, remarks) => {
        if (!markPaidTarget) return;
        const { student, cycle } = markPaidTarget;

        setStudents(students.map(s => {
          if (s.id === student.id && s.packageHistory) {
            const pkgs = s.packageHistory.map(p => {
              if (p.cycleId === cycle.cycleId) {
                return { ...p, feeStatus: 'paid', paidDate: paymentDate };
              }
              return p;
            });
            return {
              ...s,
              feeStatus: 'paid',
              lastPaymentDate: paymentDate,
              packageHistory: pkgs
            };
          }
          return s;
        }));

        setPayments([
          {
            id: 'pay_' + Date.now(),
            studentId: student.id,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            amount: Number(amount),
            paymentDate,
            packageType: cycle.packageType || student.packageType,
            paymentMethod: method,
            receiptNo: `REC-${Date.now().toString().slice(-6)}`,
            remarks: remarks || `Payment cleared for Cycle #${cycle.cycleId}`
          },
          ...payments
        ]);

        setIsMarkPaidModalOpen(false);
        setMarkPaidTarget(null);
        showToast(`Cycle #${cycle.cycleId} marked as PAID on ${paymentDate}!`, 'success');
        syncWithCloud();
      };

      // Edit / Add Payment
      const handleSavePaymentEdit = (paymentData) => {
        if (editingPayment) {
          setPayments(payments.map(p => p.id === editingPayment.id ? { ...p, ...paymentData } : p));
          setStudents(students.map(s => s.id === paymentData.studentId ? { ...s, lastPaymentDate: paymentData.paymentDate } : s));
          showToast('Payment record updated!', 'success');
        } else {
          setPayments([
            { ...paymentData, id: 'pay_' + Date.now(), status: 'Completed' },
            ...payments
          ]);
          setStudents(students.map(s => s.id === paymentData.studentId ? { ...s, feeStatus: 'paid', lastPaymentDate: paymentData.paymentDate } : s));
          showToast('Payment recorded!', 'success');
        }
        setIsRecordPaymentOpen(false);
        setEditingPayment(null);
        syncWithCloud();
      };

      // Add Cycle
      const handleSaveNewCycle = (cycleData) => {
        const student = students.find(s => s.id === cycleData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const nextCycleNum = pkgs.length + 1;
        pkgs.push({
          cycleId: nextCycleNum,
          packageType: cycleData.packageType,
          packageAmount: Number(cycleData.packageAmount) || 6000,
          limit: Number(cycleData.limit) || 4,
          completedCount: 0,
          startDate: cycleData.startDate,
          endDate: cycleData.startDate,
          feeStatus: cycleData.feeStatus || 'pending',
          remarks: cycleData.remarks || `Cycle ${nextCycleNum}`,
          classDates: []
        });

        setStudents(students.map(s => s.id === student.id ? {
          ...s,
          packageType: cycleData.packageType,
          packageAmount: Number(cycleData.packageAmount) || 6000,
          packageLimit: Number(cycleData.limit) || 4,
          feeStatus: cycleData.feeStatus || s.feeStatus,
          currentCycleCompleted: 0,
          packageHistory: pkgs
        } : s));

        setIsAddCycleModalOpen(false);
        setCycleTargetStudent(null);
        showToast(`Cycle #${nextCycleNum} added for ${student.name}!`, 'success');
        syncWithCloud();
      };

      // Add Date to Cycle
      const handleSaveClassDateToCycle = (dateData) => {
        const student = students.find(s => s.id === dateData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const cycleIdx = pkgs.findIndex(p => p.cycleId === Number(dateData.cycleId));
        if (cycleIdx === -1) return;

        let targetCycle = { ...pkgs[cycleIdx] };
        let dates = targetCycle.classDates ? [...targetCycle.classDates] : [];
        if (!dates.includes(dateData.date)) {
          dates.push(dateData.date);
          dates.sort();
        }
        targetCycle.classDates = dates;
        targetCycle.completedCount = dates.length;
        targetCycle.endDate = dates[dates.length - 1];
        pkgs[cycleIdx] = targetCycle;

        const totalCompleted = pkgs.reduce((acc, p) => acc + (p.classDates ? p.classDates.length : (p.completedCount || 0)), 0);

        setStudents(students.map(s => s.id === student.id ? {
          ...s,
          completedClassesCount: totalCompleted,
          lastClassDate: dateData.date > (s.lastClassDate || '') ? dateData.date : s.lastClassDate,
          packageHistory: pkgs
        } : s));

        setIsAddCycleClassDateOpen(false);
        setCycleClassTarget(null);
        showToast(`Class date ${dateData.date} added to Cycle #${dateData.cycleId}!`, 'success');
        syncWithCloud();
      };

      // Save Student
      const handleSaveStudent = (data) => {
        const computedNext = data.nextClassDate || calculateNextClassDate(data.weeklyDay || 'Thursday');

        if (editingStudent) {
          setStudents(students.map(s => s.id === editingStudent.id ? { ...data, nextClassDate: computedNext, id: editingStudent.id } : s));
          showToast(`Student ${data.name} updated!`, 'success');
        } else {
          const newId = 'std_' + Date.now();
          const newPkg = {
            cycleId: 1,
            packageType: data.packageType || '4 Classes Package (₹6,000)',
            packageAmount: data.packageAmount || 6000,
            limit: data.packageLimit || 4,
            completedCount: Number(data.completedClassesCount) || 0,
            startDate: data.joiningDate || selectedDate,
            endDate: data.lastClassDate || selectedDate,
            feeStatus: data.feeStatus || 'paid',
            classDates: data.lastClassDate ? [data.lastClassDate] : []
          };
          setStudents([...students, {
            ...data,
            id: newId,
            nextClassDate: computedNext,
            packageHistory: [newPkg],
            avatarColor: data.avatarColor || '#6366F1'
          }]);
          showToast(`Student ${data.name} registered!`, 'success');
        }
        setIsAddStudentOpen(false);
        setEditingStudent(null);
        syncWithCloud();
      };

      // Export Backup
      const handleExportBackup = () => {
        const blob = new Blob([JSON.stringify({ students, teachers, classesHistory, payments, attendanceMap, rescheduledClasses, sheetUrl }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `music_studio_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Full backup downloaded!', 'success');
      };

      // VIEW 1: HOME PAGE (Clean, Only Teachers List + Studio Admin in Corner)
      if (!currentTeacher) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'radial-gradient(circle at 50% 15%, #1E1B4B 0%, #0F172A 60%, #030712 100%)' }}>
            <header style={{ padding: '1rem 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <div style={{ width: '42px', height: '42px', borderRadius: '12px', background: 'var(--primary-gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.25rem' }}>
                  <i className="fas fa-music"></i>
                </div>
                <div>
                  <h1 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: 'white' }}>
                    Music Production Studio
                  </h1>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    Studio Portal • 1 Class/Week • 45 Mins IST
                  </div>
                </div>
              </div>

              <button
                onClick={() => setPasswordPrompt({ type: 'owner' })}
                style={{
                  background: 'rgba(255, 255, 255, 0.06)',
                  border: '1px solid rgba(255, 255, 255, 0.15)',
                  color: '#FBBF24',
                  padding: '0.5rem 1rem',
                  borderRadius: 'var(--radius-full)',
                  fontSize: '0.8rem',
                  fontWeight: 700,
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '0.5rem'
                }}
              >
                <i className="fas fa-lock"></i> Studio Admin
              </button>
            </header>

            <main style={{ flex: 1, maxWidth: '1000px', margin: '0 auto', padding: '3.5rem 1.5rem', width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ textAlign: 'center', marginBottom: '2.5rem' }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem', background: 'var(--primary-light)', color: '#A5B4FC', padding: '0.35rem 0.9rem', borderRadius: 'var(--radius-full)', fontSize: '0.8rem', fontWeight: 700, marginBottom: '0.85rem' }}>
                  <i className="fas fa-user-check"></i> SELECT YOUR PROFILE
                </div>
                <h2 style={{ fontSize: '2rem', fontWeight: 900, fontFamily: 'var(--font-heading)', marginBottom: '0.5rem' }}>
                  Choose Teacher Workspace
                </h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', maxWidth: '520px' }}>
                  Click on your teacher profile below and enter your password to access your students, schedules, and attendance.
                </p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.5rem', width: '100%', maxWidth: '800px' }}>
                {teachers.map(t => {
                  const sCount = students.filter(s => (s.teacherId || 'gaurav') === t.id).length;
                  return (
                    <div
                      key={t.id}
                      onClick={() => setPasswordPrompt({ type: 'teacher', targetTeacher: t })}
                      style={{
                        background: 'rgba(30, 41, 59, 0.75)',
                        backdropFilter: 'blur(12px)',
                        border: '1px solid rgba(255, 255, 255, 0.12)',
                        borderRadius: 'var(--radius-xl)',
                        padding: '2rem',
                        cursor: 'pointer',
                        textAlign: 'center',
                        transition: 'all 0.25s ease',
                        boxShadow: '0 20px 40px rgba(0,0,0,0.4)',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        gap: '1rem'
                      }}
                      onMouseEnter={e => {
                        e.currentTarget.style.borderColor = 'var(--primary)';
                        e.currentTarget.style.transform = 'translateY(-4px)';
                      }}
                      onMouseLeave={e => {
                        e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.12)';
                        e.currentTarget.style.transform = 'translateY(0)';
                      }}
                    >
                      <div style={{
                        width: '72px',
                        height: '72px',
                        borderRadius: '22px',
                        background: 'linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        color: 'white',
                        fontSize: '2rem',
                        boxShadow: '0 8px 24px rgba(99, 102, 241, 0.45)'
                      }}>
                        <i className="fas fa-chalkboard-teacher"></i>
                      </div>

                      <div>
                        <h3 style={{ fontSize: '1.45rem', fontWeight: 800, fontFamily: 'var(--font-heading)', color: 'white', marginBottom: '0.2rem' }}>
                          {t.name}
                        </h3>
                        <div style={{ fontSize: '0.85rem', color: '#A5B4FC', fontWeight: 600 }}>
                          {t.specialization || 'Music Instructor'}
                        </div>
                      </div>

                      <div style={{
                        background: 'rgba(0, 0, 0, 0.25)',
                        border: '1px solid rgba(255,255,255,0.06)',
                        padding: '0.5rem 1rem',
                        borderRadius: 'var(--radius-full)',
                        fontSize: '0.85rem',
                        color: '#34D399',
                        fontWeight: 700
                      }}>
                        <i className="fas fa-users" style={{ marginRight: '0.4rem' }}></i> {sCount} Students Assigned
                      </div>

                      <div className="btn-primary" style={{ width: '100%', justifyContent: 'center', marginTop: '0.5rem', padding: '0.75rem' }}>
                        <i className="fas fa-lock"></i> Enter Password to Open
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>

            {passwordPrompt && (
              <PasswordModal
                prompt={passwordPrompt}
                onClose={() => setPasswordPrompt(null)}
                onSuccess={() => {
                  if (passwordPrompt.type === 'owner') {
                    setPasswordPrompt(null);
                    setIsOwnerAdminOpen(true);
                  } else if (passwordPrompt.type === 'teacher') {
                    setCurrentTeacher(passwordPrompt.targetTeacher);
                    setPasswordPrompt(null);
                    showToast(`Welcome, ${passwordPrompt.targetTeacher.name}! Workspace unlocked.`, 'success');
                  }
                }}
              />
            )}

            {isOwnerAdminOpen && (
              <OwnerAdminConsole
                teachers={teachers}
                students={students}
                sheetUrl={sheetUrl}
                classesHistory={classesHistory}
                payments={payments}
                onClose={() => setIsOwnerAdminOpen(false)}
                onAddTeacher={() => setIsAddTeacherOpen(true)}
                onEditTeacher={(t) => { setEditingTeacher(t); setIsAddTeacherOpen(true); }}
                onDeleteTeacher={(tId) => {
                  const t = teachers.find(x => x.id === tId);
                  if (confirm(`Delete teacher "${t?.name}"? Students will be assigned to Gaurav.`)) {
                    setTeachers(teachers.filter(x => x.id !== tId));
                    setStudents(students.map(s => s.teacherId === tId ? { ...s, teacherId: 'gaurav', teacherName: 'Gaurav' } : s));
                    showToast(`Teacher ${t?.name} removed.`, 'info');
                    syncWithCloud();
                  }
                }}
                onEditSheetUrl={() => setIsEditSheetUrlOpen(true)}
                onExportBackup={handleExportBackup}
                onSyncCloud={() => syncWithCloud()}
              />
            )}

            {isAddTeacherOpen && (
              <TeacherModal
                teacher={editingTeacher}
                onClose={() => { setIsAddTeacherOpen(false); setEditingTeacher(null); }}
                onSave={(tData) => {
                  if (editingTeacher) {
                    setTeachers(teachers.map(t => t.id === editingTeacher.id ? { ...tData, id: editingTeacher.id } : t));
                    showToast('Teacher updated!', 'success');
                  } else {
                    const newId = (tData.username || 'teacher_' + Date.now()).toLowerCase().replace(/\s+/g, '');
                    setTeachers([...teachers, { ...tData, id: newId, status: 'active' }]);
                    showToast(`Teacher ${tData.name} created!`, 'success');
                  }
                  setIsAddTeacherOpen(false);
                  setEditingTeacher(null);
                  syncWithCloud();
                }}
              />
            )}

            {isEditSheetUrlOpen && (
              <EditSheetUrlModal
                currentUrl={sheetUrl}
                onClose={() => setIsEditSheetUrlOpen(false)}
                onSave={(newUrl) => {
                  setSheetUrl(newUrl);
                  setIsEditSheetUrlOpen(false);
                  showToast('Sheet link updated!', 'success');
                  syncWithCloud();
                }}
              />
            )}

            {toast && <Toast toast={toast} />}
          </div>
        );
      }

      // VIEW 2: TEACHER WORKSPACE (UNLOCKED)
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <header style={{
            background: 'var(--bg-surface)',
            borderBottom: '1px solid var(--border-color)',
            position: 'sticky',
            top: 0,
            zIndex: 100,
            backdropFilter: 'blur(10px)'
          }}>
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0.85rem 1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                <button onClick={() => setCurrentTeacher(null)} className="btn-back">
                  <i className="fas fa-arrow-left"></i> All Teachers
                </button>

                <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: 'var(--primary-gradient)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.15rem' }}>
                  <i className="fas fa-music"></i>
                </div>

                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <h2 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                      {currentTeacher.name}’s Workspace
                    </h2>
                    <span className="badge badge-paid">Active</span>
                  </div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    {currentTeacherStudents.length} Students • 1 Class/Week • 45 Mins IST
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', flexWrap: 'wrap' }}>
                <button onClick={() => setIsRescheduleOpen(true)} className="btn-secondary" style={{ fontSize: '0.85rem', padding: '0.45rem 0.85rem', color: '#A5B4FC' }}>
                  <i className="fas fa-calendar-alt"></i> Reschedule This Week
                </button>
                <button onClick={() => setIsExtraClassOpen(true)} className="btn-secondary" style={{ fontSize: '0.85rem', padding: '0.45rem 0.85rem', color: '#34D399' }}>
                  <i className="fas fa-plus-circle"></i> + Extra Class
                </button>
                <button onClick={() => { if (confirm('Exit teacher workspace?')) setCurrentTeacher(null); }} className="btn-secondary" style={{ padding: '0.45rem 0.85rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-sign-out-alt"></i> Exit
                </button>
              </div>
            </div>

            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0 1.5rem',
              display: 'flex',
              gap: '0.5rem',
              overflowX: 'auto',
              borderTop: '1px solid var(--border-color)'
            }}>
              <TabButton
                active={activeTab === 'attendance'}
                onClick={() => setActiveTab('attendance')}
                icon="fa-calendar-check"
                label="Attendance Marking"
                badge={currentTeacherStudents.length}
              />
              <TabButton
                active={activeTab === 'students'}
                onClick={() => setActiveTab('students')}
                icon="fa-user-graduate"
                label="My Students Directory"
              />
              <TabButton
                active={activeTab === 'cycles'}
                onClick={() => setActiveTab('cycles')}
                icon="fa-sync-alt"
                label="Package Cycles & Backlog"
              />
              <TabButton
                active={activeTab === 'payments'}
                onClick={() => setActiveTab('payments')}
                icon="fa-credit-card"
                label="Payments & Fees"
              />
            </div>
          </header>

          <main style={{ maxWidth: '1440px', margin: '0 auto', padding: '1.75rem 1.5rem', width: '100%', flex: 1 }}>
            {rescheduledClasses.length > 0 && (
              <div style={{ background: 'rgba(99, 102, 241, 0.1)', border: '1px solid rgba(99, 102, 241, 0.3)', borderRadius: 'var(--radius-md)', padding: '0.75rem 1.25rem', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.75rem' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-info-circle" style={{ color: '#818CF8' }}></i>
                  <span><strong>One-Time Reschedule:</strong> {rescheduledClasses[0].studentName} moved to <strong>{rescheduledClasses[0].rescheduledDate} ({rescheduledClasses[0].rescheduledTime})</strong>. Regular schedule resumes next week.</span>
                </div>
                <button onClick={() => setRescheduledClasses([])} style={{ background: 'none', color: 'var(--text-muted)', fontSize: '0.75rem', textDecoration: 'underline' }}>Dismiss</button>
              </div>
            )}

            {activeTab === 'attendance' && (
              <AttendanceView
                students={currentTeacherStudents}
                selectedDate={selectedDate}
                onDateChange={setSelectedDate}
                attendanceMap={attendanceMap}
                onMarkAttendance={handleAttendanceClick}
                teacherName={currentTeacher.name}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onViewProfile={(std) => setProfileViewingStudent(std)}
              />
            )}

            {activeTab === 'students' && (
              <StudentsDirectoryView
                students={currentTeacherStudents}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onEditStudent={(std) => { setEditingStudent(std); setIsAddStudentOpen(true); }}
                onChangeRegularSchedule={(std) => setScheduleChangeTarget(std)}
                onDeleteStudent={(stdId) => {
                  const s = students.find(x => x.id === stdId);
                  if (confirm(`Remove student "${s?.name}"?`)) {
                    setStudents(students.filter(x => x.id !== stdId));
                    showToast('Student removed.', 'info');
                    syncWithCloud();
                  }
                }}
                onViewProfile={(std) => setProfileViewingStudent(std)}
              />
            )}

            {activeTab === 'cycles' && (
              <StudentFirstCyclesView
                students={currentTeacherStudents}
                onAddCycle={(std) => { setCycleTargetStudent(std); setIsAddCycleModalOpen(true); }}
                onAddClassDate={(std, cId) => { setCycleClassTarget({ student: std, cycleId: cId }); setIsAddCycleClassDateOpen(true); }}
                onDeleteClassDate={(stdId, cId, dateToRemove) => {
                  if (confirm(`Delete class date ${dateToRemove} from Cycle ${cId}?`)) {
                    setStudents(students.map(s => {
                      if (s.id === stdId && s.packageHistory) {
                        const pkgs = s.packageHistory.map(p => {
                          if (p.cycleId === cId) {
                            const newDates = (p.classDates || []).filter(d => d !== dateToRemove);
                            return { ...p, classDates: newDates, completedCount: newDates.length };
                          }
                          return p;
                        });
                        const total = pkgs.reduce((a, b) => a + (b.classDates ? b.classDates.length : (b.completedCount || 0)), 0);
                        return { ...s, completedClassesCount: total, packageHistory: pkgs };
                      }
                      return s;
                    }));
                    showToast('Date removed.', 'info');
                    syncWithCloud();
                  }
                }}
                onMarkPaidClick={(std, cycle) => {
                  setMarkPaidTarget({ student: std, cycle });
                  setIsMarkPaidModalOpen(true);
                }}
              />
            )}

            {activeTab === 'payments' && (
              <StudentPaymentsView
                students={currentTeacherStudents}
                payments={payments}
                onRecordPayment={(std) => {
                  setPaymentTargetStudent(std);
                  setEditingPayment(null);
                  setIsRecordPaymentOpen(true);
                }}
                onEditPayment={(pay) => {
                  setEditingPayment(pay);
                  setPaymentTargetStudent(students.find(s => s.id === pay.studentId));
                  setIsRecordPaymentOpen(true);
                }}
                onDeletePayment={(payId) => {
                  if (confirm('Delete this payment record?')) {
                    setPayments(payments.filter(p => p.id !== payId));
                    showToast('Payment record deleted.', 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}
          </main>

          {leaveModalData && (
            <LeaveReasonModal
              data={leaveModalData}
              onClose={() => setLeaveModalData(null)}
              onConfirm={(reason) => {
                executeAttendanceMarking(leaveModalData.studentId, 'leave', reason);
                setLeaveModalData(null);
              }}
            />
          )}

          {isRescheduleOpen && (
            <RescheduleModal
              students={currentTeacherStudents}
              onClose={() => setIsRescheduleOpen(false)}
              onSave={handleSaveReschedule}
            />
          )}

          {isExtraClassOpen && (
            <ExtraClassModal
              students={currentTeacherStudents}
              onClose={() => setIsExtraClassOpen(false)}
              onSave={handleSaveExtraClass}
            />
          )}

          {/* PERMANENT SCHEDULE CHANGE MODAL (INSIDE STUDENTS DIRECTORY ONLY) */}
          {scheduleChangeTarget && (
            <ChangeRegularScheduleModal
              student={scheduleChangeTarget}
              onClose={() => setScheduleChangeTarget(null)}
              onConfirm={handleConfirmPermanentScheduleChange}
            />
          )}

          {isMarkPaidModalOpen && markPaidTarget && (
            <MarkPaidModal
              target={markPaidTarget}
              onClose={() => { setIsMarkPaidModalOpen(false); setMarkPaidTarget(null); }}
              onConfirm={handleConfirmMarkAsPaid}
            />
          )}

          {isRecordPaymentOpen && (
            <PaymentModal
              students={currentTeacherStudents}
              targetStudent={paymentTargetStudent}
              editingPayment={editingPayment}
              onClose={() => { setIsRecordPaymentOpen(false); setEditingPayment(null); }}
              onSave={handleSavePaymentEdit}
            />
          )}

          {isAddCycleModalOpen && cycleTargetStudent && (
            <AddCycleModal
              student={cycleTargetStudent}
              onClose={() => { setIsAddCycleModalOpen(false); setCycleTargetStudent(null); }}
              onSave={handleSaveNewCycle}
            />
          )}

          {isAddCycleClassDateOpen && cycleClassTarget && (
            <AddClassDateModal
              student={cycleClassTarget.student}
              cycleId={cycleClassTarget.cycleId}
              onClose={() => { setIsAddCycleClassDateOpen(false); setCycleClassTarget(null); }}
              onSave={handleSaveClassDateToCycle}
            />
          )}

          {isAddStudentOpen && (
            <StudentModal
              student={editingStudent}
              teacher={currentTeacher}
              onClose={() => { setIsAddStudentOpen(false); setEditingStudent(null); }}
              onSave={handleSaveStudent}
            />
          )}

          {profileViewingStudent && (
            <StudentProfileModal
              student={profileViewingStudent}
              classes={classesHistory.filter(c => c.studentId === profileViewingStudent.id)}
              payments={payments.filter(p => p.studentId === profileViewingStudent.id)}
              onClose={() => setProfileViewingStudent(null)}
              onChangeSchedule={() => {
                setScheduleChangeTarget(profileViewingStudent);
                setProfileViewingStudent(null);
              }}
              onEdit={() => {
                setEditingStudent(profileViewingStudent);
                setProfileViewingStudent(null);
                setIsAddStudentOpen(true);
              }}
            />
          )}

          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // Attendance View Component
    function AttendanceView({ students, selectedDate, onDateChange, attendanceMap, onMarkAttendance, teacherName, onAddStudent, onViewProfile }) {
      const dayRecords = attendanceMap[selectedDate] || {};

      const presentCount = students.filter(s => dayRecords[s.id]?.status === 'present').length;
      const absentCount = students.filter(s => dayRecords[s.id]?.status === 'absent').length;
      const leaveCount = students.filter(s => dayRecords[s.id]?.status === 'leave').length;

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Daily Attendance • {teacherName}
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                1 Class/Week • 45 Mins IST • Shows Class Timings & Next Class Date
              </p>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', background: 'var(--bg-subtle)', padding: '0.35rem 0.75rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)' }}>
                <i className="fas fa-calendar-alt" style={{ color: 'var(--primary)' }}></i>
                <input type="date" value={selectedDate} onChange={e => onDateChange(e.target.value)} style={{ background: 'none', border: 'none', color: 'white', fontWeight: 700 }} />
              </div>
              <button onClick={onAddStudent} className="btn-primary" style={{ padding: '0.55rem 1rem', fontSize: '0.85rem' }}>
                <i className="fas fa-plus"></i> Add Student
              </button>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem', marginBottom: '1.5rem' }}>
            <StatCard label="Total Students" value={students.length} icon="fa-users" color="#6366F1" />
            <StatCard label="Present (Counted)" value={presentCount} icon="fa-check-circle" color="#10B981" />
            <StatCard label="Absent (Counted)" value={absentCount} icon="fa-times-circle" color="#EF4444" />
            <StatCard label="Leave (Not Deducted)" value={leaveCount} icon="fa-pause-circle" color="#F59E0B" />
          </div>

          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', overflow: 'hidden' }}>
            <div style={{ padding: '1rem 1.5rem', borderBottom: '1px solid var(--border-color)', fontWeight: 700, fontSize: '0.9rem', color: 'var(--text-muted)', display: 'flex', justifyContent: 'space-between' }}>
              <span>Student Schedule & Timing</span>
              <span>Mark Attendance (45 Mins IST)</span>
            </div>

            <div>
              {students.map(student => {
                const record = dayRecords[student.id];
                const status = record?.status;

                const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || student.classDays || 'Thursday');
                const weeklyDayText = student.weeklyDay ? `Every ${student.weeklyDay}` : (student.classDays || '1 class / week');
                const timingsText = student.classTimings || '4:00 PM IST';

                return (
                  <div
                    key={student.id}
                    style={{
                      padding: '1.25rem 1.5rem',
                      borderBottom: '1px solid var(--border-color)',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'space-between',
                      gap: '1rem',
                      flexWrap: 'wrap',
                      background: status === 'present' ? 'rgba(16, 185, 129, 0.04)' : status === 'absent' ? 'rgba(239, 68, 68, 0.04)' : status === 'leave' ? 'rgba(245, 158, 11, 0.04)' : 'transparent'
                    }}
                  >
                    <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', minWidth: '320px' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '1.15rem', color: 'white' }}>
                        {student.name.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                          <span onClick={() => onViewProfile(student)} style={{ fontWeight: 800, fontSize: '1.1rem', cursor: 'pointer', textDecoration: 'underline' }}>
                            {student.name}
                          </span>
                          <span className={`badge badge-${student.feeStatus || 'paid'}`}>
                            {(student.feeStatus || 'paid').toUpperCase()}
                          </span>
                          <span className="badge badge-next" title="Next scheduled class date">
                            <i className="fas fa-calendar-alt"></i> Next: {formatReadableDate(nextDate)}
                          </span>
                        </div>

                        <div style={{ fontSize: '0.85rem', color: '#CBD5E1', marginTop: '0.35rem', display: 'flex', gap: '0.85rem', flexWrap: 'wrap', alignItems: 'center' }}>
                          <span style={{ color: '#FBBF24', fontWeight: 700 }}>
                            <i className="fas fa-clock"></i> {weeklyDayText} at {timingsText}
                          </span>
                          <span>•</span>
                          <span style={{ color: 'var(--text-muted)' }}>
                            <i className="fas fa-music"></i> {student.musicClass || 'Lessons'}
                          </span>
                          <span>•</span>
                          <span style={{ color: '#34D399', fontWeight: 600 }}>
                            {student.completedClassesCount || 0} completed
                          </span>
                        </div>

                        {student.pendingScheduleChange && (
                          <div style={{ fontSize: '0.75rem', color: '#818CF8', marginTop: '0.25rem', fontWeight: 600 }}>
                            <i className="fas fa-exchange-alt"></i> Schedule changing from next week to Every {student.pendingScheduleChange.newWeeklyDay} at {student.pendingScheduleChange.newTimings}
                          </div>
                        )}

                        {record?.reason && (
                          <div style={{ fontSize: '0.75rem', color: '#FBBF24', marginTop: '0.25rem' }}>
                            <i className="fas fa-info-circle"></i> {record.reason}
                          </div>
                        )}
                      </div>
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                      <button
                        onClick={() => onMarkAttendance(student.id, 'present')}
                        style={{
                          padding: '0.55rem 1.1rem',
                          borderRadius: 'var(--radius-md)',
                          fontWeight: 700,
                          fontSize: '0.85rem',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '0.4rem',
                          background: status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.15)',
                          color: status === 'present' ? 'white' : '#34D399',
                          border: `1px solid ${status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.4)'}`
                        }}
                      >
                        <i className="fas fa-check"></i> Present (Counted)
                      </button>

                      <button
                        onClick={() => onMarkAttendance(student.id, 'absent')}
                        style={{
                          padding: '0.55rem 1.1rem',
                          borderRadius: 'var(--radius-md)',
                          fontWeight: 700,
                          fontSize: '0.85rem',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '0.4rem',
                          background: status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.15)',
                          color: status === 'absent' ? 'white' : '#F87171',
                          border: `1px solid ${status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.4)'}`
                        }}
                      >
                        <i className="fas fa-times"></i> Absent (Counted)
                      </button>

                      <button
                        onClick={() => onMarkAttendance(student.id, 'leave')}
                        style={{
                          padding: '0.55rem 1.1rem',
                          borderRadius: 'var(--radius-md)',
                          fontWeight: 700,
                          fontSize: '0.85rem',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '0.4rem',
                          background: status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.15)',
                          color: status === 'leave' ? 'white' : '#FBBF24',
                          border: `1px solid ${status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.4)'}`
                        }}
                      >
                        <i className="fas fa-pause"></i> Leave (Not Deducted)
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // Students Directory Component (WITH PERMANENT SCHEDULE CHANGE BUTTON)
    function StudentsDirectoryView({ students, onAddStudent, onEditStudent, onChangeRegularSchedule, onDeleteStudent, onViewProfile }) {
      const [q, setQ] = useState('');
      const filtered = students.filter(s => s.name.toLowerCase().includes(q.toLowerCase()));

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div style={{ minWidth: '260px', flex: 1 }}>
              <input type="text" placeholder="Search students..." value={q} onChange={e => setQ(e.target.value)} style={{ width: '100%' }} />
            </div>
            <button onClick={onAddStudent} className="btn-primary">
              <i className="fas fa-user-plus"></i> Add New Student
            </button>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(330px, 1fr))', gap: '1.25rem' }}>
            {filtered.map(student => {
              const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || student.classDays || 'Thursday');
              const weeklyDayText = student.weeklyDay ? `Every ${student.weeklyDay}` : (student.classDays || '1 class / week');
              const timingsText = student.classTimings || '4:00 PM IST';

              return (
                <div key={student.id} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.85rem' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                        <div style={{ width: '46px', height: '46px', borderRadius: '12px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 800 }}>
                          {student.name.slice(0, 2).toUpperCase()}
                        </div>
                        <div>
                          <h4 style={{ fontSize: '1.1rem', fontWeight: 800 }}>{student.name}</h4>
                          <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{student.musicClass || 'Lessons'}</div>
                        </div>
                      </div>
                      <span className={`badge badge-${student.feeStatus || 'paid'}`}>{(student.feeStatus || 'paid').toUpperCase()}</span>
                    </div>

                    <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.6 }}>
                      {/* SCHEDULE BANNER WITH CHANGE BUTTON */}
                      <div style={{ background: 'var(--bg-subtle)', padding: '0.75rem 0.85rem', borderRadius: 'var(--radius-sm)', marginBottom: '0.75rem', border: '1px solid var(--border-color)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                          <div>
                            <div style={{ color: '#FBBF24', fontWeight: 700, fontSize: '0.88rem' }}>
                              <i className="fas fa-clock"></i> {weeklyDayText} at {timingsText}
                            </div>
                            <div style={{ color: '#A5B4FC', fontWeight: 700, marginTop: '0.2rem', fontSize: '0.82rem' }}>
                              <i className="fas fa-calendar-alt"></i> Next Class: {formatReadableDate(nextDate)}
                            </div>
                          </div>

                          <button
                            onClick={() => onChangeRegularSchedule(student)}
                            style={{
                              background: 'rgba(99, 102, 241, 0.2)',
                              color: '#A5B4FC',
                              border: '1px solid rgba(99, 102, 241, 0.4)',
                              borderRadius: 'var(--radius-sm)',
                              padding: '0.3rem 0.6rem',
                              fontSize: '0.75rem',
                              fontWeight: 700
                            }}
                            title="Change permanent weekly day & timing (This week or Next week)"
                          >
                            <i className="fas fa-exchange-alt"></i> Change Schedule
                          </button>
                        </div>

                        {student.pendingScheduleChange && (
                          <div style={{ fontSize: '0.75rem', color: '#34D399', marginTop: '0.4rem', borderTop: '1px solid var(--border-color)', paddingTop: '0.35rem' }}>
                            <i className="fas fa-hourglass-half"></i> Starts Next Week: Every {student.pendingScheduleChange.newWeeklyDay} at {student.pendingScheduleChange.newTimings}
                          </div>
                        )}
                      </div>

                      <div><strong>Package:</strong> {student.packageType || '4 Classes (₹6,000)'}</div>
                      <div><strong>Completed Classes:</strong> <span style={{ color: '#34D399', fontWeight: 800 }}>{student.completedClassesCount || 0}</span></div>
                      <div><strong>Last Class:</strong> {student.lastClassDate || 'N/A'}</div>
                      <div><strong>Last Payment:</strong> {student.lastPaymentDate || 'N/A'}</div>
                      <div><strong>Phone:</strong> {student.phone || 'N/A'}</div>
                    </div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '1rem', marginTop: '1rem', display: 'flex', justifyContent: 'space-between' }}>
                    <button onClick={() => onViewProfile(student)} className="btn-secondary" style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem' }}>
                      Profile
                    </button>
                    <div style={{ display: 'flex', gap: '0.4rem' }}>
                      <button onClick={() => onEditStudent(student)} className="btn-secondary" style={{ padding: '0.4rem 0.75rem', fontSize: '0.8rem' }}>
                        Edit Details
                      </button>
                      <button onClick={() => onDeleteStudent(student.id)} className="btn-danger" style={{ padding: '0.4rem 0.75rem', fontSize: '0.8rem' }}>
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // PERMANENT SCHEDULE CHANGE MODAL
    // (Inside Directory / Edit, Asks: This Week or Next Week)
    // ==========================================
    function ChangeRegularScheduleModal({ student, onClose, onConfirm }) {
      const [newWeeklyDay, setNewWeeklyDay] = useState(student.weeklyDay || 'Thursday');
      const [newTimings, setNewTimings] = useState(student.classTimings || '04:00 PM IST');
      const [effectiveScope, setEffectiveScope] = useState('next_week'); // 'this_week' | 'next_week'
      const [reason, setReason] = useState('Student regular timing update');

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirm({
          studentId: student.id,
          newWeeklyDay,
          newTimings,
          effectiveScope,
          reason
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <div style={{ width: '40px', height: '40px', borderRadius: '10px', background: 'var(--primary-light)', color: '#818CF8', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.15rem' }}>
                  <i className="fas fa-calendar-alt"></i>
                </div>
                <div>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Change Regular Schedule
                  </h3>
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                    {student.name} • Permanent Weekly Update
                  </div>
                </div>
              </div>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                {/* Current Schedule Banner */}
                <div style={{ gridColumn: '1 / -1', background: 'var(--bg-subtle)', padding: '0.75rem 1rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)', fontSize: '0.85rem' }}>
                  Current Schedule: <strong>Every {student.weeklyDay || 'Thursday'} at {student.classTimings || '4:00 PM IST'}</strong>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24' }}>
                    New Weekly Regular Day *
                  </label>
                  <select value={newWeeklyDay} onChange={e => setNewWeeklyDay(e.target.value)}>
                    <option value="Monday">Every Monday</option>
                    <option value="Tuesday">Every Tuesday</option>
                    <option value="Wednesday">Every Wednesday</option>
                    <option value="Thursday">Every Thursday</option>
                    <option value="Friday">Every Friday</option>
                    <option value="Saturday">Every Saturday</option>
                    <option value="Sunday">Every Sunday</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24' }}>
                    New Regular Timing (IST) *
                  </label>
                  <input
                    type="text"
                    required
                    value={newTimings}
                    onChange={e => setNewTimings(e.target.value)}
                    placeholder="e.g. 02:00 PM IST or 12:00 PM IST"
                  />
                </div>

                {/* WHEN TO APPLY: THIS WEEK OR NEXT WEEK */}
                <div className="form-group" style={{ gridColumn: '1 / -1', marginTop: '0.5rem' }}>
                  <label className="form-label" style={{ color: '#34D399', marginBottom: '0.5rem' }}>
                    When does this regular change take effect? *
                  </label>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                    <div
                      onClick={() => setEffectiveScope('this_week')}
                      style={{
                        background: effectiveScope === 'this_week' ? 'rgba(99, 102, 241, 0.25)' : 'var(--bg-subtle)',
                        border: `1px solid ${effectiveScope === 'this_week' ? 'var(--primary)' : 'var(--border-color)'}`,
                        borderRadius: 'var(--radius-md)',
                        padding: '0.85rem',
                        cursor: 'pointer'
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: 800, color: effectiveScope === 'this_week' ? '#818CF8' : 'white', fontSize: '0.9rem' }}>
                        <i className={effectiveScope === 'this_week' ? "fas fa-check-circle" : "far fa-circle"}></i>
                        From THIS WEEK
                      </div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.35rem' }}>
                        Moves this week's class to the new day ({newWeeklyDay}) immediately.
                      </div>
                    </div>

                    <div
                      onClick={() => setEffectiveScope('next_week')}
                      style={{
                        background: effectiveScope === 'next_week' ? 'rgba(99, 102, 241, 0.25)' : 'var(--bg-subtle)',
                        border: `1px solid ${effectiveScope === 'next_week' ? 'var(--primary)' : 'var(--border-color)'}`,
                        borderRadius: 'var(--radius-md)',
                        padding: '0.85rem',
                        cursor: 'pointer'
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: 800, color: effectiveScope === 'next_week' ? '#818CF8' : 'white', fontSize: '0.9rem' }}>
                        <i className={effectiveScope === 'next_week' ? "fas fa-check-circle" : "far fa-circle"}></i>
                        From NEXT WEEK
                      </div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.35rem' }}>
                        Keeps this week on current day, switches permanently from next week.
                      </div>
                    </div>
                  </div>
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Reason / Notes</label>
                  <input
                    type="text"
                    value={reason}
                    onChange={e => setReason(e.target.value)}
                    placeholder="e.g. Student requested slot change"
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save Regular Schedule
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Student Modal (Add/Edit)
    function StudentModal({ student, teacher, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: student?.name || '',
        teacherId: student?.teacherId || teacher?.id || 'gaurav',
        phone: student?.phone || '',
        email: student?.email || '',
        dob: student?.dob || '',
        joiningDate: student?.joiningDate || new Date().toISOString().split('T')[0],
        musicClass: student?.musicClass || 'Music Production',
        packageType: student?.packageType || '4 Classes Package (₹6,000)',
        packageAmount: student?.packageAmount || 6000,
        packageLimit: student?.packageLimit || 4,
        weeklyDay: student?.weeklyDay || 'Thursday',
        classTimings: student?.classTimings || '04:00 PM IST',
        nextClassDate: student?.nextClassDate || calculateNextClassDate(student?.weeklyDay || 'Thursday'),
        completedClassesCount: student?.completedClassesCount || 0,
        lastClassDate: student?.lastClassDate || '',
        lastPaymentDate: student?.lastPaymentDate || '',
        feeStatus: student?.feeStatus || 'paid'
      });

      const handleWeeklyDayChange = (day) => {
        const autoNext = calculateNextClassDate(day);
        setFormData(prev => ({
          ...prev,
          weeklyDay: day,
          nextClassDate: autoNext,
          classDays: `Every ${day}`
        }));
      };

      const handlePackageChange = (val) => {
        let amt = 6000;
        let limit = 4;
        if (val.includes('12')) { amt = 15000; limit = 12; }
        setFormData(prev => ({ ...prev, packageType: val, packageAmount: amt, packageLimit: limit }));
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>{student ? `Edit ${student.name}` : 'Add New Student'}</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => { e.preventDefault(); onSave({ ...formData, teacherName: teacher?.name || 'Gaurav', classDays: `Every ${formData.weeklyDay}` }); }}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Student Name *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Lesson Option *</label>
                  <select value={formData.musicClass} onChange={e => setFormData({ ...formData, musicClass: e.target.value })}>
                    <option value="Music Production">Music Production (45 mins)</option>
                    <option value="Vocal Lessons">Vocal Lessons (45 mins)</option>
                    <option value="Piano Lessons">Piano Lessons (45 mins)</option>
                    <option value="Audio Engineering">Audio Engineering (45 mins)</option>
                    <option value="Guitar Lessons">Guitar Lessons (45 mins)</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24' }}>
                    Weekly Class Day (1 class / week) *
                  </label>
                  <select value={formData.weeklyDay} onChange={e => handleWeeklyDayChange(e.target.value)}>
                    <option value="Monday">Every Monday</option>
                    <option value="Tuesday">Every Tuesday</option>
                    <option value="Wednesday">Every Wednesday</option>
                    <option value="Thursday">Every Thursday</option>
                    <option value="Friday">Every Friday</option>
                    <option value="Saturday">Every Saturday</option>
                    <option value="Sunday">Every Sunday</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24' }}>
                    Class Timings (e.g. 4pm, 12pm IST) *
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.classTimings}
                    onChange={e => setFormData({ ...formData, classTimings: e.target.value })}
                    placeholder="e.g. 04:00 PM IST or 12:00 PM IST"
                  />
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <label className="form-label" style={{ color: '#A5B4FC' }}>Next Class Date *</label>
                    <button
                      type="button"
                      onClick={() => setFormData(prev => ({ ...prev, nextClassDate: calculateNextClassDate(prev.weeklyDay) }))}
                      style={{ background: 'none', color: '#818CF8', fontSize: '0.75rem', textDecoration: 'underline' }}
                    >
                      ⚡ Auto-Calculate for upcoming {formData.weeklyDay}
                    </button>
                  </div>
                  <input
                    type="date"
                    required
                    value={formData.nextClassDate}
                    onChange={e => setFormData({ ...formData, nextClassDate: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Tuition Package</label>
                  <select value={formData.packageType} onChange={e => handlePackageChange(e.target.value)}>
                    <option value="4 Classes Package (₹6,000)">4 Classes Package (₹6,000)</option>
                    <option value="12 Classes Package (₹15,000)">12 Classes Package (₹15,000)</option>
                    <option value="Custom Classes Package">Custom Package</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Fee Status</label>
                  <select value={formData.feeStatus} onChange={e => setFormData({ ...formData, feeStatus: e.target.value })}>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Phone</label>
                  <input type="text" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Save Student</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

                        <td style={{ padding: '0.5rem 0.75rem', color: '#34D399' }}>{c.status}</td>

    // Password Modal
    function PasswordModal({ prompt, onClose, onSuccess }) {
      const [pwd, setPwd] = useState('');
      const [show, setShow] = useState(false);
      const [err, setErr] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setErr('');
        if (prompt.type === 'owner') {
          if (pwd.trim() === 'Owner123') onSuccess();
          else setErr('Incorrect Owner Password.');
        } else if (prompt.type === 'teacher') {
          const expected = prompt.targetTeacher.password || (prompt.targetTeacher.id === 'gaurav' ? 'Gaurav2305' : 'teacher123');
          if (pwd.trim() === expected) onSuccess();
          else setErr(`Incorrect password for ${prompt.targetTeacher.name}.`);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '420px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.15rem', fontWeight: 800 }}>
                {prompt.type === 'owner' ? 'Studio Admin Authentication' : `Enter Password for ${prompt.targetTeacher.name}`}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="modal-body">
                {err && <div style={{ background: 'rgba(239, 68, 68, 0.15)', color: '#FCA5A5', padding: '0.65rem', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.85rem' }}>{err}</div>}
                <div className="form-group">
                  <label className="form-label">{prompt.type === 'owner' ? 'Owner Password' : `Password for ${prompt.targetTeacher.name}`}</label>
                  <div style={{ position: 'relative' }}>
                    <input type={show ? 'text' : 'password'} autoFocus required value={pwd} onChange={e => setPwd(e.target.value)} style={{ width: '100%', paddingRight: '2.5rem' }} />
                    <button type="button" onClick={() => setShow(!show)} style={{ position: 'absolute', right: '0.75rem', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', background: 'none' }}>
                      <i className={`fas ${show ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                    </button>
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Unlock</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

                        </div>
                      </div>
