<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <style>
    :root {
      --bg-app: #0F172A;
      --bg-surface: #1E293B;
      --bg-surface-elevated: #334155;
      --bg-subtle: #0B1120;
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;
      
      --border-color: #334155;
      --border-light: #475569;
      
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      
      --accent: #EC4899;
      --accent-gradient: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
      
      --present: #10B981;
      --present-bg: rgba(16, 185, 129, 0.15);
      --present-border: rgba(16, 185, 129, 0.4);
      
      --absent: #EF4444;
      --absent-bg: rgba(239, 68, 68, 0.15);
      --absent-border: rgba(239, 68, 68, 0.4);
      
      --leave: #F59E0B;
      --leave-bg: rgba(245, 158, 11, 0.15);
      --leave-border: rgba(245, 158, 11, 0.4);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
      
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-app); }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-elevated); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    button {
      font-family: var(--font-main);
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
    }

    input, select, textarea {
      font-family: var(--font-main);
      outline: none;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-owner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(217, 119, 6, 0.25) 100%);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .badge-teacher {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.25) 100%);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .badge-paid {
      background: var(--present-bg);
      color: #34D399;
      border: 1px solid var(--present-border);
    }

    .badge-pending {
      background: var(--leave-bg);
      color: #FBBF24;
      border: 1px solid var(--leave-border);
    }

    .badge-overdue {
      background: var(--absent-bg);
      color: #F87171;
      border: 1px solid var(--absent-border);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-secondary:hover {
      background: var(--border-light);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-back {
      background: var(--bg-surface-elevated);
      color: #A5B4FC;
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-back:hover {
      background: var(--border-light);
      color: white;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body { padding: 1.5rem; }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-light);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const DEFAULT_CLOUD_URL = 'https://api.restful-api.dev/objects/ff808181a09d98f701a115f991681560';

    function App() {
      const initData = window.INITIAL_STUDIO_DATA || {};
      
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_students_v3');
          return saved ? JSON.parse(saved) : (initData.students || []);
        } catch (e) {
          return initData.students || [];
        }
      });

      const [teachers, setTeachers] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_teachers_v3');
          return saved ? JSON.parse(saved) : (initData.teachers || []);
        } catch (e) {
          return initData.teachers || [];
        }
      });

      const [classesHistory, setClassesHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_classes_v3');
          return saved ? JSON.parse(saved) : (initData.classes || []);
        } catch (e) {
          return initData.classes || [];
        }
      });

      const [payments, setPayments] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_payments_v3');
          return saved ? JSON.parse(saved) : (initData.payments || []);
        } catch (e) {
          return initData.payments || [];
        }
      });

      const [attendanceMap, setAttendanceMap] = useState(() => {
        try {
          const saved = localStorage.getItem('studio_attendance_map_v3');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [sheetUrl, setSheetUrl] = useState(() => {

      });

      // Navigation & Role Views
      const isOwner = currentUser?.role === 'owner';
      const isTeacher = currentUser?.role === 'teacher';
      const currentTeacherId = isTeacher ? (currentUser?.teacherId || currentUser?.id) : null;

      const [activeTab, setActiveTab] = useState('attendance');
      
      // REQUIREMENT 1: In Owner Portal, first thing shown must be list of teachers (selectedTeacherId = null).
      // When a specific teacher is clicked, selectedTeacherId is set to that teacher's id!
      const [selectedTeacherId, setSelectedTeacherId] = useState(null);

      const [selectedDate, setSelectedDate] = useState(() => {
        return new Date().toISOString().split('T')[0];
      });

      const [editingStudent, setEditingStudent] = useState(null);
      const [profileViewingStudent, setProfileViewingStudent] = useState(null);

      const [editingTeacher, setEditingTeacher] = useState(null);

      // REQUIREMENT 3: Leave Dialog Modal State
      const [leaveModalData, setLeaveModalData] = useState(null);

      // Modals for payments & cycles
      const [isRecordPaymentOpen, setIsRecordPaymentOpen] = useState(false);
      const [paymentTargetStudent, setPaymentTargetStudent] = useState(null);
      const [isAddCycleModalOpen, setIsAddCycleModalOpen] = useState(false);
      const [cycleTargetStudent, setCycleTargetStudent] = useState(null);
      const [isAddCycleClassDateOpen, setIsAddCycleClassDateOpen] = useState(false);
      const [cycleClassTarget, setCycleClassTarget] = useState(null); // { student, cycleId }

      const [toast, setToast] = useState(null);

      };

      useEffect(() => { localStorage.setItem('studio_students_v3', JSON.stringify(students)); }, [students]);

      useEffect(() => { localStorage.setItem('studio_classes_v3', JSON.stringify(classesHistory)); }, [classesHistory]);
      useEffect(() => { localStorage.setItem('studio_payments_v3', JSON.stringify(payments)); }, [payments]);
      useEffect(() => { localStorage.setItem('studio_attendance_map_v3', JSON.stringify(attendanceMap)); }, [attendanceMap]);
      useEffect(() => { localStorage.setItem('studio_sheet_url_v3', sheetUrl); }, [sheetUrl]);
      useEffect(() => {
        if (currentUser) localStorage.setItem('studio_auth_user', JSON.stringify(currentUser));
        else localStorage.removeItem('studio_auth_user');
      }, [currentUser]);

      const syncWithCloud = async () => {
        setSyncStatus('syncing');
        try {

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({

          });
          setSyncStatus('synced');
          setLastSyncTime(Date.now());
        } catch (e) {
          setSyncStatus('error');
        }
      };

      // Auto-poll cloud updates
      useEffect(() => {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(DEFAULT_CLOUD_URL + '?t=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
              const json = await res.json();
              const cloud = json?.data;
              if (cloud && cloud.updatedAt && cloud.updatedAt > lastSyncTime) {
                if (cloud.students) setStudents(cloud.students);
                if (cloud.teachers) setTeachers(cloud.teachers);
                if (cloud.classes) setClassesHistory(cloud.classes);
                if (cloud.payments) setPayments(cloud.payments);
                if (cloud.attendanceMap) setAttendanceMap(cloud.attendanceMap);
                setLastSyncTime(cloud.updatedAt);
              }
            }
          } catch (e) {}
        }, 12000);
        return () => clearInterval(interval);
      }, [lastSyncTime]);

      // Active Teacher for filtering
      const effectiveTeacherId = isTeacher ? currentTeacherId : selectedTeacherId;

      const visibleStudents = useMemo(() => {
        if (!effectiveTeacherId || effectiveTeacherId === 'all') {
          return students;
        }
        return students.filter(s => (s.teacherId || 'gaurav') === effectiveTeacherId);
      }, [students, effectiveTeacherId]);

      // ==========================================
      // REQUIREMENT 3: ATTENDANCE RULES (IST ONLY)
      // Present: Counted towards package
      // Absent: Counted towards package (student's fault)
      // Leave: NOT counted, requires Leave Reason Dialog
      // ==========================================
      const handleAttendanceButtonClick = (studentId, status) => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        if (status === 'leave') {
          // Open the Leave Reason Dialog Box!
          setLeaveModalData({
            studentId,
            studentName: student.name,
            date: selectedDate
          });
          return;
        }

        // For Present or Absent
        executeAttendanceMarking(studentId, status);
      };

      const executeAttendanceMarking = (studentId, status, leaveReason = '') => {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const istTime = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
        
        // Is class counted towards package limit?
        // Present -> Counted (1)
        // Absent -> Counted (1) (student did not inform previously, student's fault)
        // Leave -> NOT counted (0) (informed previously)
        const isClassCounted = (status === 'present' || status === 'absent');

        // Update attendanceMap
        const updatedAttendanceMap = {
          ...attendanceMap,
          [selectedDate]: {
            ...(attendanceMap[selectedDate] || {}),
            [studentId]: {
              status,
              time: istTime,
              isCounted: isClassCounted,
              reason: leaveReason,
              teacherId: student.teacherId || 'gaurav',
              teacherName: student.teacherName || 'Gaurav',
              updatedAt: Date.now()
            }
          }
        };
        setAttendanceMap(updatedAttendanceMap);

        // Update class history
        const statusLabel = status === 'present' 
          ? 'Present (Class Counted)' 
          : status === 'absent' 
            ? 'Absent - Uninformed (Class Counted)' 
            : `Leave - Informed (Class NOT Deducted - ${leaveReason})`;

        const existingClassIdx = classesHistory.findIndex(c => c.studentId === studentId && c.date === selectedDate);
        let newClasses = [...classesHistory];
        
        if (existingClassIdx >= 0) {
          newClasses[existingClassIdx] = {
            ...newClasses[existingClassIdx],
            status: statusLabel,
            time: istTime,
            remarks: leaveReason || (status === 'present' ? 'Attended 45-min music session' : 'Absent without prior notice')
          };
        } else {
          newClasses.unshift({
            id: 'cls_' + studentId + '_' + Date.now(),
            studentId,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            teacherName: student.teacherName || 'Gaurav',
            date: selectedDate,
            time: student.classTimings || '45 mins IST',
            classNumber: (student.completedClassesCount || 0) + (isClassCounted ? 1 : 0),
            status: statusLabel,
            remarks: leaveReason || (status === 'present' ? 'Attended 45-min music session' : 'Absent without prior notice')
          });
        }
        setClassesHistory(newClasses);

        // If class is counted, increment completedClassesCount & update student's active cycle!
        let updatedStudents = students.map(s => {
          if (s.id === studentId) {
            let pkgs = s.packageHistory ? [...s.packageHistory] : [];
            let lastClassDate = s.lastClassDate;

            if (isClassCounted) {
              const newCount = (s.completedClassesCount || 0) + 1;
              const newCycleCount = (s.currentCycleCompleted || 0) + 1;
              lastClassDate = selectedDate;

              // Also add to latest cycle's classDates if available
              if (pkgs.length > 0) {
                let latestPkg = { ...pkgs[pkgs.length - 1] };
                let dates = latestPkg.classDates ? [...latestPkg.classDates] : [];
                if (!dates.includes(selectedDate)) {
                  dates.push(selectedDate);
                }
                latestPkg.classDates = dates;
                latestPkg.completedCount = newCycleCount;
                latestPkg.endDate = selectedDate;
                pkgs[pkgs.length - 1] = latestPkg;
              }

              return {
                ...s,
                completedClassesCount: newCount,
                currentCycleCompleted: newCycleCount,
                lastClassDate,
                packageHistory: pkgs
              };
            } else {
              // Leave: not counted, just update leave record
              return { ...s, lastLeaveDate: selectedDate };
            }
          }
          return s;
        });

        setStudents(updatedStudents);

        if (status === 'present') {
          showToast(`Marked PRESENT for ${student.name} (+1 Class Counted in IST)`, 'success');
        } else if (status === 'absent') {
          showToast(`Marked ABSENT for ${student.name} (+1 Class Consumed - Uninformed)`, 'error');
        } else {
          showToast(`Marked LEAVE for ${student.name} (Class NOT deducted: ${leaveReason})`, 'info');
        }

        syncWithCloud();
      };

      // Add / Edit Student (Owner)
      const handleSaveStudent = (data) => {
        if (editingStudent) {
          setStudents(students.map(s => s.id === editingStudent.id ? { ...data, id: editingStudent.id } : s));
          showToast(`Student ${data.name} updated!`, 'success');
        } else {
          const newId = 'std_' + Date.now();
          const newPkg = {
            cycleId: 1,
            packageType: data.packageType || '4 Classes Package (₹6,000)',
            packageAmount: data.packageAmount || 6000,
            limit: data.packageLimit || 4,
            completedCount: Number(data.completedClassesCount) || 0,
            startDate: data.joiningDate || selectedDate,
            endDate: data.lastClassDate || selectedDate,
            feeStatus: data.feeStatus || 'paid',
            classDates: data.lastClassDate ? [data.lastClassDate] : []
          };
          setStudents([...students, {
            ...data,
            id: newId,
            packageHistory: [newPkg],
            avatarColor: data.avatarColor || '#6366F1'
          }]);
          showToast(`New student ${data.name} registered!`, 'success');
        }
        setIsAddStudentOpen(false);
        setEditingStudent(null);
        syncWithCloud();
      };

      // Add New Cycle to a Student (REQUIREMENT 2)
      const handleSaveNewCycle = (cycleData) => {
        const student = students.find(s => s.id === cycleData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const nextCycleNum = pkgs.length + 1;

        const newPkg = {
          cycleId: nextCycleNum,
          packageType: cycleData.packageType,
          packageAmount: Number(cycleData.packageAmount) || 6000,
          limit: Number(cycleData.limit) || 4,
          completedCount: 0,
          startDate: cycleData.startDate || new Date().toISOString().split('T')[0],
          endDate: cycleData.startDate || new Date().toISOString().split('T')[0],
          feeStatus: cycleData.feeStatus || 'pending',
          remarks: cycleData.remarks || `Cycle ${nextCycleNum} started`,
          classDates: []
        };

        pkgs.push(newPkg);

        setStudents(students.map(s => s.id === student.id ? {
          ...s,
          packageType: cycleData.packageType,
          packageAmount: newPkg.packageAmount,
          packageLimit: newPkg.limit,
          feeStatus: cycleData.feeStatus || s.feeStatus,
          currentCycleCompleted: 0,
          packageHistory: pkgs
        } : s));

        setIsAddCycleModalOpen(false);
        setCycleTargetStudent(null);
        showToast(`Cycle #${nextCycleNum} (${cycleData.packageType}) added for ${student.name}!`, 'success');
        syncWithCloud();
      };

      // Add Class Date to an existing Cycle (REQUIREMENT 2)
      const handleSaveClassDateToCycle = (dateData) => {
        const student = students.find(s => s.id === dateData.studentId);
        if (!student) return;

        let pkgs = student.packageHistory ? [...student.packageHistory] : [];
        const cycleIdx = pkgs.findIndex(p => p.cycleId === Number(dateData.cycleId));
        if (cycleIdx === -1) return;

        let targetCycle = { ...pkgs[cycleIdx] };
        let dates = targetCycle.classDates ? [...targetCycle.classDates] : [];
        if (!dates.includes(dateData.date)) {
          dates.push(dateData.date);
          dates.sort();
        }
        targetCycle.classDates = dates;
        targetCycle.completedCount = dates.length;
        targetCycle.endDate = dates[dates.length - 1];
        pkgs[cycleIdx] = targetCycle;

        // Recalculate total completed classes
        const totalCompleted = pkgs.reduce((acc, p) => acc + (p.classDates ? p.classDates.length : (p.completedCount || 0)), 0);

        setStudents(students.map(s => s.id === student.id ? {
          ...s,
          completedClassesCount: totalCompleted,
          lastClassDate: dateData.date > (s.lastClassDate || '') ? dateData.date : s.lastClassDate,
          packageHistory: pkgs
        } : s));

        // Also add to classesHistory log
        setClassesHistory([
          {
            id: 'cls_cycle_' + Date.now(),
            studentId: student.id,
            studentName: student.name,
            teacherId: student.teacherId || 'gaurav',
            teacherName: student.teacherName || 'Gaurav',
            date: dateData.date,
            time: '45 mins IST',
            classNumber: dates.length,
            cycleId: dateData.cycleId,
            status: 'Present (Cycle Class)',
            remarks: dateData.remarks || `Backlog session for Cycle ${dateData.cycleId}`
          },
          ...classesHistory
        ]);

        setIsAddCycleClassDateOpen(false);
        setCycleClassTarget(null);
        showToast(`Added class date ${dateData.date} to Cycle #${dateData.cycleId} for ${student.name}!`, 'success');
        syncWithCloud();
      };

      // Record Payment for Student (REQUIREMENT 4)
      const handleSavePayment = (paymentData) => {
        const newPayment = {
          ...paymentData,
          id: 'pay_' + Date.now(),
          status: 'Completed'
        };
        setPayments([newPayment, ...payments]);

        // Update student status and last payment date
        if (paymentData.studentId) {
          setStudents(students.map(s => {
            if (s.id === paymentData.studentId) {
              return {
                ...s,
                feeStatus: 'paid',
                lastPaymentDate: paymentData.paymentDate
              };
            }
            return s;
          }));
        }

        setIsRecordPaymentOpen(false);
        setPaymentTargetStudent(null);
        showToast('Payment recorded successfully in Indian Standard Time (IST)!', 'success');
        syncWithCloud();
      };

      // Export Full Backup JSON
      const handleExportBackup = () => {
        const blob = new Blob([JSON.stringify({ students, teachers, classesHistory, payments, attendanceMap, sheetUrl }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `studio_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Full backup downloaded!', 'success');
      };

      // IF NOT LOGGED IN -> Show Login Form
      if (!currentUser) {
        return (
          <div style={{
            minHeight: '100vh',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '1.5rem',
            background: 'radial-gradient(circle at 50% 30%, #1E1B4B 0%, #0F172A 70%, #030712 100%)'
          }}>
            <div style={{
              maxWidth: '460px',
              width: '100%',
              background: 'rgba(30, 41, 59, 0.85)',
              backdropFilter: 'blur(16px)',
              border: '1px solid rgba(99, 102, 241, 0.3)',
              borderRadius: '24px',
              padding: '2.5rem',
              boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.6)'
            }}>
              <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                <div style={{
                  width: '68px',
                  height: '68px',
                  background: 'var(--primary-gradient)',
                  borderRadius: '20px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 1.25rem',
                  fontSize: '2rem',
                  color: 'white',
                  boxShadow: '0 8px 24px rgba(99, 102, 241, 0.45)'
                }}>
                  <i className="fas fa-headphones-alt"></i>
                </div>
                <h1 style={{ fontFamily: 'var(--font-heading)', fontSize: '1.75rem', fontWeight: 800, marginBottom: '0.4rem' }}>
                  Music Studio Portal
                </h1>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>
                  Sign in with Owner or Teacher credentials
                </p>
              </div>

              <LoginForm 
                teachers={teachers}
                onLogin={(user) => {
                  setCurrentUser(user);
                  showToast(`Welcome, ${user.name}!`, 'success');
                }}
              />
            </div>
            {toast && <Toast toast={toast} />}
          </div>
        );
      }

      // Selected teacher object if chosen in Owner Portal
      const selectedTeacherObj = teachers.find(t => t.id === selectedTeacherId);

      // MAIN AUTHENTICATED PORTAL
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Top Header */}
          <header style={{
            background: 'var(--bg-surface)',
            borderBottom: '1px solid var(--border-color)',
            position: 'sticky',
            top: 0,
            zIndex: 100,
            backdropFilter: 'blur(10px)'
          }}>
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0.85rem 1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.9rem' }}>
                <div style={{
                  width: '42px',
                  height: '42px',
                  background: 'var(--primary-gradient)',
                  borderRadius: '12px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  color: 'white',
                  fontSize: '1.25rem'
                }}>
                  <i className="fas fa-music"></i>
                </div>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                    <h2 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                      Music Production Studio
                    </h2>
                    {isOwner ? (
                      <span className="badge badge-owner">
                        <i className="fas fa-crown"></i> OWNER PORTAL
                      </span>
                    ) : (
                      <span className="badge badge-teacher">
                        <i className="fas fa-chalkboard-teacher"></i> TEACHER: {currentUser.name.toUpperCase()}
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    45 Mins/Class • 1 Class/Week • Indian Standard Time (IST) Active
                  </div>
                </div>
              </div>

              {/* Status & Logout */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
                <div
                  onClick={() => syncWithCloud()}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.4rem',
                    fontSize: '0.8rem',
                    color: syncStatus === 'synced' ? '#34D399' : '#FBBF24',
                    background: 'var(--bg-subtle)',
                    padding: '0.4rem 0.8rem',
                    borderRadius: 'var(--radius-full)',
                    border: '1px solid var(--border-color)',
                    cursor: 'pointer'
                  }}
                >
                  <i className="fas fa-circle" style={{ fontSize: '0.55rem' }}></i>
                  <span>{syncStatus === 'synced' ? 'Cloud Synced' : 'Syncing...'}</span>
                </div>

                <button
                  onClick={() => {
                    if (confirm('Sign out of your session?')) {
                      setCurrentUser(null);
                      setSelectedTeacherId(null);
                    }
                  }}
                  className="btn-secondary"
                  style={{ padding: '0.45rem 0.9rem', fontSize: '0.85rem' }}
                >
                  <i className="fas fa-sign-out-alt"></i> Logout
                </button>
              </div>
            </div>

            {/* Navigation Tabs Bar */}
            <div style={{
              maxWidth: '1440px',
              margin: '0 auto',
              padding: '0 1.5rem',
              display: 'flex',
              gap: '0.5rem',
              overflowX: 'auto',
              borderTop: '1px solid var(--border-color)'
            }}>
              <TabButton
                active={activeTab === 'attendance'}
                onClick={() => setActiveTab('attendance')}
                icon="fa-calendar-check"
                label={isTeacher ? "My Attendance" : "Attendance Marking"}
                badge={isTeacher ? visibleStudents.length : undefined}
              />
              <TabButton
                active={activeTab === 'students'}
                onClick={() => setActiveTab('students')}
                icon="fa-user-graduate"
                label={isTeacher ? "My Students" : "Students Directory"}
              />
              <TabButton
                active={activeTab === 'cycles'}
                onClick={() => setActiveTab('cycles')}
                icon="fa-sync-alt"
                label="Package Cycles & Backlog"
              />

              {isOwner && (
                <>
                  <TabButton
                    active={activeTab === 'payments'}
                    onClick={() => setActiveTab('payments')}
                    icon="fa-credit-card"
                    label="Payments & Fees"
                    badge={payments.length}
                  />
                  <TabButton
                    active={activeTab === 'teachers'}
                    onClick={() => setActiveTab('teachers')}
                    icon="fa-chalkboard-teacher"
                    label="Teachers Management"
                    badge={teachers.length}
                  />
                  <TabButton
                    active={activeTab === 'sheet'}
                    onClick={() => setActiveTab('sheet')}
                    icon="fa-table"
                    label="Google Sheet Live"
                  />
                  <TabButton
                    active={activeTab === 'database'}
                    onClick={() => setActiveTab('database')}
                    icon="fa-database"
                    label="In-App Database"
                  />
                </>
              )}
            </div>
          </header>

          {/* Main Content Area */}
          <main style={{ maxWidth: '1440px', margin: '0 auto', padding: '1.75rem 1.5rem', width: '100%', flex: 1 }}>
            
            {/* REQUIREMENT 1 FOR ATTENDANCE & STUDENTS IN OWNER PORTAL: 
                If Owner hasn't selected a teacher yet, FIRST show the list of teachers! */}
            {isOwner && (activeTab === 'attendance' || activeTab === 'students') && !selectedTeacherId ? (
              <OwnerTeacherSelectionView 
                teachers={teachers}
                students={students}
                onSelectTeacher={(teacherId) => setSelectedTeacherId(teacherId)}
                onSelectAllStudents={() => setSelectedTeacherId('all')}
                onAddTeacher={() => setIsAddTeacherOpen(true)}
              />
            ) : (
              <>
                {/* Breadcrumb Bar when viewing a selected teacher in Owner Portal */}
                {isOwner && (activeTab === 'attendance' || activeTab === 'students') && selectedTeacherId && (
                  <div style={{
                    background: 'var(--bg-surface-elevated)',
                    border: '1px solid var(--border-color)',
                    padding: '0.75rem 1.25rem',
                    borderRadius: 'var(--radius-md)',
                    marginBottom: '1.25rem',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    gap: '1rem',
                    flexWrap: 'wrap'
                  }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                      <button onClick={() => setSelectedTeacherId(null)} className="btn-back">
                        <i className="fas fa-arrow-left"></i> Back to Teachers List
                      </button>
                      <span style={{ color: 'var(--text-muted)' }}>|</span>
                      <span style={{ fontWeight: 700, fontSize: '0.95rem' }}>
                        Viewing: <span style={{ color: '#818CF8' }}>{selectedTeacherId === 'all' ? 'All Teachers Combined' : selectedTeacherObj?.name}</span> ({visibleStudents.length} Students)
                      </span>
                    </div>

                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                      {selectedTeacherId !== 'all' && (
                        <button onClick={() => setSelectedTeacherId('all')} className="btn-secondary" style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem' }}>
                          Show All Teachers
                        </button>
                      )}
                      <button onClick={() => setSelectedTeacherId(null)} className="btn-secondary" style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem' }}>
                        Switch Teacher
                      </button>
                    </div>
                  </div>
                )}

                {/* Tab 1: Attendance Marking */}
                {activeTab === 'attendance' && (
                  <AttendanceView
                    students={visibleStudents}
                    selectedDate={selectedDate}
                    onDateChange={setSelectedDate}
                    attendanceMap={attendanceMap}
                    onMarkAttendance={handleAttendanceButtonClick}
                    isOwner={isOwner}
                    isTeacher={isTeacher}
                    currentTeacherName={isTeacher ? currentUser.name : (selectedTeacherObj?.name || 'All Teachers')}
                    onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                    onViewProfile={(std) => setProfileViewingStudent(std)}
                  />
                )}

                {/* Tab 2: Students Directory */}
                {activeTab === 'students' && (
                  <StudentsDirectoryView
                    students={visibleStudents}
                    isOwner={isOwner}
                    isTeacher={isTeacher}
                    onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                    onEditStudent={(std) => { setEditingStudent(std); setIsAddStudentOpen(true); }}
                    onDeleteStudent={(stdId) => {
                      const s = students.find(x => x.id === stdId);
                      if (confirm(`Delete student "${s?.name}"?`)) {
                        setStudents(students.filter(x => x.id !== stdId));
                        showToast(`Student ${s?.name} removed.`, 'info');
                        syncWithCloud();
                      }
                    }}
                    onViewProfile={(std) => setProfileViewingStudent(std)}
                    teachers={teachers}
                  />
                )}
              </>
            )}

            {/* REQUIREMENT 2: Package Cycles & Backlog Section */}
            {activeTab === 'cycles' && (
              <PackageCyclesBacklogView
                students={isTeacher ? visibleStudents : students}
                teachers={teachers}
                isOwner={isOwner}
                onOpenAddCycle={(student) => {
                  setCycleTargetStudent(student);
                  setIsAddCycleModalOpen(true);
                }}
                onOpenAddClassDate={(student, cycleId) => {
                  setCycleClassTarget({ student, cycleId });
                  setIsAddCycleClassDateOpen(true);
                }}
                onDeleteClassDate={(studentId, cycleId, dateToRemove) => {
                  if (confirm(`Remove class date "${dateToRemove}" from Cycle ${cycleId}?`)) {
                    setStudents(students.map(s => {
                      if (s.id === studentId && s.packageHistory) {
                        const pkgs = s.packageHistory.map(p => {
                          if (p.cycleId === cycleId) {
                            const newDates = (p.classDates || []).filter(d => d !== dateToRemove);
                            return { ...p, classDates: newDates, completedCount: newDates.length };
                          }
                          return p;
                        });
                        const total = pkgs.reduce((a, b) => a + (b.classDates ? b.classDates.length : (b.completedCount || 0)), 0);
                        return { ...s, completedClassesCount: total, packageHistory: pkgs };
                      }
                      return s;
                    }));
                    showToast('Class date removed from cycle.', 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}

            {/* REQUIREMENT 4: Payments & Fees Tab (Student First -> Click to View History & Dates) */}
            {isOwner && activeTab === 'payments' && (
              <StudentPaymentsView
                students={students}
                payments={payments}
                teachers={teachers}
                onRecordPaymentForStudent={(student) => {
                  setPaymentTargetStudent(student);
                  setIsRecordPaymentOpen(true);
                }}
                onDeletePayment={(payId) => {
                  if (confirm('Delete this payment transaction?')) {
                    setPayments(payments.filter(p => p.id !== payId));
                    showToast('Payment record removed.', 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}

            {/* Teachers Management Tab (Owner Only) */}
            {isOwner && activeTab === 'teachers' && (
              <TeachersManagementView
                teachers={teachers}
                students={students}
                onAddTeacher={() => { setEditingTeacher(null); setIsAddTeacherOpen(true); }}
                onEditTeacher={(t) => { setEditingTeacher(t); setIsAddTeacherOpen(true); }}
                onDeleteTeacher={(tId) => {
                  const t = teachers.find(x => x.id === tId);
                  if (confirm(`Delete teacher "${t?.name}"? Students will be reassigned to Gaurav.`)) {
                    setTeachers(teachers.filter(x => x.id !== tId));
                    setStudents(students.map(s => s.teacherId === tId ? { ...s, teacherId: 'gaurav', teacherName: 'Gaurav' } : s));
                    showToast(`Teacher ${t?.name} removed.`, 'info');
                    syncWithCloud();
                  }
                }}
              />
            )}

            {/* Google Sheet Live Tab */}
            {isOwner && activeTab === 'sheet' && (
              <GoogleSheetView
                sheetUrl={sheetUrl}
                onEditUrl={() => setIsEditSheetUrlOpen(true)}
              />
            )}

            {/* Database Tab */}
            {isOwner && activeTab === 'database' && (
              <DatabaseInspectorView
                students={students}
                teachers={teachers}
                classes={classesHistory}
                payments={payments}
                onExportBackup={handleExportBackup}
                onSyncCloud={() => syncWithCloud()}
              />
            )}
          </main>

          {/* REQUIREMENT 3: Leave Reason Dialog Box Modal */}
          {leaveModalData && (
            <LeaveReasonModal
              data={leaveModalData}
              onClose={() => setLeaveModalData(null)}
              onConfirm={(reason) => {
                executeAttendanceMarking(leaveModalData.studentId, 'leave', reason);
                setLeaveModalData(null);
              }}
            />
          )}

          {/* Add / Edit Student Modal */}
          {isAddStudentOpen && (
            <StudentModal
              student={editingStudent}
              teachers={teachers}
              onClose={() => { setIsAddStudentOpen(false); setEditingStudent(null); }}
              onSave={handleSaveStudent}
            />
          )}

          {/* Student Profile Modal */}
          {profileViewingStudent && (
            <StudentProfileModal
              student={profileViewingStudent}
              classes={classesHistory.filter(c => c.studentId === profileViewingStudent.id)}
              payments={payments.filter(p => p.studentId === profileViewingStudent.id)}
              onClose={() => setProfileViewingStudent(null)}
              isOwner={isOwner}
              onEdit={() => {
                setEditingStudent(profileViewingStudent);
                setProfileViewingStudent(null);
                setIsAddStudentOpen(true);
              }}
            />
          )}

          {/* Teacher Modal */}
          {isAddTeacherOpen && (
            <TeacherModal
              teacher={editingTeacher}
              onClose={() => { setIsAddTeacherOpen(false); setEditingTeacher(null); }}
              onSave={(tData) => {
                if (editingTeacher) {
                  setTeachers(teachers.map(t => t.id === editingTeacher.id ? { ...tData, id: editingTeacher.id } : t));
                  showToast('Teacher details updated!', 'success');
                } else {
                  const newId = (tData.username || 'teacher_' + Date.now()).toLowerCase().replace(/\s+/g, '');
                  setTeachers([...teachers, { ...tData, id: newId, status: 'active' }]);
                  showToast(`Teacher ${tData.name} created!`, 'success');
                }
                setIsAddTeacherOpen(false);
                setEditingTeacher(null);
                syncWithCloud();
              }}
            />
          )}

          {/* Add Cycle Modal (REQUIREMENT 2) */}
          {isAddCycleModalOpen && cycleTargetStudent && (
            <AddCycleModal
              student={cycleTargetStudent}
              onClose={() => { setIsAddCycleModalOpen(false); setCycleTargetStudent(null); }}
              onSave={handleSaveNewCycle}
            />
          )}

          {/* Add Class Date to Cycle Modal (REQUIREMENT 2) */}
          {isAddCycleClassDateOpen && cycleClassTarget && (
            <AddClassDateModal
              student={cycleClassTarget.student}
              cycleId={cycleClassTarget.cycleId}
              onClose={() => { setIsAddCycleClassDateOpen(false); setCycleClassTarget(null); }}
              onSave={handleSaveClassDateToCycle}
            />
          )}

          {/* Record Payment Modal (REQUIREMENT 4) */}
          {isRecordPaymentOpen && (
            <PaymentModal
              students={students}
              targetStudent={paymentTargetStudent}
              onClose={() => { setIsRecordPaymentOpen(false); setPaymentTargetStudent(null); }}
              onSave={handleSavePayment}
            />
          )}

          {/* Edit Sheet URL Modal */}
          {isEditSheetUrlOpen && (
            <EditSheetUrlModal
              currentUrl={sheetUrl}
              onClose={() => setIsEditSheetUrlOpen(false)}
              onSave={(newUrl) => {
                setSheetUrl(newUrl);
                setIsEditSheetUrlOpen(false);
                showToast('Google Sheet URL saved!', 'success');
                syncWithCloud();
              }}
            />
          )}

          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // ==========================================
    // REQUIREMENT 3: LEAVE REASON DIALOG BOX MODAL
    // ==========================================
    function LeaveReasonModal({ data, onClose, onConfirm }) {
      const [informedBy, setInformedBy] = useState('student'); // 'student' | 'teacher'
      const [reason, setReason] = useState('');
      const [quickReason, setQuickReason] = useState('');

      const quickOptions = informedBy === 'student' ? [
        'Student unwell / medical reason',
        'School / College exam conflict',
        'Family function / emergency',
        'Student informed in advance',
        'Out of town'
      ] : [
        'Teacher rescheduled session',
        'Studio studio recording in progress',
        'Holiday / Studio closed',
        'Rescheduled to weekend'
      ];

      const handleConfirm = (e) => {
        e.preventDefault();
        const finalReason = reason.trim() || quickReason || (informedBy === 'student' ? 'Student informed leave in advance' : 'Teacher rescheduled class');
        onConfirm(`[${informedBy === 'student' ? 'Student Leave' : 'Teacher Rescheduled'}] ${finalReason}`);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <div style={{ width: '38px', height: '38px', borderRadius: '10px', background: 'var(--leave-bg)', border: '1px solid var(--leave-border)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#FBBF24', fontSize: '1.1rem' }}>
                  <i className="fas fa-pause"></i>
                </div>
                <div>
                  <h3 style={{ fontSize: '1.15rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Record Class Leave
                  </h3>
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                    {data.studentName} • Date: {data.date} (IST)
                  </div>
                </div>
              </div>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleConfirm}>
              <div className="modal-body">
                <div style={{
                  background: 'rgba(245, 158, 11, 0.1)',
                  border: '1px solid rgba(245, 158, 11, 0.3)',
                  padding: '0.85rem 1rem',
                  borderRadius: 'var(--radius-md)',
                  color: '#FDE68A',
                  fontSize: '0.85rem',
                  marginBottom: '1.25rem',
                  lineHeight: 1.5
                }}>
                  <i className="fas fa-info-circle"></i> <strong>Note:</strong> Leave means class did not happen and was informed previously. <strong>This class will NOT be deducted</strong> from the student's package limit.
                </div>

                <div style={{ marginBottom: '1.25rem' }}>
                  <label className="form-label" style={{ marginBottom: '0.5rem', display: 'block' }}>
                    Who informed previously?
                  </label>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.65rem' }}>
                    <button
                      type="button"
                      onClick={() => { setInformedBy('student'); setQuickReason(''); }}
                      className={informedBy === 'student' ? 'btn-primary' : 'btn-secondary'}
                      style={{ justifyContent: 'center', fontSize: '0.85rem', padding: '0.55rem' }}
                    >
                      <i className="fas fa-user-graduate"></i> By Student
                    </button>
                    <button
                      type="button"
                      onClick={() => { setInformedBy('teacher'); setQuickReason(''); }}
                      className={informedBy === 'teacher' ? 'btn-primary' : 'btn-secondary'}
                      style={{ justifyContent: 'center', fontSize: '0.85rem', padding: '0.55rem' }}
                    >
                      <i className="fas fa-chalkboard-teacher"></i> By Teacher / Studio
                    </button>
                  </div>
                </div>

                <div style={{ marginBottom: '1.25rem' }}>
                  <label className="form-label" style={{ marginBottom: '0.4rem', display: 'block' }}>
                    Quick Reasons:
                  </label>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                    {quickOptions.map((opt, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => { setQuickReason(opt); setReason(opt); }}
                        style={{
                          background: reason === opt ? 'var(--primary)' : 'var(--bg-subtle)',
                          color: reason === opt ? 'white' : 'var(--text-muted)',
                          border: '1px solid var(--border-color)',
                          padding: '0.35rem 0.65rem',
                          borderRadius: 'var(--radius-full)',
                          fontSize: '0.75rem',
                          fontWeight: 600
                        }}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Specific Reason / Remarks for this date *</label>
                  <textarea
                    rows={2}
                    required
                    value={reason}
                    onChange={(e) => setReason(e.target.value)}
                    placeholder="Enter reason for class leave..."
                    style={{ width: '100%', resize: 'none' }}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary" style={{ background: 'linear-gradient(135deg, #F59E0B 0%, #D97706 100%)' }}>
                  <i className="fas fa-check"></i> Save Leave (Class Not Deducted)
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

                    <span><i className="fas fa-music"></i> {student.musicClass || 'Lessons'}</span>

              <div style={{ display: 'flex', gap: '1.5rem', textAlign: 'right' }}>

                <i className="fas fa-folder-open" style={{ fontSize: '2.5rem', marginBottom: '1rem', opacity: 0.4 }}></i>
                <p>No package cycles recorded yet for this student.</p>

    // Individual Cycle Card Component with Expandable Class Dates
    function CycleCard({ cycle, student, isOwner, onAddClassDate, onDeleteClassDate }) {
      const [isExpanded, setIsExpanded] = useState(true);
      const classDates = cycle.classDates || [];
      const limit = cycle.limit || 4;
      const count = classDates.length || cycle.completedCount || 0;
      const progressPercent = Math.min(100, Math.round((count / limit) * 100));

      return (
        <div style={{
          background: 'var(--bg-surface)',
          border: '1px solid var(--border-color)',
          borderRadius: 'var(--radius-lg)',
          overflow: 'hidden',
          boxShadow: 'var(--shadow-sm)'
        }}>
          {/* Cycle Header */}
          <div
            onClick={() => setIsExpanded(!isExpanded)}
            style={{
              padding: '1.25rem 1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              cursor: 'pointer',
              background: isExpanded ? 'var(--bg-surface-elevated)' : 'transparent',
              transition: 'background 0.2s ease',
              flexWrap: 'wrap'
            }}
          >
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
              <div style={{
                width: '42px',
                height: '42px',
                borderRadius: '12px',
                background: 'var(--primary-gradient)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                color: 'white',
                fontWeight: 800,
                fontSize: '1.1rem'
              }}>
                #{cycle.cycleId}
              </div>

              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                  <h4 style={{ fontSize: '1.15rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Cycle #{cycle.cycleId}: {cycle.packageType || `${limit} Classes Package`}
                  </h4>
                  <span className={`badge badge-${cycle.feeStatus === 'paid' ? 'paid' : 'pending'}`}>
                    {(cycle.feeStatus || 'paid').toUpperCase()}
                  </span>
                </div>
                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>
                  Dates: {cycle.startDate || 'Start'} to {cycle.endDate || 'End'} • Fee: ₹{Number(cycle.packageAmount || 6000).toLocaleString('en-IN')}
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
              <div style={{ width: '160px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', fontWeight: 700, marginBottom: '0.3rem' }}>
                  <span>Completed</span>
                  <span style={{ color: count >= limit ? '#34D399' : '#818CF8' }}>{count} / {limit} Classes</span>
                </div>
                <div style={{ width: '100%', height: '8px', background: 'var(--bg-subtle)', borderRadius: '999px', overflow: 'hidden' }}>
                  <div style={{
                    width: `${progressPercent}%`,
                    height: '100%',
                    background: count >= limit ? '#10B981' : 'var(--primary-gradient)',
                    borderRadius: '999px'
                  }} />
                </div>
              </div>

              <div style={{ fontSize: '1.1rem', color: 'var(--text-muted)' }}>

                  <button onClick={(e) => { e.stopPropagation(); onAddClassDate(); }} className="btn-primary" style={{ padding: '0.35rem 0.75rem', fontSize: '0.8rem' }}>
                    <i className="fas fa-plus"></i> Add Class Date to this Cycle

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: '0.75rem' }}>
                  {classDates.map((dateStr, dIdx) => (
                    <div
                      key={dIdx}
                      style={{
                        background: 'var(--bg-surface)',
                        border: '1px solid var(--border-color)',
                        borderRadius: 'var(--radius-md)',

                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',

                          {dateStr}
                        </div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.15rem' }}>
                          Class #{dIdx + 1} of Cycle • 45 Mins IST
                        </div>
                      </div>

                      {isOwner && (
                        <button
                          onClick={() => onDeleteClassDate(dateStr)}

                          <i className="fas fa-trash-alt"></i>
                        </button>

                  ))}

              )}

          )}
        </div>
      );

    // ==========================================
    // REQUIREMENT 4: PAYMENTS & FEES VIEW
    // Shows Students First -> Click Student to View
    // Last Payment Date, Status & All Past Dates!
    // ==========================================
    function StudentPaymentsView({ students, payments, teachers, onRecordPaymentForStudent, onDeletePayment }) {

        if (!searchQ.trim()) return students;
        const q = searchQ.toLowerCase();
        return students.filter(s => s.name.toLowerCase().includes(q) || (s.phone && s.phone.includes(q)));
      }, [students, searchQ]);

      // If a student is selected, view their dedicated payment ledger!
      if (selectedStudentForLedger) {
        const student = selectedStudentForLedger;
        const studentPayments = payments.filter(p => p.studentId === student.id);
        const totalPaid = studentPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);

        return (
          <div>
            {/* Header with Back Button */}
            <div style={{
              background: 'var(--bg-surface)',
              border: '1px solid var(--border-color)',
              borderRadius: 'var(--radius-lg)',
              padding: '1.25rem 1.5rem',
              marginBottom: '1.5rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                <button onClick={() => setSelectedStudentForLedger(null)} className="btn-back">
                  <i className="fas fa-arrow-left"></i> Back to All Students
                </button>
                <div>
                  <h3 style={{ fontSize: '1.3rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                    Payment History for {student.name}

                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>

              <button onClick={() => onRecordPaymentForStudent(student)} className="btn-primary">

              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',

              marginBottom: '1.5rem'

                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase' }}>Current Fee Status</div>
                <div style={{ marginTop: '0.4rem' }}>
                  <span className={`badge badge-${student.feeStatus || 'paid'}`} style={{ fontSize: '1rem', padding: '0.4rem 0.85rem' }}>

              <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem' }}>
                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase' }}>Last Payment Date</div>
                <div style={{ fontSize: '1.35rem', fontWeight: 800, color: '#A5B4FC', marginTop: '0.2rem' }}>
                  {student.lastPaymentDate || 'No recorded date'}

              <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem' }}>

                <div style={{ fontSize: '1.35rem', fontWeight: 800, color: '#34D399', marginTop: '0.2rem' }}>
                  ₹{totalPaid.toLocaleString('en-IN')}

              </div>

              <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem' }}>

                <div style={{ fontSize: '1.35rem', fontWeight: 800, color: '#F8FAFC', marginTop: '0.2rem' }}>
                  {studentPayments.length} Payments

              </div>
            </div>

            {/* List of All Previous Dates Payment Made */}
            <div style={{
              background: 'var(--bg-surface)',
              border: '1px solid var(--border-color)',
              borderRadius: 'var(--radius-lg)',
              overflowX: 'auto'
            }}>
              <div style={{ padding: '1rem 1.5rem', borderBottom: '1px solid var(--border-color)', fontWeight: 700, color: 'var(--text-muted)' }}>
                All Previous Payment Dates & Transactions
              </div>

              {studentPayments.length === 0 ? (
                <div style={{ padding: '2.5rem', textAlign: 'center', color: 'var(--text-muted)' }}>
                  No past payment transactions recorded for this student.
                </div>
              ) : (
                <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.9rem' }}>

                      <th style={{ padding: '1rem 1.25rem' }}>Date of Payment</th>
                      <th style={{ padding: '1rem 1.25rem' }}>Amount (₹)</th>
                      <th style={{ padding: '1rem 1.25rem' }}>Package / Cycle</th>
                      <th style={{ padding: '1rem 1.25rem' }}>Payment Method</th>
                      <th style={{ padding: '1rem 1.25rem' }}>Receipt / Ref</th>
                      <th style={{ padding: '1rem 1.25rem' }}>Remarks</th>
                      <th style={{ padding: '1rem 1.25rem', textAlign: 'right' }}>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {studentPayments.map(p => (
                      <tr key={p.id} style={{ borderBottom: '1px solid var(--border-color)' }}>
                        <td style={{ padding: '0.85rem 1.25rem', fontWeight: 800, color: '#A5B4FC' }}>
                          <i className="fas fa-calendar-check" style={{ marginRight: '0.5rem', opacity: 0.7 }}></i>
                          {p.paymentDate}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', fontWeight: 800, color: '#34D399' }}>
                          ₹{Number(p.amount || 0).toLocaleString('en-IN')}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>
                          {p.packageType || student.packageType}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)' }}>
                          {p.paymentMethod || 'UPI / GPay'}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-faint)', fontSize: '0.8rem' }}>
                          {p.receiptNo || 'N/A'}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                          {p.remarks || 'Tuition fee'}
                        </td>
                        <td style={{ padding: '0.85rem 1.25rem', textAlign: 'right' }}>
                          <button
                            onClick={() => onDeletePayment(p.id)}
                            style={{ color: '#F87171', background: 'none' }}
                            title="Delete transaction"
                          >
                            <i className="fas fa-trash"></i>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        );
      }

      // Default View: Show Each Student Card / Tile
      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Payments & Fees Directory
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                Select a student below to inspect payment status, last payment date, and all past payment dates
              </p>
            </div>

            <div style={{ minWidth: '260px' }}>
              <input
                type="text"
                placeholder="Search student by name..."
                value={searchQ}
                onChange={(e) => setSearchQ(e.target.value)}
                style={{ width: '100%' }}
              />
            </div>
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))',
            gap: '1.25rem'
          }}>
            {filteredStudents.map(student => {
              const studentPayments = payments.filter(p => p.studentId === student.id);
              const totalAmount = studentPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);

              return (
                <div
                  key={student.id}
                  onClick={() => setSelectedStudentForLedger(student)}
                  style={{
                    background: 'var(--bg-surface)',
                    border: '1px solid var(--border-color)',
                    borderRadius: 'var(--radius-lg)',
                    padding: '1.5rem',
                    cursor: 'pointer',
                    transition: 'all 0.2s ease',
                    boxShadow: 'var(--shadow-sm)',
                    display: 'flex',
                    flexDirection: 'column',
                    justifyContent: 'space-between'
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.borderColor = 'var(--primary)';
                    e.currentTarget.style.transform = 'translateY(-2px)';
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.borderColor = 'var(--border-color)';
                    e.currentTarget.style.transform = 'translateY(0)';
                  }}
                >
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.85rem' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                        <div style={{
                          width: '44px',
                          height: '44px',
                          borderRadius: '12px',
                          background: student.avatarColor || '#6366F1',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          color: 'white',
                          fontWeight: 800
                        }}>
                          {student.name.slice(0, 2).toUpperCase()}

                        <div>

                          </h4>

                            Teacher: {student.teacherName || 'Gaurav'}
                          </div>

                      </div>

                      <span className={`badge badge-${student.feeStatus || 'paid'}`}>
                        {(student.feeStatus || 'paid').toUpperCase()}

                    <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: '1rem' }}>
                      <div><strong style={{ color: 'var(--text-main)' }}>Package:</strong> {student.packageType || '4 Classes (₹6,000)'}</div>
                      <div><strong style={{ color: 'var(--text-main)' }}>Last Payment Date:</strong> <span style={{ color: '#A5B4FC', fontWeight: 700 }}>{student.lastPaymentDate || 'Not recorded'}</span></div>
                      <div><strong style={{ color: 'var(--text-main)' }}>Total Paid to Date:</strong> <span style={{ color: '#34D399', fontWeight: 800 }}>₹{totalAmount.toLocaleString('en-IN')}</span> ({studentPayments.length} payments)</div>

                  <div style={{
                    borderTop: '1px solid var(--border-color)',

                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    fontSize: '0.85rem',
                    color: '#818CF8',
                    fontWeight: 700
                  }}>
                    <span>View All Past Payment Dates</span>
                    <i className="fas fa-arrow-right"></i>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
