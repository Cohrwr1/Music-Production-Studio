    // Modal: Add New Cycle (4 Classes / 12 Classes / Custom)
    function AddCycleModal({ student, onClose, onSave }) {
      const [packageType, setPackageType] = useState('4 Classes Package (₹6,000)');
      const [limit, setLimit] = useState(4);
      const [packageAmount, setPackageAmount] = useState(6000);
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [feeStatus, setFeeStatus] = useState('paid');
      const [remarks, setRemarks] = useState('');

      const handlePackageChange = (val) => {
        setPackageType(val);
        if (val === '4 Classes Package (₹6,000)') {
          setLimit(4);
          setPackageAmount(6000);
        } else if (val === '12 Classes Package (₹15,000)') {
          setLimit(12);
          setPackageAmount(15000);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          studentId: student.id,
          packageType,
          limit: Number(limit),
          packageAmount: Number(packageAmount),
          startDate,
          feeStatus,
          remarks
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Add New Package Cycle for {student.name}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Package Plan Option *</label>
                  <select
                    value={packageType}
                    onChange={(e) => handlePackageChange(e.target.value)}
                  >
                    <option value="4 Classes Package (₹6,000)">4 Classes Package (₹6,000)</option>
                    <option value="12 Classes Package (₹15,000)">12 Classes Package (₹15,000)</option>
                    <option value="Custom Classes Package">Custom Classes Package (Specify Limit & Fee)</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Total Classes Limit in Cycle *</label>
                  <input
                    type="number"
                    required
                    min={1}
                    value={limit}
                    onChange={(e) => setLimit(Number(e.target.value))}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Cycle Amount (₹) *</label>
                  <input
                    type="number"
                    required
                    value={packageAmount}
                    onChange={(e) => setPackageAmount(Number(e.target.value))}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Cycle Start Date *</label>
                  <input
                    type="date"
                    required
                    value={startDate}
                    onChange={(e) => setStartDate(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Payment Status *</label>
                  <select
                    value={feeStatus}
                    onChange={(e) => setFeeStatus(e.target.value)}
                  >
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                  </select>
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Cycle Remarks / Notes</label>
                  <input
                    type="text"
                    value={remarks}
                    onChange={(e) => setRemarks(e.target.value)}
                    placeholder="e.g. Renewed cycle, 45 mins IST"
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Create Cycle
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Add Class Date to Cycle
    function AddClassDateModal({ student, cycleId, onClose, onSave }) {
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [remarks, setRemarks] = useState('Completed 45-min music class');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          studentId: student.id,
          cycleId,
          date,
          remarks
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '460px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Add Class Date to Cycle #{cycleId}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body">
                <div style={{ marginBottom: '1rem' }}>
                  <label className="form-label">Student: <strong>{student.name}</strong></label>
                </div>

                <div className="form-group" style={{ marginBottom: '1rem' }}>
                  <label className="form-label">Date Class Was Held (IST) *</label>
                  <input
                    type="date"
                    required
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    style={{ width: '100%' }}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Remarks / Topics Covered</label>
                  <input
                    type="text"
                    value={remarks}
                    onChange={(e) => setRemarks(e.target.value)}
                    style={{ width: '100%' }}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-calendar-plus"></i> Save Class Date

              </div>
            </form>
          </div>
        </div>
      );

    // Attendance View Component
    function AttendanceView({ students, selectedDate, onDateChange, attendanceMap, onMarkAttendance, isOwner, isTeacher, currentTeacherName, onAddStudent, onViewProfile }) {
      const dayRecords = attendanceMap[selectedDate] || {};

      const presentCount = students.filter(s => dayRecords[s.id]?.status === 'present').length;
      const absentCount = students.filter(s => dayRecords[s.id]?.status === 'absent').length;
      const leaveCount = students.filter(s => dayRecords[s.id]?.status === 'leave').length;

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {isTeacher ? `${currentTeacherName}'s Attendance Roster` : `Studio Attendance (${currentTeacherName})`}
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                Present: Class Counted • Absent (Uninformed): Class Counted • Leave (Informed): Class NOT Deducted
              </p>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', background: 'var(--bg-subtle)', padding: '0.35rem 0.75rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-color)' }}>
                <i className="fas fa-calendar-alt" style={{ color: 'var(--primary)' }}></i>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => onDateChange(e.target.value)}
                  style={{ background: 'none', border: 'none', padding: '0.2rem', color: 'white', fontWeight: 700 }}
                />
              </div>

              {isOwner && (
                <button onClick={onAddStudent} className="btn-primary" style={{ padding: '0.55rem 1rem', fontSize: '0.85rem' }}>
                  <i className="fas fa-plus"></i> Add Student
                </button>
              )}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem', marginBottom: '1.5rem' }}>
            <StatCard label="Total Students" value={students.length} icon="fa-users" color="#6366F1" />
            <StatCard label="Present (Counted)" value={presentCount} icon="fa-check-circle" color="#10B981" />
            <StatCard label="Absent (Counted)" value={absentCount} icon="fa-times-circle" color="#EF4444" />

                          height: '48px',

                          fontWeight: 800,

                            <span><i className="fas fa-chalkboard-teacher"></i> {student.teacherName || 'Gaurav'}</span>
                          </div>

                          <div style={{ fontSize: '0.8rem', color: '#818CF8', marginTop: '0.25rem', fontWeight: 600 }}>
                            <i className="fas fa-tasks"></i> Completed: {student.completedClassesCount || 0} classes ({student.packageType || '4 Classes (₹6,000)'})
                          </div>

                          {record?.reason && (
                            <div style={{ fontSize: '0.75rem', color: '#FBBF24', marginTop: '0.25rem' }}>
                              <i className="fas fa-info-circle"></i> Reason: {record.reason}
                            </div>
                          )}
                        </div>
                      </div>

                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                        <button
                          onClick={() => onMarkAttendance(student.id, 'present')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.15)',
                            color: status === 'present' ? 'white' : '#34D399',
                            border: `1px solid ${status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-check"></i> Present (Counted)
                        </button>

                        <button
                          onClick={() => onMarkAttendance(student.id, 'absent')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.15)',
                            color: status === 'absent' ? 'white' : '#F87171',
                            border: `1px solid ${status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-times"></i> Absent (Counted)
                        </button>

                        <button
                          onClick={() => onMarkAttendance(student.id, 'leave')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.15)',
                            color: status === 'leave' ? 'white' : '#FBBF24',
                            border: `1px solid ${status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-pause"></i> Leave (Not Deducted)
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Modal: Record Payment
    function PaymentModal({ students, targetStudent, onClose, onSave }) {
      const [studentId, setStudentId] = useState(targetStudent?.id || students[0]?.id || '');
      const [amount, setAmount] = useState(6000);
      const [paymentDate, setPaymentDate] = useState(new Date().toISOString().split('T')[0]);
      const [packageType, setPackageType] = useState('4 Classes Package (₹6,000)');
      const [paymentMethod, setPaymentMethod] = useState('UPI / GPay');
      const [receiptNo, setReceiptNo] = useState(`REC-${Date.now().toString().slice(-6)}`);
      const [remarks, setRemarks] = useState('Tuition fee renewal (IST)');

      const handlePackageChange = (val) => {
        setPackageType(val);
        if (val.includes('12')) setAmount(15000);
        else if (val.includes('4')) setAmount(6000);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const std = students.find(s => s.id === studentId);
        onSave({
          studentId,
          studentName: std ? std.name : 'Student',
          amount: Number(amount),
          paymentDate,
          packageType,
          paymentMethod,
          receiptNo,
          remarks
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Record Tuition Payment
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Student *</label>
                  <select value={studentId} onChange={(e) => setStudentId(e.target.value)}>
                    {students.map(s => (
                      <option key={s.id} value={s.id}>{s.name} ({s.teacherName || 'Gaurav'})</option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Package Option</label>
                  <select value={packageType} onChange={(e) => handlePackageChange(e.target.value)}>
                    <option value="4 Classes Package (₹6,000)">4 Classes Package (₹6,000)</option>
                    <option value="12 Classes Package (₹15,000)">12 Classes Package (₹15,000)</option>
                    <option value="Custom Classes Package">Custom Package</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Amount (₹) *</label>
                  <input type="number" required value={amount} onChange={(e) => setAmount(Number(e.target.value))} />
                </div>

                <div className="form-group">
                  <label className="form-label">Payment Date (IST) *</label>
                  <input type="date" required value={paymentDate} onChange={(e) => setPaymentDate(e.target.value)} />
                </div>

                <div className="form-group">
                  <label className="form-label">Payment Method</label>
                  <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>
                    <option value="UPI / GPay / Paytm">UPI / GPay / Paytm</option>
                    <option value="Bank Net Banking / NEFT">Bank Net Banking / NEFT</option>
                    <option value="Cash">Cash</option>
                    <option value="Credit / Debit Card">Credit / Debit Card</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Receipt / Transaction Ref</label>
                  <input type="text" value={receiptNo} onChange={(e) => setReceiptNo(e.target.value)} />
                </div>

                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <label className="form-label">Remarks</label>
                  <input type="text" value={remarks} onChange={(e) => setRemarks(e.target.value)} />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Save Payment Record
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Student Add / Edit
    function StudentModal({ student, teachers, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: student?.name || '',
        teacherId: student?.teacherId || 'gaurav',
        phone: student?.phone || '',
        email: student?.email || '',
        dob: student?.dob || '',
        joiningDate: student?.joiningDate || new Date().toISOString().split('T')[0],
        musicClass: student?.musicClass || 'Music Production',
        packageType: student?.packageType || '4 Classes Package (₹6,000)',
        packageAmount: student?.packageAmount || 6000,
        packageLimit: student?.packageLimit || 4,
        classTimings: student?.classTimings || '45 mins IST',
        classDays: student?.classDays || '1 class / week',
        completedClassesCount: student?.completedClassesCount || 0,
        lastClassDate: student?.lastClassDate || '',
        lastPaymentDate: student?.lastPaymentDate || '',
        feeStatus: student?.feeStatus || 'paid'
      });

      const handlePackageChange = (val) => {
        let amt = 6000;
        let limit = 4;
        if (val.includes('12')) { amt = 15000; limit = 12; }
        setFormData({ ...formData, packageType: val, packageAmount: amt, packageLimit: limit });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const t = teachers.find(x => x.id === formData.teacherId);
        onSave({
          ...formData,
          teacherName: t ? t.name : 'Gaurav'
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {student ? `Edit Student: ${student.name}` : 'Register New Student'}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Full Name *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Assigned Teacher *</label>
                  <select value={formData.teacherId} onChange={e => setFormData({ ...formData, teacherId: e.target.value })}>
                    {teachers.map(t => (
                      <option key={t.id} value={t.id}>{t.name} ({t.username})</option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Lesson Option *</label>
                  <select value={formData.musicClass} onChange={e => setFormData({ ...formData, musicClass: e.target.value })}>
                    <option value="Music Production">Music Production (45 mins)</option>
                    <option value="Vocal Lessons">Vocal Lessons (45 mins)</option>
                    <option value="Piano Lessons">Piano Lessons (45 mins)</option>
                    <option value="Audio Engineering">Audio Engineering (45 mins)</option>
                    <option value="Guitar Lessons">Guitar Lessons (45 mins)</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Tuition Package</label>
                  <select value={formData.packageType} onChange={e => handlePackageChange(e.target.value)}>
                    <option value="4 Classes Package (₹6,000)">4 Classes Package (₹6,000)</option>
                    <option value="12 Classes Package (₹15,000)">12 Classes Package (₹15,000)</option>
                    <option value="Custom Classes Package">Custom Package</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Class Timings (IST - 45 mins)</label>
                  <input type="text" value={formData.classTimings} onChange={e => setFormData({ ...formData, classTimings: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Weekly Schedule</label>
                  <input type="text" value={formData.classDays} onChange={e => setFormData({ ...formData, classDays: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Total Completed Classes Count</label>
                  <input type="number" value={formData.completedClassesCount} onChange={e => setFormData({ ...formData, completedClassesCount: Number(e.target.value) })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Fee Status</label>
                  <select value={formData.feeStatus} onChange={e => setFormData({ ...formData, feeStatus: e.target.value })}>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="overdue">Overdue</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Phone Number</label>
                  <input type="text" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Date of Birth (DOB)</label>
                  <input type="date" value={formData.dob} onChange={e => setFormData({ ...formData, dob: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Joining Date</label>
                  <input type="date" value={formData.joiningDate} onChange={e => setFormData({ ...formData, joiningDate: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Last Class Date</label>
                  <input type="date" value={formData.lastClassDate} onChange={e => setFormData({ ...formData, lastClassDate: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Last Payment Date</label>
                  <input type="date" value={formData.lastPaymentDate} onChange={e => setFormData({ ...formData, lastPaymentDate: e.target.value })} />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save Student
                </button>
              </div>
            </form>
          </div>
        </div>
      );

                <div><strong>Total Completed:</strong> <span style={{ color: '#34D399', fontWeight: 800 }}>{student.completedClassesCount || 0} classes</span></div>
                <div><strong>Last Class Date:</strong> {student.lastClassDate || 'N/A'}</div>
                <div><strong>Last Payment Date:</strong> {student.lastPaymentDate || 'N/A'}</div>
                <div><strong>Fee Status:</strong> <span className={`badge badge-${student.feeStatus || 'paid'}`}>{(student.feeStatus || 'paid').toUpperCase()}</span></div>
              </div>

              <h4 style={{ fontSize: '1.05rem', fontWeight: 700, marginBottom: '0.75rem', fontFamily: 'var(--font-heading)' }}>
                <i className="fas fa-calendar-alt"></i> Complete Sessions Log ({classes.length} Sessions)
              </h4>
              <div style={{ maxHeight: '180px', overflowY: 'auto', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)', marginBottom: '1.5rem' }}>
                {classes.length === 0 ? (
                  <div style={{ padding: '1rem', textAlign: 'center', color: 'var(--text-muted)' }}>No sessions logged yet.</div>
                ) : (
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.85rem' }}>
                    <tbody>
                      {classes.map(c => (
                        <tr key={c.id} style={{ borderBottom: '1px solid var(--border-color)' }}>
                          <td style={{ padding: '0.5rem 0.85rem', fontWeight: 700, color: '#A5B4FC' }}>{c.date}</td>
                          <td style={{ padding: '0.5rem 0.85rem' }}>Class #{c.classNumber}</td>
                          <td style={{ padding: '0.5rem 0.85rem', color: 'var(--text-muted)' }}>{c.time}</td>
                          <td style={{ padding: '0.5rem 0.85rem', color: '#34D399' }}>{c.status}</td>
                          <td style={{ padding: '0.5rem 0.85rem', color: 'var(--text-muted)' }}>{c.remarks}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            </div>

            <div className="modal-footer">
              {isOwner && (
                <button onClick={onEdit} className="btn-primary">
                  <i className="fas fa-edit"></i> Edit All Student Fields
                </button>
              )}
              <button onClick={onClose} className="btn-secondary">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // Modal: Teacher Add / Edit
    function TeacherModal({ teacher, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: teacher?.name || '',
        username: teacher?.username || '',
        password: teacher?.password || '',
        email: teacher?.email || '',
        phone: teacher?.phone || '',
        specialization: teacher?.specialization || 'Music Production & Vocals'
      });

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {teacher ? `Edit Teacher: ${teacher.name}` : 'Add New Teacher'}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Teacher Name *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Login User ID *</label>
                  <input type="text" required value={formData.username} onChange={e => setFormData({ ...formData, username: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Login Password *</label>
                  <input type="text" required value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Subject / Specialty</label>
                  <input type="text" value={formData.specialization} onChange={e => setFormData({ ...formData, specialization: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} />
                </div>

                <div className="form-group">
                  <label className="form-label">Phone</label>
                  <input type="text" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Save Teacher
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal: Edit Sheet URL
    function EditSheetUrlModal({ currentUrl, onClose, onSave }) {
      const [url, setUrl] = useState(currentUrl);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Configure Google Sheet Link
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(url.trim()); }}>
              <div className="modal-body">
                <label className="form-label" style={{ marginBottom: '0.4rem', display: 'block' }}>Spreadsheet URL</label>
                <input type="url" required value={url} onChange={e => setUrl(e.target.value)} style={{ width: '100%' }} />
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Save Link</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Teachers Management View
    function TeachersManagementView({ teachers, students, onAddTeacher, onEditTeacher, onDeleteTeacher }) {
      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Teachers & Portal Logins
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                Manage credentials. Teachers only see students assigned to them.
              </p>
            </div>

            <button onClick={onAddTeacher} className="btn-primary">
              <i className="fas fa-plus"></i> Add New Teacher
            </button>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '1.25rem' }}>
            {teachers.map(t => {
              const count = students.filter(s => (s.teacherId || 'gaurav') === t.id).length;

              return (
                <div key={t.id} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.5rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1rem' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: 'linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.25rem' }}>
                        <i className="fas fa-chalkboard-teacher"></i>
                      </div>
                      <div>
                        <h4 style={{ fontSize: '1.15rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>{t.name}</h4>
                        <div style={{ fontSize: '0.8rem', color: '#A5B4FC' }}>User ID: <strong>{t.username || t.id}</strong></div>
                      </div>
                    </div>
                    <span className="badge badge-teacher">Active</span>
                  </div>

                  <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: '1.25rem' }}>
                    <div><strong style={{ color: 'var(--text-main)' }}>Assigned Students:</strong> <span style={{ color: '#34D399', fontWeight: 700 }}>{count} Students</span></div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Specialty:</strong> {t.specialization || 'Music Instructor'}</div>
                    <div><strong style={{ color: 'var(--text-main)' }}>Password:</strong> <code>{t.password}</code></div>
                  </div>

                  <div style={{ display: 'flex', gap: '0.5rem', borderTop: '1px solid var(--border-color)', paddingTop: '1rem' }}>
                    <button onClick={() => onEditTeacher(t)} className="btn-secondary" style={{ flex: 1, justifyContent: 'center', fontSize: '0.85rem' }}>
                      <i className="fas fa-edit"></i> Edit Credentials
                    </button>
                    {t.id !== 'gaurav' && (
                      <button onClick={() => onDeleteTeacher(t.id)} className="btn-danger" style={{ fontSize: '0.85rem' }}>
                        <i className="fas fa-trash"></i>
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Google Sheet View
    function GoogleSheetView({ sheetUrl, onEditUrl }) {
      let embedUrl = sheetUrl;
      if (embedUrl.includes('docs.google.com/spreadsheets/d/')) {
        const match = embedUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (match && match[1]) {
          embedUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/pubhtml?widget=true&headers=false`;
        }
      }

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Live Google Sheet Viewer
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                View your personal attendance spreadsheet directly inside the app
              </p>
            </div>

            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <button onClick={onEditUrl} className="btn-secondary">
                <i className="fas fa-link"></i> Change Sheet Link
              </button>
              <a href={sheetUrl} target="_blank" rel="noreferrer" className="btn-primary" style={{ textDecoration: 'none' }}>
                <i className="fas fa-external-link-alt"></i> Open Sheet
              </a>
            </div>
          </div>

          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', overflow: 'hidden', height: '75vh' }}>
            <iframe src={embedUrl} style={{ width: '100%', height: '100%', border: 'none', background: 'white' }} title="Sheet" />
          </div>
        </div>
      );
    }

    // In-App Database View
    function DatabaseInspectorView({ students, teachers, classes, payments, onExportBackup, onSyncCloud }) {
      const [tableTab, setTableTab] = useState('students');

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                In-App Database & Cloud Backup Engine
              </h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                All records stored safely within the app and cloud
              </p>
            </div>

            <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap' }}>
              <button onClick={onSyncCloud} className="btn-secondary">
                <i className="fas fa-cloud-upload-alt"></i> Force Cloud Sync
              </button>
              <button onClick={onExportBackup} className="btn-primary">
                <i className="fas fa-download"></i> Download Full Studio Backup (.JSON)
              </button>
            </div>
          </div>

          <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
            <button onClick={() => setTableTab('students')} className={tableTab === 'students' ? 'btn-primary' : 'btn-secondary'}>Students ({students.length})</button>
            <button onClick={() => setTableTab('teachers')} className={tableTab === 'teachers' ? 'btn-primary' : 'btn-secondary'}>Teachers ({teachers.length})</button>
            <button onClick={() => setTableTab('classes')} className={tableTab === 'classes' ? 'btn-primary' : 'btn-secondary'}>Classes ({classes.length})</button>
            <button onClick={() => setTableTab('payments')} className={tableTab === 'payments' ? 'btn-primary' : 'btn-secondary'}>Payments ({payments.length})</button>
          </div>

          <div style={{ background: 'var(--bg-subtle)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.25rem', maxHeight: '60vh', overflowY: 'auto', fontFamily: 'monospace', fontSize: '0.85rem' }}>
            <pre style={{ color: '#E2E8F0', whiteSpace: 'pre-wrap' }}>
              {JSON.stringify(tableTab === 'students' ? students : tableTab === 'teachers' ? teachers : tableTab === 'classes' ? classes.slice(0, 50) : payments, null, 2)}
            </pre>
          </div>
        </div>
      );
    }

    // Helper Stat Card
    function StatCard({ label, value, icon, color }) {
      return (
        <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.15rem 1.25rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
          <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: `${color}20`, border: `1px solid ${color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center', color, fontSize: '1.2rem' }}>
            <i className={`fas ${icon}`}></i>
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>{label}</div>
            <div style={{ fontSize: '1.4rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>{value}</div>
          </div>
        </div>
      );
    }

    // Helper Tab Button
    function TabButton({ active, onClick, icon, label, badge }) {
      return (
        <button
          onClick={onClick}
          style={{
            padding: '0.85rem 1.15rem',
            background: 'none',
            color: active ? 'white' : 'var(--text-muted)',
            borderBottom: active ? '3px solid var(--primary)' : '3px solid transparent',
            fontWeight: active ? 700 : 600,
            fontSize: '0.9rem',
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.6rem',
            whiteSpace: 'nowrap'
          }}
        >
          <i className={`fas ${icon}`} style={{ color: active ? 'var(--primary)' : 'inherit' }}></i>
          <span>{label}</span>
          {badge !== undefined && (
            <span style={{ background: active ? 'var(--primary-light)' : 'var(--bg-surface-elevated)', color: active ? '#818CF8' : 'var(--text-muted)', padding: '0.15rem 0.5rem', borderRadius: '999px', fontSize: '0.75rem', fontWeight: 700 }}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // Login Form Component
    function LoginForm({ teachers, onLogin }) {
      const [u, setU] = useState('');
      const [p, setP] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        const user = u.trim().toLowerCase();
        const pass = p.trim();

        if ((user === 'owner' || user === 'admin') && pass === 'admin123') {
          onLogin({ id: 'owner', name: 'Studio Owner', username: 'owner', role: 'owner' });
          return;
        }

        const teacher = teachers.find(t => (t.username?.toLowerCase() === user || t.id.toLowerCase() === user || t.name.toLowerCase() === user) && t.password === pass);
        if (teacher) {
          onLogin({ id: teacher.id, teacherId: teacher.id, name: teacher.name, username: teacher.username, role: 'teacher' });
          return;
        }

        setError('Invalid User ID or Password.');
      };

      return (
        <form onSubmit={handleSubmit}>
          {error && (
            <div style={{ background: 'rgba(239, 68, 68, 0.15)', border: '1px solid rgba(239, 68, 68, 0.4)', color: '#FCA5A5', padding: '0.75rem 1rem', borderRadius: 'var(--radius-md)', fontSize: '0.85rem', marginBottom: '1.25rem' }}>
              <i className="fas fa-exclamation-circle"></i> {error}
            </div>
          )}

          <div style={{ marginBottom: '1.25rem' }}>
            <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '0.4rem' }}>User ID / Username</label>
            <input type="text" required value={u} onChange={e => setU(e.target.value)} placeholder="owner or gaurav" style={{ width: '100%' }} />
          </div>

          <div style={{ marginBottom: '1.75rem' }}>
            <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '0.4rem' }}>Password</label>
            <input type="password" required value={p} onChange={e => setP(e.target.value)} placeholder="Password" style={{ width: '100%' }} />
          </div>

          <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.85rem' }}>
            <i className="fas fa-sign-in-alt"></i> Sign In to Studio
          </button>

          <div style={{ marginTop: '2rem', paddingTop: '1.5rem', borderTop: '1px solid var(--border-color)' }}>
            <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-faint)', textTransform: 'uppercase', marginBottom: '0.75rem', textAlign: 'center' }}>
              Instant Demo Access
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.65rem' }}>
              <button type="button" onClick={() => { setU('owner'); setP('admin123'); }} className="btn-secondary" style={{ fontSize: '0.8rem', padding: '0.55rem', justifyContent: 'center' }}>
                👑 Owner Account
              </button>
              <button type="button" onClick={() => { setU('gaurav'); setP('teacher123'); }} className="btn-secondary" style={{ fontSize: '0.8rem', padding: '0.55rem', justifyContent: 'center' }}>
                🎵 Gaurav (Teacher)
              </button>
            </div>
          </div>
        </form>
      );
    }

    // Toast Notification Component
    function Toast({ toast }) {
      return (
        <div className="toast-container">
          <div className="toast-box" style={{
            borderColor: toast.type === 'success' ? '#10B981' : toast.type === 'error' ? '#EF4444' : 'var(--border-light)'
          }}>
            <i className={`fas ${toast.type === 'success' ? 'fa-check-circle' : toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`}
               style={{ color: toast.type === 'success' ? '#34D399' : toast.type === 'error' ? '#F87171' : '#818CF8' }}
            ></i>
            <span>{toast.message}</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
