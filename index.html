              <TabButton
                active={activeTab === 'attendance'}
                onClick={() => setActiveTab('attendance')}
                icon="fa-calendar-check"
                label="Attendance Marking"
                badge={currentTeacherStudents.length}
              />
              <TabButton
                active={activeTab === 'students'}
                onClick={() => setActiveTab('students')}
                icon="fa-user-graduate"
                label="My Students Directory"
              />
              <TabButton
                active={activeTab === 'cycles'}
                onClick={() => setActiveTab('cycles')}
                icon="fa-sync-alt"
                label="Package Cycles & Backlog"
              />
              <TabButton
                active={activeTab === 'payments'}
                onClick={() => setActiveTab('payments')}
                icon="fa-credit-card"
                label="Payments & Fees"
              />
            </div>
          </header>

          <main style={{ maxWidth: '1440px', margin: '0 auto', padding: '1.75rem 1.5rem', width: '100%', flex: 1 }}>
            {(rescheduledClasses || []).filter(r => r.status !== 'completed').length > 0 && (
              <div style={{ background: 'rgba(99, 102, 241, 0.1)', border: '1px solid rgba(99, 102, 241, 0.3)', borderRadius: 'var(--radius-md)', padding: '0.75rem 1.25rem', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.75rem', flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', fontSize: '0.85rem', flexWrap: 'wrap' }}>
                  <i className="fas fa-calendar-alt" style={{ color: '#818CF8' }}></i>
                  <span>
                    <strong>Rescheduled Notice:</strong> {(rescheduledClasses || []).filter(r => r.status !== 'completed').map(r => `${r.studentName}: moved from ${formatDateMDY(r.originalDate)} to ${formatDateMDY(r.rescheduledDate)} (${r.rescheduledTime})`).join(' • ')}
                  </span>
                </div>
                <button
                  type="button"
                  onClick={() => {
                    if (confirm('Clear active reschedule notices?')) {
                      const cleared = (rescheduledClasses || []).map(r => ({ ...r, status: 'completed' }));
                      setRescheduledClasses(cleared);
                      syncWithCloud({ rescheduledClasses: cleared });
                    }
                  }}
                  style={{ background: 'none', color: 'var(--text-muted)', fontSize: '0.75rem', textDecoration: 'underline', border: 'none', cursor: 'pointer' }}
                >
                  Dismiss
                </button>
              </div>
            )}

            {activeTab === 'attendance' && (
              <AttendanceView
                students={currentTeacherStudents}
                selectedDate={selectedDate}
                onDateChange={setSelectedDate}
                attendanceMap={attendanceMap}
                onMarkAttendance={handleAttendanceClick}
                teacherName={currentTeacher.name}
                rescheduledClasses={rescheduledClasses}
                extraClasses={extraClasses}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onAddExtraClass={(std) => { setExtraClassTargetStudent(std); setIsExtraClassOpen(true); }}
                onViewProfile={(std) => setProfileViewingStudent(std)}
              />
            )}

            {activeTab === 'students' && (
              <StudentsDirectoryView
                students={currentTeacherStudents}
                onAddStudent={() => { setEditingStudent(null); setIsAddStudentOpen(true); }}
                onAddExtraClass={(std) => { setExtraClassTargetStudent(std); setIsExtraClassOpen(true); }}
                onEditStudent={(std) => { setEditingStudent(std); setIsAddStudentOpen(true); }}
                onDeleteStudent={(stdId) => {
                  const s = students.find(x => x.id === stdId);
                  if (confirm(`Remove student "${s?.name}"?`)) {
                    const updated = students.filter(x => x.id !== stdId);
                    setStudents(updated);
                    showToast('Student removed.', 'info');
                    syncWithCloud({ students: updated });
                  }
                }}
                onViewProfile={(std) => setProfileViewingStudent(std)}
              />
            )}

            {activeTab === 'cycles' && (
              <StudentFirstCyclesView
                students={currentTeacherStudents}
                onAddCycle={(std) => { setCycleTargetStudent(std); setIsAddCycleModalOpen(true); }}
                onAddClassDate={(std, cId) => { setCycleClassTarget({ student: std, cycleId: cId }); setIsAddCycleClassDateOpen(true); }}
                onEditCycle={(std, cyc) => { setEditingCycleTarget({ student: std, cycle: cyc }); setIsEditCycleModalOpen(true); }}
                onDeleteCycle={(stdId, cId) => handleDeleteCycle(stdId, cId)}
                onDeleteClassDate={(stdId, cId, dateIdx, dateToRemove) => {
                  if (confirm(`Delete class session on ${formatDateMDY(dateToRemove)} from Cycle #${cId}?`)) {
                    const updated = students.map(s => {
                      if (s.id === stdId && s.packageHistory) {
                        const pkgs = s.packageHistory.map(p => {
                          if (p.cycleId === cId && p.classDates) {
                            const newDates = [...p.classDates];
                            if (typeof dateIdx === 'number' && dateIdx >= 0 && dateIdx < newDates.length) {
                              newDates.splice(dateIdx, 1);
                            } else {
                              const removeIdx = newDates.indexOf(dateToRemove);
                              if (removeIdx !== -1) newDates.splice(removeIdx, 1);
                            }
                            return {
                              ...p,
                              classDates: newDates,
                              completedCount: newDates.length,
                              endDate: newDates.length > 0 ? newDates[newDates.length - 1] : p.startDate
                            };
                          }
                          return p;
                        });
                        const total = pkgs.reduce((a, b) => a + (b.classDates ? b.classDates.length : (b.completedCount || 0)), 0);
                        return { ...s, completedClassesCount: total, packageHistory: pkgs };
                      }
                      return s;
                    });
                    setStudents(updated);
                    showToast('Class session removed.', 'info');
                    syncWithCloud({ students: updated });
                  }
                }}
                onMarkPaidClick={(std, cycle) => {
                  setMarkPaidTarget({ student: std, cycle });
                  setIsMarkPaidModalOpen(true);
                }}
              />
            )}

            {activeTab === 'payments' && (
              <StudentPaymentsView
                students={currentTeacherStudents}
                payments={payments}
                onRecordPayment={(std) => {
                  setPaymentTargetStudent(std);
                  setEditingPayment(null);
                  setIsRecordPaymentOpen(true);
                }}
                onEditPayment={(pay) => {
                  setEditingPayment(pay);
                  setPaymentTargetStudent(students.find(s => s.id === pay.studentId));
                  setIsRecordPaymentOpen(true);
                }}
                onDeletePayment={(payId) => {
                  if (confirm('Delete this payment record?')) {
                    const updated = payments.filter(p => p.id !== payId);
                    setPayments(updated);
                    showToast('Payment record deleted.', 'info');
                    syncWithCloud({ payments: updated });
                  }
                }}
              />
            )}
          </main>

          {leaveModalData && (
            <LeaveReasonModal
              data={leaveModalData}
              onClose={() => setLeaveModalData(null)}
              onConfirm={(reason) => {
                executeAttendanceMarking(leaveModalData.studentId, 'leave', reason);
                setLeaveModalData(null);
              }}
            />
          )}

          {isRescheduleOpen && (
            <RescheduleModal
              students={currentTeacherStudents}
              onClose={() => setIsRescheduleOpen(false)}
              onSave={handleSaveReschedule}
            />
          )}

          {isExtraClassOpen && (
            <ExtraClassModal
              students={currentTeacherStudents}
              targetStudent={extraClassTargetStudent}
              onClose={() => { setIsExtraClassOpen(false); setExtraClassTargetStudent(null); }}
              onSave={handleSaveExtraClass}
            />
          )}

          {isMarkPaidModalOpen && markPaidTarget && (
            <MarkPaidModal
              target={markPaidTarget}
              onClose={() => { setIsMarkPaidModalOpen(false); setMarkPaidTarget(null); }}
              onConfirm={handleConfirmMarkAsPaid}
            />
          )}

          {isRecordPaymentOpen && (
            <PaymentModal
              students={currentTeacherStudents}
              targetStudent={paymentTargetStudent}
              editingPayment={editingPayment}
              onClose={() => { setIsRecordPaymentOpen(false); setEditingPayment(null); }}
              onSave={handleSavePaymentEdit}
            />
          )}

          {isAddCycleModalOpen && cycleTargetStudent && (
            <AddCycleModal
              student={cycleTargetStudent}
              onClose={() => { setIsAddCycleModalOpen(false); setCycleTargetStudent(null); }}
              onSave={handleSaveNewCycle}
            />
          )}

          {isEditCycleModalOpen && editingCycleTarget && (
            <EditCycleModal
              target={editingCycleTarget}
              onClose={() => { setIsEditCycleModalOpen(false); setEditingCycleTarget(null); }}
              onSave={handleSaveEditCycle}
            />
          )}

          {isAddCycleClassDateOpen && cycleClassTarget && (
            <AddClassDateModal
              student={cycleClassTarget.student}
              cycleId={cycleClassTarget.cycleId}
              onClose={() => { setIsAddCycleClassDateOpen(false); setCycleClassTarget(null); }}
              onSave={handleSaveClassDateToCycle}
            />
          )}

          {isAddStudentOpen && (
            <StudentModal
              student={editingStudent}
              teacher={currentTeacher}
              onClose={() => { setIsAddStudentOpen(false); setEditingStudent(null); }}
              onSave={handleSaveStudent}
            />
          )}

          {profileViewingStudent && (
            <StudentProfileModal
              student={profileViewingStudent}
              classes={classesHistory.filter(c => c.studentId === profileViewingStudent.id)}
              payments={payments.filter(p => p.studentId === profileViewingStudent.id)}
              onClose={() => setProfileViewingStudent(null)}
              onEdit={() => {
                setEditingStudent(profileViewingStudent);
                setProfileViewingStudent(null);
                setIsAddStudentOpen(true);
              }}
            />
          )}

          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // Attendance View Component (WITH CLASS TIMINGS & NEXT CLASS DATE)
    function AttendanceView({
      students,
      selectedDate,
      onDateChange,
      attendanceMap,
      onMarkAttendance,
      teacherName,
      rescheduledClasses = [],
      extraClasses = [],
      onAddStudent,
      onAddExtraClass,
      onViewProfile
    }) {
      const [filterMode, setFilterMode] = useState('scheduled'); // 'scheduled' | 'all'
      const dayRecords = attendanceMap[selectedDate] || {};

      // Compute day name, e.g. "Saturday", and check if today or past
      const selectedDayInfo = useMemo(() => {
        if (!selectedDate) return { dayName: '', isToday: false, isPast: false, formatted: '' };
        const d = parseLocalDate(selectedDate);
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const dayName = days[d.getDay()];

        const todayStr = getLocalDateString();
        const isToday = selectedDate === todayStr;
        const isPast = selectedDate < todayStr;
        const formatted = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

        return { dayName, isToday, isPast, formatted, todayStr };
      }, [selectedDate]);

      // Quick Date Stepping
      const handleStepDay = (step) => {
        const d = parseLocalDate(selectedDate);
        d.setDate(d.getDate() + step);
        onDateChange(getLocalDateString(d));
      };

      const handleGoToday = () => {
        onDateChange(getLocalDateString());
      };

      // Filter: Show students scheduled on selected day (excludes classes rescheduled AWAY from selectedDate)
      const scheduledStudents = useMemo(() => {
        const dayLower = (selectedDayInfo.dayName || '').toLowerCase().trim();
        return students.filter(s => {
          const sDay = (s.weeklyDay || '').toLowerCase().trim();
          const sDays = (s.classDays || '').toLowerCase();

          // Check if this student's class was rescheduled AWAY from selectedDate
          const isRescheduledAway = (rescheduledClasses || []).some(
            r => r.studentId === s.id && r.originalDate === selectedDate && r.status !== 'completed'
          );

          // Check if this student's class was rescheduled TO selectedDate
          const isRescheduledHere = (rescheduledClasses || []).some(
            r => r.studentId === s.id && r.rescheduledDate === selectedDate && r.status !== 'completed'
          );

          // Regular scheduled day UNLESS the session today was moved to another date!
          const isRegular = (sDay === dayLower || sDays.includes(dayLower)) && !isRescheduledAway;
          const isExtra = (extraClasses || []).some(e => e.studentId === s.id && e.date === selectedDate);
          const isAlreadyMarked = !isRescheduledAway && !!dayRecords[s.id];

          return isRegular || isRescheduledHere || isExtra || isAlreadyMarked;
        });
      }, [students, selectedDayInfo.dayName, selectedDate, rescheduledClasses, extraClasses, dayRecords]);

      const displayedStudents = filterMode === 'scheduled' ? scheduledStudents : students;

      const presentCount = students.filter(s => dayRecords[s.id]?.status === 'present').length;
      const absentCount = students.filter(s => dayRecords[s.id]?.status === 'absent').length;
      const leaveCount = students.filter(s => dayRecords[s.id]?.status === 'leave').length;

      return (
        <div>
          {/* Top Control Bar with Quick Date Stepping */}
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.25rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                  Daily Attendance • {teacherName}
                </h3>
                {selectedDayInfo.isToday ? (
                  <span className="badge" style={{ background: 'rgba(16, 185, 129, 0.2)', color: '#34D399' }}>
                    ● TODAY ({selectedDayInfo.dayName})
                  </span>
                ) : (
                  <span className="badge" style={{ background: 'rgba(245, 158, 11, 0.2)', color: '#FBBF24' }}>
                    <i className="fas fa-history"></i> {selectedDayInfo.dayName} ({selectedDayInfo.formatted})
                  </span>
                )}
              </div>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginTop: '0.2rem' }}>
                45 Mins IST • Shows Class Timings & Next Class Date
              </p>
            </div>

            {/* Date Selector with Previous Day, Date Picker, Next Day & Jump to Today */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
              <button
                type="button"
                onClick={() => handleStepDay(-1)}
                className="btn-secondary"
                style={{ padding: '0.45rem 0.75rem', fontSize: '0.85rem' }}
                title="Go back to previous date to mark missed attendance"
              >
                <i className="fas fa-chevron-left"></i> Previous Day
              </button>

              <div style={{
                display: 'flex',
                alignItems: 'center',
                gap: '0.5rem',
                background: 'var(--bg-subtle)',
                padding: '0.35rem 0.75rem',
                borderRadius: 'var(--radius-md)',
                border: '1px solid var(--border-color)'
              }}>
                <i className="fas fa-calendar-alt" style={{ color: 'var(--primary)' }}></i>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={e => onDateChange(e.target.value)}
                  style={{ background: 'none', border: 'none', color: 'white', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer' }}
                />
              </div>

              <button
                type="button"
                onClick={() => handleStepDay(1)}
                className="btn-secondary"
                style={{ padding: '0.45rem 0.75rem', fontSize: '0.85rem' }}
                title="Next Day"
              >
                Next Day <i className="fas fa-chevron-right"></i>
              </button>

              {!selectedDayInfo.isToday && (
                <button
                  type="button"
                  onClick={handleGoToday}
                  className="btn-secondary"
                  style={{ padding: '0.45rem 0.75rem', fontSize: '0.85rem', color: '#38BDF8', borderColor: 'rgba(56, 189, 248, 0.4)' }}
                  title="Jump back to today's date"
                >
                  <i className="fas fa-calendar-day"></i> Jump to Today
                </button>
              )}

              <button
                onClick={onAddStudent}
                className="btn-primary"
                style={{ padding: '0.55rem 1rem', fontSize: '0.85rem' }}
              >
                <i className="fas fa-plus"></i> Add Student
              </button>
            </div>
          </div>

          {/* MISSED ATTENDANCE BACK-ENTRY NOTICE (Visible when navigating back to past dates) */}
          {selectedDayInfo.isPast && (
            <div style={{
              background: 'rgba(245, 158, 11, 0.1)',
              border: '1px solid rgba(245, 158, 11, 0.35)',
              borderRadius: 'var(--radius-md)',
              padding: '0.75rem 1.25rem',
              marginBottom: '1.25rem',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1rem',
              flexWrap: 'wrap'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                <i className="fas fa-history" style={{ color: '#FBBF24', fontSize: '1.15rem' }}></i>
                <span style={{ fontSize: '0.88rem' }}>
                  <strong>Past Date Selected:</strong> {selectedDayInfo.formatted} ({selectedDayInfo.dayName}). You can mark missed attendance for this past day below.
                </span>
              </div>
              <button
                onClick={handleGoToday}
                className="btn-secondary"
                style={{ fontSize: '0.75rem', padding: '0.35rem 0.75rem' }}
              >
                Back to Today ({selectedDayInfo.todayStr})
              </button>
            </div>
          )}

          {/* Stat Cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem', marginBottom: '1.25rem' }}>
            <StatCard label="Total Students" value={students.length} icon="fa-users" color="#6366F1" />
            <StatCard label="Present (Counted)" value={presentCount} icon="fa-check-circle" color="#10B981" />
            <StatCard label="Absent (Counted)" value={absentCount} icon="fa-times-circle" color="#EF4444" />
            <StatCard label="Leave (Not Deducted)" value={leaveCount} icon="fa-pause-circle" color="#F59E0B" />
          </div>

          {/* Attendance Student List Table */}
          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', overflow: 'hidden' }}>
            
            {/* Filter Toggle: Scheduled Today vs View All */}
            <div style={{
              padding: '0.85rem 1.25rem',
              borderBottom: '1px solid var(--border-color)',
              background: 'var(--bg-subtle)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              flexWrap: 'wrap',
              gap: '0.75rem'
            }}>
              <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', flexWrap: 'wrap' }}>
                <button
                  type="button"
                  onClick={() => setFilterMode('scheduled')}
                  style={{
                    padding: '0.45rem 0.85rem',
                    borderRadius: 'var(--radius-sm)',
                    fontSize: '0.82rem',
                    fontWeight: 700,
                    background: filterMode === 'scheduled' ? 'var(--primary)' : 'var(--bg-surface)',
                    color: filterMode === 'scheduled' ? 'white' : 'var(--text-muted)',
                    border: '1px solid ' + (filterMode === 'scheduled' ? 'var(--primary)' : 'var(--border-color)'),
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.4rem',
                    cursor: 'pointer'
                  }}
                >
                  <i className="fas fa-calendar-day"></i> {selectedDayInfo.dayName}'s Scheduled ({scheduledStudents.length})
                </button>
                <button
                  type="button"
                  onClick={() => setFilterMode('all')}
                  style={{
                    padding: '0.45rem 0.85rem',
                    borderRadius: 'var(--radius-sm)',
                    fontSize: '0.82rem',
                    fontWeight: 700,
                    background: filterMode === 'all' ? 'var(--primary)' : 'var(--bg-surface)',
                    color: filterMode === 'all' ? 'white' : 'var(--text-muted)',
                    border: '1px solid ' + (filterMode === 'all' ? 'var(--primary)' : 'var(--border-color)'),
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.4rem',
                    cursor: 'pointer'
                  }}
                >
                  <i className="fas fa-users"></i> View All Students ({students.length})
                </button>
              </div>

              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                Showing <strong>{displayedStudents.length}</strong> of {students.length} students
              </div>
            </div>

            {/* Column Headers */}
            <div style={{
              padding: '0.75rem 1.5rem',
              borderBottom: '1px solid var(--border-color)',
              fontWeight: 700,
              fontSize: '0.82rem',
              color: 'var(--text-muted)',
              display: 'flex',
              justifyContent: 'space-between',
              background: 'rgba(15, 23, 42, 0.4)'
            }}>
              <span>Student Schedule & Timings</span>
              <span>Mark Attendance (45 Mins IST)</span>
            </div>

            {/* List Body */}
            <div>
              {displayedStudents.length === 0 ? (
                <div style={{ padding: '3rem 1.5rem', textAlign: 'center', color: 'var(--text-muted)' }}>
                  <div style={{ width: '48px', height: '48px', borderRadius: '12px', background: 'var(--bg-subtle)', color: '#FBBF24', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1rem', fontSize: '1.25rem' }}>
                    <i className="fas fa-calendar-times"></i>
                  </div>
                  <h4 style={{ fontWeight: 800, color: 'white', marginBottom: '0.35rem' }}>
                    No Students Scheduled on {selectedDayInfo.dayName}
                  </h4>
                  <p style={{ fontSize: '0.85rem', marginBottom: '1.25rem', color: 'var(--text-muted)' }}>
                    None of {teacherName}'s regular students have a class on {selectedDayInfo.dayName} ({selectedDayInfo.formatted}).
                  </p>
                  <button
                    onClick={() => setFilterMode('all')}
                    className="btn-secondary"
                    style={{ fontSize: '0.85rem', padding: '0.5rem 1rem' }}
                  >
                    <i className="fas fa-users"></i> View All {students.length} Students
                  </button>
                </div>
              ) : (
                displayedStudents.map(student => {
                  const record = dayRecords[student.id];
                  const status = record?.status;

                  // Compute next class date display
                  const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || student.classDays || 'Thursday');
                  const weeklyDayText = student.weeklyDay ? `Every ${student.weeklyDay}` : (student.classDays || '1 class / week');
                  const timingsText = student.classTimings || '4:00 PM IST';
                  const isScheduledOnThisDay = (student.weeklyDay || '').toLowerCase().trim() === (selectedDayInfo.dayName || '').toLowerCase().trim();

                  return (
                    <div
                      key={student.id}
                      style={{
                        padding: '1.25rem 1.5rem',
                        borderBottom: '1px solid var(--border-color)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        gap: '1rem',
                        flexWrap: 'wrap',
                        background: status === 'present' ? 'rgba(16, 185, 129, 0.04)' : status === 'absent' ? 'rgba(239, 68, 68, 0.04)' : status === 'leave' ? 'rgba(245, 158, 11, 0.04)' : 'transparent'
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', minWidth: '320px' }}>
                        <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '1.15rem', color: 'white' }}>
                          {student.name.slice(0, 2).toUpperCase()}
                        </div>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                            <span onClick={() => onViewProfile(student)} style={{ fontWeight: 800, fontSize: '1.1rem', cursor: 'pointer', textDecoration: 'underline' }}>
                              {student.name}
                            </span>
                            <span className={`badge badge-${student.feeStatus || 'paid'}`}>
                              {(student.feeStatus || 'paid').toUpperCase()}
                            </span>
                            {(() => {
                              const reschedAway = (rescheduledClasses || []).find(
                                r => r.studentId === student.id && r.originalDate === selectedDate && r.status !== 'completed'
                              );
                              if (reschedAway) {
                                return (
                                  <span className="badge" style={{ background: 'rgba(239, 68, 68, 0.15)', color: '#F87171', border: '1px solid rgba(239, 68, 68, 0.35)' }}>
                                    <i className="fas fa-calendar-times"></i> Rescheduled to {formatDateMDY(reschedAway.rescheduledDate)} at {reschedAway.rescheduledTime}
                                  </span>
                                );
                              }
                              const reschedHere = (rescheduledClasses || []).find(
                                r => r.studentId === student.id && r.rescheduledDate === selectedDate && r.status !== 'completed'
                              );
                              if (reschedHere) {
                                return (
                                  <span className="badge" style={{ background: 'rgba(99, 102, 241, 0.2)', color: '#818CF8', border: '1px solid rgba(99, 102, 241, 0.4)' }}>
                                    <i className="fas fa-calendar-check"></i> Rescheduled Session: Today at {reschedHere.rescheduledTime}
                                  </span>
                                );
                              }
                              const isExtraOnThisDay = (extraClasses || []).some(e => e.studentId === student.id && e.date === selectedDate) || record?.isExtraClass;
                              if (isExtraOnThisDay) {
                                return (
                                  <span className="badge" style={{ background: 'rgba(52, 211, 153, 0.2)', color: '#34D399', border: '1px solid rgba(52, 211, 153, 0.4)' }}>
                                    <i className="fas fa-star"></i> Extra Class
                                  </span>
                                );
                              }
                              if (isScheduledOnThisDay) {
                                return (
                                  <span className="badge" style={{ background: 'rgba(99, 102, 241, 0.2)', color: '#818CF8' }}>
                                    <i className="fas fa-calendar-check"></i> Today's Regular
                                  </span>
                                );
                              }
                              return (
                                <span className="badge" style={{ background: 'var(--bg-subtle)', color: 'var(--text-muted)' }}>
                                  Regular: {student.weeklyDay || 'Thursday'}
                                </span>
                              );
                            })()}
                            <span className="badge badge-next" title="Next scheduled class date">
                              <i className="fas fa-calendar-alt"></i> Next: {formatReadableDate(nextDate)}
                            </span>
                          </div>

                          {/* CLASS TIMINGS & RECURRING DAY HIGHLIGHT */}
                          <div style={{ fontSize: '0.85rem', color: '#CBD5E1', marginTop: '0.35rem', display: 'flex', gap: '0.85rem', flexWrap: 'wrap', alignItems: 'center' }}>
                            <span style={{ color: '#FBBF24', fontWeight: 700 }}>
                              <i className="fas fa-clock"></i> {weeklyDayText} at {timingsText}
                            </span>
                            <span>•</span>
                            <span style={{ color: 'var(--text-muted)' }}>
                              <i className="fas fa-music"></i> {student.musicClass || 'Lessons'}
                            </span>
                            <span>•</span>
                            <span style={{ color: '#34D399', fontWeight: 600 }}>
                              {(() => {
                              const cCycle = student.packageHistory && student.packageHistory.length > 0 ? student.packageHistory[student.packageHistory.length - 1] : null;
                              const cCount = cCycle ? (cCycle.classDates?.length || cCycle.completedCount || 0) : (student.completedClassesCount || 0);
                              const cLimit = cCycle ? (cCycle.limit || student.packageLimit || 4) : (student.packageLimit || 4);
                              return `${cCount}/${cLimit} classes`;
                            })()}
                            </span>
                          </div>

                          {record?.reason && (
                            <div style={{ fontSize: '0.75rem', color: '#FBBF24', marginTop: '0.25rem' }}>
                              <i className="fas fa-info-circle"></i> Leave Reason: {record.reason}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Attendance Buttons: Present, Absent, Leave (or Rescheduled Away notice) */}
                      {(() => {
                        const reschedAway = (rescheduledClasses || []).find(
                          r => r.studentId === student.id && r.originalDate === selectedDate && r.status !== 'completed'
                        );
                        if (reschedAway) {
                          return (
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                              <span style={{ fontSize: '0.85rem', color: '#F87171', fontWeight: 700 }}>
                                <i className="fas fa-arrow-right"></i> Moved to {formatDateMDY(reschedAway.rescheduledDate)} ({reschedAway.rescheduledTime})
                              </span>
                              <button
                                type="button"
                                onClick={() => onDateChange(reschedAway.rescheduledDate)}
                                className="btn-secondary"
                                style={{ fontSize: '0.78rem', padding: '0.4rem 0.75rem', color: '#818CF8' }}
                              >
                                Go to {formatDateMDY(reschedAway.rescheduledDate)}
                              </button>
                            </div>
                          );
                        }
                        return (
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                        <button
                          type="button"
                          onClick={() => onMarkAttendance(student.id, 'present')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.15)',
                            color: status === 'present' ? 'white' : '#34D399',
                            border: `1px solid ${status === 'present' ? '#10B981' : 'rgba(16, 185, 129, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-check"></i> Present (Counted)
                        </button>

                        <button
                          type="button"
                          onClick={() => onMarkAttendance(student.id, 'absent')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.15)',
                            color: status === 'absent' ? 'white' : '#F87171',
                            border: `1px solid ${status === 'absent' ? '#EF4444' : 'rgba(239, 68, 68, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-times"></i> Absent (Counted)
                        </button>

                        <button
                          type="button"
                          onClick={() => onMarkAttendance(student.id, 'leave')}
                          style={{
                            padding: '0.55rem 1.1rem',
                            borderRadius: 'var(--radius-md)',
                            fontWeight: 700,
                            fontSize: '0.85rem',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            background: status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.15)',
                            color: status === 'leave' ? 'white' : '#FBBF24',
                            border: `1px solid ${status === 'leave' ? '#F59E0B' : 'rgba(245, 158, 11, 0.4)'}`
                          }}
                        >
                          <i className="fas fa-pause"></i> Leave (No Deduction)
                        </button>
                      </div>
                        );
                      })()}
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    function StudentsDirectoryView({ students, onAddStudent, onAddExtraClass, onEditStudent, onDeleteStudent, onViewProfile }) {
      const [q, setQ] = useState('');
      const filtered = students.filter(s => s.name.toLowerCase().includes(q.toLowerCase()));

      return (
        <div>
          <div style={{
            background: 'var(--bg-surface)',
            border: '1px solid var(--border-color)',
            borderRadius: 'var(--radius-lg)',
            padding: '1.25rem 1.5rem',
            marginBottom: '1.5rem',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '1rem',
            flexWrap: 'wrap'
          }}>
            <div style={{ minWidth: '260px', flex: 1 }}>
              <input type="text" placeholder="Search students..." value={q} onChange={e => setQ(e.target.value)} style={{ width: '100%' }} />
            </div>
            <button onClick={onAddStudent} className="btn-primary">
              <i className="fas fa-user-plus"></i> Add New Student
            </button>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '1.25rem' }}>
            {filtered.map(student => {
              const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || student.classDays || 'Thursday');
              const weeklyDayText = student.weeklyDay ? `Every ${student.weeklyDay}` : (student.classDays || '1 class / week');
              const timingsText = student.classTimings || '4:00 PM IST';
              const completedCount = getStudentCompletedClassesCount(student);

              const currentCycle = student.packageHistory && student.packageHistory.length > 0
                ? student.packageHistory[student.packageHistory.length - 1]
                : null;
              const currentCycleCompleted = currentCycle ? (currentCycle.classDates?.length || currentCycle.completedCount || 0) : completedCount;
              const currentCycleLimit = currentCycle ? (currentCycle.limit || student.packageLimit || 4) : (student.packageLimit || 4);

              return (
                <div key={student.id} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', boxShadow: 'var(--shadow-sm)' }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.85rem' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                        <div style={{ width: '46px', height: '46px', borderRadius: '12px', background: student.avatarColor || '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 800 }}>
                          {student.name.slice(0, 2).toUpperCase()}
                        </div>
                        <div>
                          <h4 onClick={() => onViewProfile(student)} style={{ fontSize: '1.15rem', fontWeight: 800, cursor: 'pointer', textDecoration: 'underline' }}>{student.name}</h4>
                          <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{student.musicClass || 'Lessons'}</div>
                        </div>
                      </div>
                      <span className={`badge badge-${student.feeStatus || 'paid'}`}>{(student.feeStatus || 'paid').toUpperCase()}</span>
                    </div>

                    {/* PROMINENT NEXT CLASS DATE & SCHEDULE BANNER ON STUDENT CARD */}
                    <div style={{
                      background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(168, 85, 247, 0.1))',
                      border: '1.5px solid rgba(129, 140, 248, 0.45)',
                      borderRadius: '10px',
                      padding: '0.75rem 1rem',
                      marginBottom: '0.85rem'
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.35rem' }}>
                        <span style={{ color: '#A5B4FC', fontWeight: 800, fontSize: '0.85rem' }}>
                          <i className="fas fa-calendar-alt" style={{ color: '#818CF8' }}></i> Next Class Date:
                        </span>
                        <span style={{ color: '#38BDF8', fontWeight: 900, fontSize: '1rem', background: 'rgba(15, 23, 42, 0.65)', padding: '0.2rem 0.65rem', borderRadius: '6px', border: '1px solid rgba(56, 189, 248, 0.3)' }}>
                          📅 {formatReadableDate(nextDate)}
                        </span>
                      </div>
                      <div style={{ color: '#FBBF24', fontWeight: 700, fontSize: '0.85rem', marginTop: '0.35rem', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                        <i className="fas fa-clock"></i> <span>Timings: {weeklyDayText} at {timingsText}</span>
                      </div>
                    </div>

                    <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', lineHeight: 1.65 }}>
                      {(student.dob || student.age) && (
                        <div>
                          <strong>DOB:</strong> {formatDateMDY(student.dob)} {student.age ? `(Age: ${student.age} yrs)` : ''}
                        </div>
                      )}
                      <div><strong>Package:</strong> {formatPackageDisplay(student.packageType, student.packageLimit, student.packageAmount)}</div>
                      <div>
                        <strong>Completed Classes:</strong>{' '}
                        <span style={{ color: '#34D399', fontWeight: 800, fontSize: '0.95rem' }}>
                          {currentCycleCompleted}/{currentCycleLimit} classes
                        </span>
                      </div>
                      <div><strong>Last Class:</strong> {formatDateMDY(student.lastClassDate)}</div>
                      <div><strong>Last Payment:</strong> {formatDateMDY(student.lastPaymentDate)}</div>
                      <div><strong>Phone:</strong> {student.phone || 'N/A'}</div>
                    </div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '1rem', marginTop: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
                    <div style={{ display: 'flex', gap: '0.4rem' }}>
                      <button onClick={() => onViewProfile(student)} className="btn-secondary" style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem' }}>
                        Profile
                      </button>
                      <button onClick={() => onAddExtraClass && onAddExtraClass(student)} className="btn-secondary" style={{ padding: '0.4rem 0.75rem', fontSize: '0.8rem', color: '#34D399', borderColor: 'rgba(52, 211, 153, 0.4)' }} title="Add an extra class session for this student">
                        <i className="fas fa-plus"></i> Extra Class
                      </button>
                    </div>
                    <div style={{ display: 'flex', gap: '0.4rem' }}>
                      <button onClick={() => onEditStudent(student)} className="btn-secondary" style={{ padding: '0.4rem 0.75rem', fontSize: '0.8rem' }}>
                        Edit Details
                      </button>
                      <button onClick={() => onDeleteStudent(student.id)} className="btn-danger" style={{ padding: '0.4rem 0.75rem', fontSize: '0.8rem' }}>
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Student Modal (Add/Edit) with Weekly Day, Timings, Next Class Date, and Full Custom Package (Classes & Rupees)
    function StudentModal({ student, teacher, onClose, onSave }) {
      const determineInitialPlan = () => {
        if (!student) return { plan: '4', classes: 4, amount: 6000 };
        const pType = student.packageType || '';
        const pLimit = Number(student.packageLimit) || (pType.includes('12') ? 12 : 4);
        const pAmount = Number(student.packageAmount) || (pLimit === 12 ? 15000 : 6000);

        if (pLimit === 4 && pAmount === 6000 && !pType.toLowerCase().includes('custom')) {
          return { plan: '4', classes: 4, amount: 6000 };
        }
        if (pLimit === 12 && pAmount === 15000 && !pType.toLowerCase().includes('custom')) {
          return { plan: '12', classes: 12, amount: 15000 };
        }
        return { plan: 'custom', classes: pLimit, amount: pAmount };
      };

      const initialPlanInfo = determineInitialPlan();
      const [selectedPlan, setSelectedPlan] = useState(initialPlanInfo.plan);
      const [customClasses, setCustomClasses] = useState(initialPlanInfo.classes);
      const [customAmount, setCustomAmount] = useState(initialPlanInfo.amount);

      const [formData, setFormData] = useState({
        name: student?.name || '',
        teacherId: student?.teacherId || teacher?.id || 'gaurav',
        phone: student?.phone || '',
        email: student?.email || '',
        dob: student?.dob || '',
        age: student?.age !== undefined && student?.age !== null ? String(student.age) : '',
        joiningDate: student?.joiningDate || getLocalDateString(),
        musicClass: student?.musicClass || 'Music Production',
        packageType: initialPlanInfo.plan === 'custom'
          ? `Custom Package (${initialPlanInfo.classes} Classes - ₹${Number(initialPlanInfo.amount).toLocaleString('en-IN')})`
          : (initialPlanInfo.plan === '12' ? '12 Classes Package (₹15,000)' : '4 Classes Package (₹6,000)'),
        packageAmount: initialPlanInfo.amount,
        packageLimit: initialPlanInfo.classes,
        weeklyDay: student?.weeklyDay || 'Thursday',
        classTimings: student?.classTimings || '04:00 PM IST',
        nextClassDate: student?.nextClassDate || calculateNextClassDate(student?.weeklyDay || 'Thursday'),
        completedClassesCount: student?.completedClassesCount || 0,
        lastClassDate: student?.lastClassDate || '',
        lastPaymentDate: student?.lastPaymentDate || '',
        feeStatus: student?.feeStatus || 'paid'
      });

      const handleWeeklyDayChange = (day) => {
        const autoNext = calculateNextClassDate(day);
        setFormData(prev => ({
          ...prev,
          weeklyDay: day,
          nextClassDate: autoNext,
          classDays: `Every ${day}`
        }));
      };

      const handleDobChange = (dobVal) => {
        let calculatedAge = formData.age;
        if (dobVal) {
          const parts = dobVal.split('-');
          if (parts.length === 3) {
            const birthDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
              age--;
            }
            if (!isNaN(age) && age >= 0) calculatedAge = String(age);
          }
        }
        setFormData(prev => ({ ...prev, dob: dobVal, age: calculatedAge }));
      };

      const handlePlanChange = (plan) => {
        setSelectedPlan(plan);
        if (plan === '4') {
          setFormData(prev => ({
            ...prev,
            packageType: '4 Classes Package (₹6,000)',
            packageLimit: 4,
            packageAmount: 6000
          }));
        } else if (plan === '12') {
          setFormData(prev => ({
            ...prev,
            packageType: '12 Classes Package (₹15,000)',
            packageLimit: 12,
            packageAmount: 15000
          }));
        } else {
          const cLimit = Number(customClasses) || 8;
          const cAmt = Number(customAmount) || 10000;
          setFormData(prev => ({
            ...prev,
            packageType: `Custom Package (${cLimit} Classes - ₹${cAmt.toLocaleString('en-IN')})`,
            packageLimit: cLimit,
            packageAmount: cAmt
          }));
        }
      };

      const handleCustomClassesChange = (val) => {
        const num = val === '' ? '' : Number(val);
        setCustomClasses(num);
        if (num > 0) {
          setFormData(prev => ({
            ...prev,
            packageLimit: num,
            packageType: `Custom Package (${num} Classes - ₹${Number(customAmount || 0).toLocaleString('en-IN')})`
          }));
        }
      };

      const handleCustomAmountChange = (val) => {
        const num = val === '' ? '' : Number(val);
        setCustomAmount(num);
        if (num >= 0) {
          setFormData(prev => ({
            ...prev,
            packageAmount: num,
            packageType: `Custom Package (${Number(customClasses || 0)} Classes - ₹${Number(num).toLocaleString('en-IN')})`
          }));
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '640px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>{student ? `Edit ${student.name}` : 'Add New Student'}</h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              let finalType = formData.packageType;
              let finalLimit = Number(formData.packageLimit) || 4;
              let finalAmount = Number(formData.packageAmount) || 6000;
              if (selectedPlan === 'custom') {
                finalLimit = Number(customClasses) || 1;
                finalAmount = Number(customAmount) || 0;
                finalType = `Custom Package (${finalLimit} Classes - ₹${finalAmount.toLocaleString('en-IN')})`;
              }
              onSave({
                ...formData,
                packageType: finalType,
                packageLimit: finalLimit,
                packageAmount: finalAmount,
                teacherName: teacher?.name || 'Gaurav',
                classDays: `Every ${formData.weeklyDay}`
              });
            }}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Student Name *</label>
                  <input type="text" required placeholder="Enter student's full name" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                </div>

                {/* STUDENT JOINING / START DATE */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-calendar-plus"></i> Joining / Start Date *
                  </label>
                  <input
                    type="date"
                    required
                    value={formData.joiningDate}
                    onChange={e => setFormData({ ...formData, joiningDate: e.target.value })}
                  />
                  <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    Current: <strong>{formatDateMDY(formData.joiningDate)}</strong> (Cycle #1 begins on this date)
                  </span>
                </div>

                <div className="form-group">
                  <label className="form-label">Lesson Option *</label>
                  <select value={formData.musicClass} onChange={e => setFormData({ ...formData, musicClass: e.target.value })}>
                    <option value="Music Production">Music Production (45 mins)</option>
                    <option value="Vocal Lessons">Vocal Lessons (45 mins)</option>
                    <option value="Piano Lessons">Piano Lessons (45 mins)</option>
                    <option value="Audio Engineering">Audio Engineering (45 mins)</option>
                    <option value="Guitar Lessons">Guitar Lessons (45 mins)</option>
                  </select>
                </div>

                {/* DATE OF BIRTH (DOB) & AGE */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#38BDF8', fontWeight: 700 }}>
                    <i className="fas fa-birthday-cake"></i> Date of Birth (DOB)
                  </label>
                  <input
                    type="date"
                    value={formData.dob}
                    onChange={e => handleDobChange(e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label" style={{ color: '#38BDF8', fontWeight: 700 }}>
                    <i className="fas fa-user"></i> Age (Years)
                  </label>
                  <input
                    type="number"
                    min="1"
                    max="120"
                    placeholder="Auto-calculated from DOB or enter age"
                    value={formData.age}
                    onChange={e => setFormData({ ...formData, age: e.target.value })}
                  />
                </div>

                {/* 1 CLASS PER WEEK SCHEDULE (WEEKLY DAY) */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>
                    <i className="fas fa-calendar-day"></i> Weekly Class Day (1 class / week) *
                  </label>
                  <select value={formData.weeklyDay} onChange={e => handleWeeklyDayChange(e.target.value)}>
                    <option value="Monday">Every Monday</option>
                    <option value="Tuesday">Every Tuesday</option>
                    <option value="Wednesday">Every Wednesday</option>
                    <option value="Thursday">Every Thursday</option>
                    <option value="Friday">Every Friday</option>
                    <option value="Saturday">Every Saturday</option>
                    <option value="Sunday">Every Sunday</option>
                  </select>
                </div>

                {/* CLASS TIMINGS */}
                <div className="form-group">
                  <label className="form-label" style={{ color: '#FBBF24', fontWeight: 700 }}>
                    <i className="fas fa-clock"></i> Class Timings (e.g. 4pm, 12pm IST) *
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.classTimings}
                    onChange={e => setFormData({ ...formData, classTimings: e.target.value })}
                    placeholder="e.g. 04:00 PM IST or 12:00 PM IST"
                  />
                </div>

                {/* NEXT CLASS DATE */}
                <div className="form-group" style={{ gridColumn: '1 / -1' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <label className="form-label" style={{ color: '#A5B4FC', fontWeight: 700 }}>
                      <i className="fas fa-calendar-check"></i> Next Class Date *
                    </label>
                    <button
                      type="button"
                      onClick={() => setFormData(prev => ({ ...prev, nextClassDate: calculateNextClassDate(prev.weeklyDay) }))}
                      style={{ background: 'none', color: '#818CF8', fontSize: '0.75rem', textDecoration: 'underline', cursor: 'pointer' }}
                    >
                      ⚡ Auto-Calculate for upcoming {formData.weeklyDay}
                    </button>
                  </div>
                  <input
                    type="date"
                    required
                    value={formData.nextClassDate}
                    onChange={e => setFormData({ ...formData, nextClassDate: e.target.value })}
                  />
                </div>

                {/* TUITION PACKAGE SELECTOR */}
                <div className="form-group" style={{ gridColumn: selectedPlan === 'custom' ? '1 / -1' : 'auto' }}>
                  <label className="form-label" style={{ color: '#818CF8', fontWeight: 700 }}>
                    <i className="fas fa-cubes"></i> Tuition Package Plan *
                  </label>
                  <select value={selectedPlan} onChange={e => handlePlanChange(e.target.value)}>
                    <option value="4">Standard 4 Classes Package (₹6,000)</option>
                    <option value="12">Standard 12 Classes Package (₹15,000)</option>
                    <option value="custom">✨ Custom Package (Enter Classes & Rupees)</option>
                  </select>
                </div>

                {/* CUSTOM PACKAGE DETAILS: HOW MANY CLASSES & HOW MANY RUPEES */}
                {selectedPlan === 'custom' && (
                  <div style={{
                    gridColumn: '1 / -1',
                    background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.08))',
                    border: '1.5px solid rgba(129, 140, 248, 0.4)',
                    borderRadius: 'var(--radius-md)',
                    padding: '1.25rem',
                    marginBottom: '0.5rem',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.15)'
                  }}>

    // Passwords Modal
    function PasswordModal({ prompt, onClose, onSuccess }) {
      const [pwd, setPwd] = useState('');
      const [show, setShow] = useState(false);
      const [err, setErr] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setErr('');
        if (prompt.type === 'owner') {
          if (pwd.trim() === 'Owner123') onSuccess();
          else setErr('Incorrect Owner Password.');
        } else if (prompt.type === 'teacher') {
          const expected = prompt.targetTeacher.password || (prompt.targetTeacher.id === 'gaurav' ? 'Gaurav2305' : 'teacher123');
          if (pwd.trim() === expected) onSuccess();
          else setErr(`Incorrect password for ${prompt.targetTeacher.name}.`);
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" style={{ maxWidth: '420px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.15rem', fontWeight: 800 }}>
                {prompt.type === 'owner' ? 'Studio Admin Authentication' : `Enter Password for ${prompt.targetTeacher.name}`}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)' }}><i className="fas fa-times"></i></button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="modal-body">
                {err && <div style={{ background: 'rgba(239, 68, 68, 0.15)', color: '#FCA5A5', padding: '0.65rem', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.85rem' }}>{err}</div>}
                <div className="form-group">
                  <label className="form-label">{prompt.type === 'owner' ? 'Owner Password' : `Password for ${prompt.targetTeacher.name}`}</label>
                  <div style={{ position: 'relative' }}>
                    <input type={show ? 'text' : 'password'} autoFocus required value={pwd} onChange={e => setPwd(e.target.value)} style={{ width: '100%', paddingRight: '2.5rem' }} />
                    <button type="button" onClick={() => setShow(!show)} style={{ position: 'absolute', right: '0.75rem', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', background: 'none' }}>
                      <i className={`fas ${show ? 'fa-eye-slash' : 'fa-eye'}`}></i>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">Unlock</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

      if (selectedStudent) {
        const student = students.find(s => s.id === selectedStudent.id) || selectedStudent;
        // Show latest cycle at the top (e.g. Cycle #2 above Cycle #1)
        const cycles = [...(student.packageHistory || [])].sort((a, b) => (Number(b.cycleId) || 0) - (Number(a.cycleId) || 0));
        const nextDate = student.nextClassDate || calculateNextClassDate(student.weeklyDay || 'Thursday');

        return (
