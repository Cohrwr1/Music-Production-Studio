    // Add / Edit Student Modal (Owner has complete rights to edit everything)
    function StudentModal({ student, teachers, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: student?.name || '',
        teacherId: student?.teacherId || 'gaurav',
        phone: student?.phone || '',
        email: student?.email || '',
        dob: student?.dob || '',
        joiningDate: student?.joiningDate || new Date().toISOString().split('T')[0],
        musicClass: student?.musicClass || 'Vocal Lessons',
        packageType: student?.packageType || '4 Classes Package (₹6,000)',
        packageAmount: student?.packageAmount || 6000,
        packageLimit: student?.packageLimit || 4,
        classTimings: student?.classTimings || '05:00 PM - 06:00 PM IST',
        classDays: student?.classDays || 'Tuesday & Friday',
        completedClassesCount: student?.completedClassesCount || 0,
        lastClassDate: student?.lastClassDate || '',
        lastPaymentDate: student?.lastPaymentDate || '',
        feeStatus: student?.feeStatus || 'paid',
        notes: student?.notes || ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        const selectedTeacher = teachers.find(t => t.id === formData.teacherId);
        onSave({
          ...formData,
          teacherName: selectedTeacher ? selectedTeacher.name : 'Gaurav'
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {student ? `Edit Student: ${student.name}` : 'Add New Student'}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Full Name *</label>
                  <input
                    type="text"
                    required
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Assigned Teacher *</label>
                  <select
                    value={formData.teacherId}
                    onChange={(e) => setFormData({ ...formData, teacherId: e.target.value })}
                  >
                    {teachers.map(t => (
                      <option key={t.id} value={t.id}>{t.name} ({t.username})</option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Phone Number</label>
                  <input
                    type="text"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    placeholder="+91 98..."
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Email Address</label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Date of Birth (DOB)</label>
                  <input
                    type="date"
                    value={formData.dob}
                    onChange={(e) => setFormData({ ...formData, dob: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Joining Date</label>
                  <input
                    type="date"
                    value={formData.joiningDate}
                    onChange={(e) => setFormData({ ...formData, joiningDate: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Lesson Option *</label>
                  <select
                    value={formData.musicClass}
                    onChange={(e) => setFormData({ ...formData, musicClass: e.target.value })}
                  >
                    <option value="Music Production">Music Production & DAW</option>
                    <option value="Vocal Lessons">Vocal Lessons</option>
                    <option value="Piano Lessons">Piano Lessons</option>
                    <option value="Audio Engineering">Audio Engineering & Mixing</option>
                    <option value="Guitar Lessons">Guitar Lessons</option>
                    <option value="DJing & Performance">DJing & Electronic Live</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Tuition Package</label>
                  <select
                    value={formData.packageType}
                    onChange={(e) => {
                      const val = e.target.value;
                      let amt = 6000;
                      let limit = 4;
                      if (val.includes('12')) { amt = 15000; limit = 12; }
                      else if (val.includes('8')) { amt = 11000; limit = 8; }
                      setFormData({ ...formData, packageType: val, packageAmount: amt, packageLimit: limit });
                    }}
                  >
                    <option value="4 Classes Package (₹6,000)">4 Classes Package (₹6,000)</option>
                    <option value="8 Classes Package (₹11,000)">8 Classes Package (₹11,000)</option>
                    <option value="12 Classes Package (₹15,000)">12 Classes Package (₹15,000)</option>
                    <option value="Custom Package">Custom Package</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Class Timings (IST Only) *</label>
                  <input
                    type="text"
                    required
                    value={formData.classTimings}
                    onChange={(e) => setFormData({ ...formData, classTimings: e.target.value })}
                    placeholder="e.g. 05:00 PM - 06:00 PM IST"
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Weekly Schedule</label>
                  <input
                    type="text"
                    value={formData.classDays}
                    onChange={(e) => setFormData({ ...formData, classDays: e.target.value })}
                    placeholder="e.g. Tuesday & Friday"
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Total Classes Completed</label>
                  <input
                    type="number"
                    value={formData.completedClassesCount}
                    onChange={(e) => setFormData({ ...formData, completedClassesCount: Number(e.target.value) })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Fee Status</label>
                  <select
                    value={formData.feeStatus}
                    onChange={(e) => setFormData({ ...formData, feeStatus: e.target.value })}
                  >
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="overdue">Overdue</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Last Class Date</label>
                  <input
                    type="date"
                    value={formData.lastClassDate}
                    onChange={(e) => setFormData({ ...formData, lastClassDate: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Last Payment Date</label>
                  <input
                    type="date"
                    value={formData.lastPaymentDate}
                    onChange={(e) => setFormData({ ...formData, lastPaymentDate: e.target.value })}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">
                  Cancel
                </button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save Student Record
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Teacher Add/Edit Modal
    function TeacherModal({ teacher, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: teacher?.name || '',
        username: teacher?.username || '',
        password: teacher?.password || '',
        email: teacher?.email || '',
        phone: teacher?.phone || '',
        specialization: teacher?.specialization || 'Music Production & Vocals'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                {teacher ? `Edit Teacher: ${teacher.name}` : 'Add New Teacher'}
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Teacher Full Name *</label>
                  <input
                    type="text"
                    required
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Login User ID / Username *</label>
                  <input
                    type="text"
                    required
                    value={formData.username}
                    onChange={(e) => setFormData({ ...formData, username: e.target.value })}
                    placeholder="e.g. gaurav or rohit"
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Login Password *</label>
                  <input
                    type="text"
                    required
                    value={formData.password}
                    onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                    placeholder="Password for teacher portal"
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Specialization / Subject</label>
                  <input
                    type="text"
                    value={formData.specialization}
                    onChange={(e) => setFormData({ ...formData, specialization: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Phone</label>
                  <input
                    type="text"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">
                  Cancel
                </button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Save Teacher
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Payment Record Modal
    function PaymentModal({ students, onClose, onSave }) {
      const [formData, setFormData] = useState({
        studentId: students[0]?.id || '',
        amount: 6000,
        paymentDate: new Date().toISOString().split('T')[0],
        packageType: '4 Classes Package',
        paymentMethod: 'UPI / GPay',
        receiptNo: `REC-${Date.now().toString().slice(-6)}`,
        remarks: 'Tuition fee renewal'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        const std = students.find(s => s.id === formData.studentId);
        onSave({
          ...formData,
          studentName: std ? std.name : 'Student',
          amount: Number(formData.amount)
        });
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Record Tuition Payment
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Select Student *</label>
                  <select
                    value={formData.studentId}
                    onChange={(e) => setFormData({ ...formData, studentId: e.target.value })}
                  >
                    {students.map(s => (
                      <option key={s.id} value={s.id}>{s.name} ({s.teacherName || 'Gaurav'})</option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Payment Date *</label>
                  <input
                    type="date"
                    required
                    value={formData.paymentDate}
                    onChange={(e) => setFormData({ ...formData, paymentDate: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Amount (₹) *</label>
                  <input
                    type="number"
                    required
                    value={formData.amount}
                    onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Payment Method</label>
                  <select
                    value={formData.paymentMethod}
                    onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                  >
                    <option value="UPI / GPay / Paytm">UPI / GPay / Paytm</option>
                    <option value="Bank Net Banking / NEFT">Bank Net Banking / NEFT</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Credit / Debit Card</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Package Type</label>
                  <input
                    type="text"
                    value={formData.packageType}
                    onChange={(e) => setFormData({ ...formData, packageType: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Receipt / Transaction Ref</label>
                  <input
                    type="text"
                    value={formData.receiptNo}
                    onChange={(e) => setFormData({ ...formData, receiptNo: e.target.value })}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-check"></i> Save Payment Record
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Backlog Class Modal
    function BacklogClassModal({ students, teachers, onClose, onSave }) {
      const [formData, setFormData] = useState({
        studentId: students[0]?.id || '',
        date: new Date().toISOString().split('T')[0],
        classNumber: 1,
        time: '05:00 PM - 06:00 PM IST',
        status: 'Present',
        remarks: 'Previous class session completed before app launch'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Add Historical / Backlog Class
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="modal-body form-grid">
                <div className="form-group">
                  <label className="form-label">Student *</label>
                  <select
                    value={formData.studentId}
                    onChange={(e) => setFormData({ ...formData, studentId: e.target.value })}
                  >
                    {students.map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Date Class Was Held *</label>
                  <input
                    type="date"
                    required
                    value={formData.date}
                    onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Class Number</label>
                  <input
                    type="number"
                    value={formData.classNumber}
                    onChange={(e) => setFormData({ ...formData, classNumber: Number(e.target.value) })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Time (IST)</label>
                  <input
                    type="text"
                    value={formData.time}
                    onChange={(e) => setFormData({ ...formData, time: e.target.value })}
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Status</label>
                  <select
                    value={formData.status}
                    onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                  >
                    <option value="Present">Present</option>
                    <option value="Leave">Leave</option>
                    <option value="Absent">Absent</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Remarks / Topic</label>
                  <input
                    type="text"
                    value={formData.remarks}
                    onChange={(e) => setFormData({ ...formData, remarks: e.target.value })}
                  />
                </div>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-plus"></i> Save Historical Class
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Edit Google Sheet URL Modal
    function EditSheetUrlModal({ currentUrl, onClose, onSave }) {
      const [url, setUrl] = useState(currentUrl);

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ fontSize: '1.25rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>
                Configure Google Sheet Link
              </h3>
              <button onClick={onClose} style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(url.trim()); }}>
              <div className="modal-body">
                <label className="form-label" style={{ marginBottom: '0.4rem', display: 'block' }}>
                  Google Spreadsheet URL
                </label>
                <input
                  type="url"
                  required
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://docs.google.com/spreadsheets/d/..."
                  style={{ width: '100%' }}
                />
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.65rem' }}>
                  Make sure your Google Sheet sharing setting is set to <strong>"Anyone with the link can view"</strong> so that the app can display and sync it seamlessly.
                </p>
              </div>

              <div className="modal-footer">
                <button type="button" onClick={onClose} className="btn-secondary">Cancel</button>
                <button type="submit" className="btn-primary">
                  <i className="fas fa-save"></i> Save Link
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Helper Stat Card Component
    function StatCard({ label, value, icon, color }) {
      return (
        <div style={{
          background: 'var(--bg-surface)',
          border: '1px solid var(--border-color)',
          borderRadius: 'var(--radius-lg)',
          padding: '1.15rem 1.25rem',
          display: 'flex',
          alignItems: 'center',
          gap: '1rem',
          boxShadow: 'var(--shadow-sm)'
        }}>
          <div style={{
            width: '44px',
            height: '44px',
            borderRadius: '12px',
            background: `${color}20`,
            border: `1px solid ${color}40`,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            color: color,
            fontSize: '1.2rem'
          }}>
            <i className={`fas ${icon}`}></i>
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>{label}</div>
            <div style={{ fontSize: '1.4rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>{value}</div>
          </div>
        </div>
      );
    }

    // Toast Component
    function Toast({ toast }) {
      return (
        <div className="toast-container">
          <div className="toast-box" style={{
            borderColor: toast.type === 'success' ? '#10B981' : toast.type === 'error' ? '#EF4444' : 'var(--border-light)'
          }}>
            <i className={`fas ${toast.type === 'success' ? 'fa-check-circle' : toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`}
               style={{ color: toast.type === 'success' ? '#34D399' : toast.type === 'error' ? '#F87171' : '#818CF8' }}
            ></i>
            <span>{toast.message}</span>
          </div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
