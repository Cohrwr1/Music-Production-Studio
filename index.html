                </div>
              )}

              {adminTab === 'sheet' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem' }}>
                    <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Embedded Google Sheet</p>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                      <button onClick={onEditSheetUrl} className="btn-secondary" style={{ padding: '0.45rem 0.85rem', fontSize: '0.8rem' }}>Change Link</button>
                      <a href={sheetUrl} target="_blank" rel="noreferrer" className="btn-primary" style={{ padding: '0.45rem 0.85rem', fontSize: '0.8rem', textDecoration: 'none' }}>Open Sheet</a>
                    </div>
                  </div>
                  <div style={{ height: '480px', borderRadius: 'var(--radius-md)', overflow: 'hidden', border: '1px solid var(--border-color)' }}>
                    <iframe src={sheetUrl.includes('/edit') ? sheetUrl.replace('/edit', '/pubhtml?widget=true') : sheetUrl} style={{ width: '100%', height: '100%', border: 'none', background: 'white' }} title="Sheet" />
                  </div>
                </div>
              )}

              {adminTab === 'db' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1.25rem' }}>
                    <div>
                      <h4 style={{ fontWeight: 800 }}>In-App Database Storage</h4>
                      <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Download full backup or force cloud sync</p>
                    </div>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                      <button onClick={onSyncCloud} className="btn-secondary" style={{ fontSize: '0.85rem' }}>Force Cloud Sync</button>
                      <button onClick={onExportBackup} className="btn-primary" style={{ fontSize: '0.85rem' }}>Download Backup (.json)</button>
                    </div>
                  </div>
                  <div style={{ background: 'var(--bg-app)', padding: '1rem', borderRadius: 'var(--radius-md)', maxHeight: '380px', overflowY: 'auto', fontFamily: 'monospace', fontSize: '0.8rem', color: '#CBD5E1' }}>
                    <pre>{JSON.stringify({ studentsCount: students.length, classesLogged: classesHistory.length, paymentsCount: payments.length }, null, 2)}</pre>
                  </div>
                </div>
              )}
            </div>

            <div className="modal-footer" style={{ background: 'var(--bg-surface-elevated)' }}>
              <button onClick={onClose} className="btn-secondary">Close Controls</button>
            </div>
          </div>
        </div>
      );
    }

    // Helper Stat Card
    function StatCard({ label, value, icon, color }) {
      return (
        <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-lg)', padding: '1.15rem 1.25rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
          <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: `${color}20`, border: `1px solid ${color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center', color, fontSize: '1.2rem' }}>
            <i className={`fas ${icon}`}></i>
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>{label}</div>
            <div style={{ fontSize: '1.4rem', fontWeight: 800, fontFamily: 'var(--font-heading)' }}>{value}</div>
          </div>
        </div>
      );
    }

    // Helper Tab Button
    function TabButton({ active, onClick, icon, label, badge }) {
      return (
        <button
          onClick={onClick}
          style={{
            padding: '0.85rem 1.15rem',
            background: 'none',
            color: active ? 'white' : 'var(--text-muted)',
            borderBottom: active ? '3px solid var(--primary)' : '3px solid transparent',
            fontWeight: active ? 700 : 600,
            fontSize: '0.9rem',
            display: 'inline-flex',
            alignItems: 'center',
            gap: '0.6rem',
            whiteSpace: 'nowrap'
          }}
        >
          <i className={`fas ${icon}`} style={{ color: active ? 'var(--primary)' : 'inherit' }}></i>
          <span>{label}</span>
          {badge !== undefined && (
            <span style={{ background: active ? 'var(--primary-light)' : 'var(--bg-surface-elevated)', color: active ? '#818CF8' : 'var(--text-muted)', padding: '0.15rem 0.5rem', borderRadius: '999px', fontSize: '0.75rem', fontWeight: 700 }}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // Toast
    function Toast({ toast }) {
      return (
        <div className="toast-container">
          <div className="toast-box" style={{ borderColor: toast.type === 'success' ? '#10B981' : toast.type === 'error' ? '#EF4444' : 'var(--border-light)' }}>
            <i className={`fas ${toast.type === 'success' ? 'fa-check-circle' : toast.type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`}
               style={{ color: toast.type === 'success' ? '#34D399' : toast.type === 'error' ? '#F87171' : '#818CF8' }}
            ></i>
            <span>{toast.message}</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
