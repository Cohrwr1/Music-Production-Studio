  <style>
    :root {
      --bg-app: #0F172A;
      --bg-surface: #1E293B;
      --bg-surface-elevated: #334155;
      --bg-subtle: #0B1120;
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;
      
      --border-color: #334155;
      --border-light: #475569;
      
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      
      --accent: #EC4899;
      --accent-gradient: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
      
      --present: #10B981;
      --present-bg: rgba(16, 185, 129, 0.15);
      --present-border: rgba(16, 185, 129, 0.4);
      
      --absent: #EF4444;
      --absent-bg: rgba(239, 68, 68, 0.15);
      --absent-border: rgba(239, 68, 68, 0.4);
      
      --leave: #F59E0B;
      --leave-bg: rgba(245, 158, 11, 0.15);
      --leave-border: rgba(245, 158, 11, 0.4);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
      
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-app); }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-elevated); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    button {
      font-family: var(--font-main);
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
    }

    input, select, textarea {
      font-family: var(--font-main);
      outline: none;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-paid {
      background: var(--present-bg);
      color: #34D399;
      border: 1px solid var(--present-border);
    }

    .badge-pending {
      background: var(--leave-bg);
      color: #FBBF24;
      border: 1px solid var(--leave-border);
    }

    .badge-overdue {
      background: var(--absent-bg);
      color: #F87171;
      border: 1px solid var(--absent-border);
    }

    .badge-next {
      background: rgba(99, 102, 241, 0.18);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-secondary:hover {
      background: var(--border-light);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-back {
      background: var(--bg-surface-elevated);
      color: #A5B4FC;
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-back:hover {
      background: var(--border-light);
      color: white;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body { padding: 1.5rem; }

    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-light);
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    // Helper: Calculate Next Class Date given Weekly Day (e.g. 'Thursday' or 'Saturday')
    function calculateNextClassDate(weeklyDay, baseDateStr = null) {
      if (!weeklyDay) return '';
      const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      const cleanDay = weeklyDay.toLowerCase().replace('every ', '').trim();
      const targetDay = days.indexOf(cleanDay);
      if (targetDay === -1) return '';

      const base = baseDateStr ? new Date(baseDateStr) : new Date();
      const currentDay = base.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) {
        diff += 7; // Next occurrence next week
      }
      const nextDate = new Date(base);
      nextDate.setDate(base.getDate() + diff);
      return nextDate.toISOString().split('T')[0];
    }

    // Helper: Calculate target day in THIS current week (or coming up)
    function calculateThisWeekClassDate(weeklyDay) {
      if (!weeklyDay) return '';
      const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      const cleanDay = weeklyDay.toLowerCase().replace('every ', '').trim();
      const targetDay = days.indexOf(cleanDay);
      if (targetDay === -1) return '';

      const today = new Date();
      const currentDay = today.getDay();
      let diff = targetDay - currentDay;
      if (diff < 0) {
        diff += 7; // has already passed this week, so upcoming occurrence
      }
      const nextDate = new Date(today);
      nextDate.setDate(today.getDate() + diff);
      return nextDate.toISOString().split('T')[0];
    }

        return dateStr;
